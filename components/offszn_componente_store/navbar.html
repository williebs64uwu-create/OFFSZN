<!-- 
    COMPONENTE: NAVBAR STORE BUILDER
    ESTADO: DINÁMICO (Usado en el despliegue perfil-deploy.html)
    Este componente es la plantilla maestra para el navbar.
    Los estilos viven globalmente en theme-base.css bajo .rendered-navbar.prof-nav
-->
<div class="rendered-navbar prof-nav" data-section-id="nav_1">
    
    <!-- LADO IZQUIERDO: LOGO O AVATAR + NOMBRE -->
    <div class="nav-left-group">
        <button class="mobile-hamburger-btn" aria-label="Menu" onclick="const drawerOpen = document.getElementById('mobile-nav-drawer'); if(drawerOpen) { drawerOpen.classList.add('active'); document.body.style.overflow = 'hidden'; }">
            <i class="bi bi-list"></i>
        </button>
        <!-- {{DYNAMIC_USER_LINK}} = ej: /@willieinspired -->
        <a href="{{DYNAMIC_USER_LINK}}" id="nav-user-link" class="user-nav-info">
            <!-- {{DYNAMIC_AVATAR_URL}} = URL de Supabase -->
            <img src="{{DYNAMIC_AVATAR_URL}}" id="nav-avatar" class="user-nav-avatar" alt="Avatar">
            <!-- {{DYNAMIC_LOGO_TEXT}} = 'MI TIENDA' o username -->
            <span id="nav-nickname" class="user-nav-name">{{DYNAMIC_LOGO_TEXT}}</span>
        </a>
    </div>
    
    <!-- CENTRO: ENLACES DINÁMICOS -->
    <div class="nav-links">
        <!-- Generados dinámicamente según section.props.links -->
        <a href="#products-section" class="nav-link">BEATS</a>
        <a href="#services-section" class="nav-link">SERVICIOS</a>
    </div>
    
    <!-- LADO DERECHO: ACCIONES EXTREMAS -->
    <div class="nav-right-extreme">
        <!-- EXPLORAR GLOBAL -->
        <a href="/explorar.html" class="nav-text-btn" style="color:#aaa; font-size:0.85rem; font-weight:600; text-decoration:none; margin-right: 12px; display: flex; align-items: center; gap: 4px;">
            Explorar <i class="bi bi-arrow-right-short" style="font-size: 1.1rem; line-height: 1;"></i>
        </a>

        <!-- CARRITO DINÁMICO -->
        <a href="#" class="nav-cart-trigger" id="nav-cart-btn" title="Carrito" onclick="if(typeof toggleCartPanel === 'function') { toggleCartPanel(event); } else if(window.CartManager) { window.CartManager.openCart(); } else { event.preventDefault(); }">
            <i class="bi bi-cart3"></i>
            <span id="cart-count-badge" class="cart-badge-circle" style="display:none;">0</span>
        </a>

        <!-- SECCIÓN DE AUTENTICACIÓN (Condicional) -->
        <!-- NOTA: En store-builder, se inyecta por premium-profile-bg.js, 
             pero el layout maestro lo contempla si se necesita. -->
    </div>

    <!-- MOBILE NAVIGATION DRAWER -->
    <div id="mobile-nav-drawer" class="mobile-drawer">
        <div class="drawer-backdrop" onclick="const drawerBackdrop = document.getElementById('mobile-nav-drawer'); if(drawerBackdrop) drawerBackdrop.classList.remove('active');"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <span class="drawer-title">Navegación</span>
                <button id="drawer-close-btn" class="drawer-close" aria-label="Cerrar" onclick="const drawerClose = document.getElementById('mobile-nav-drawer'); if(drawerClose) drawerClose.classList.remove('active');">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="drawer-links">
                <a href="#products-section" class="drawer-link"><i class="bi bi-music-note"></i> BEATS</a>
                <a href="#services-section" class="drawer-link"><i class="bi bi-stars"></i> SERVICIOS</a>
            </div>
        </div>
    </div>

</div>
