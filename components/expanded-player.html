<link rel="stylesheet" href="/css/expanded-player.css">
<div id="expanded-player-modal" class="expanded-player-overlay">
    <div class="ep-content">
        <!-- Header -->
        <div class="ep-header">
            <button class="ep-close-btn" id="ep-close-btn"><i class="bi bi-chevron-down"></i></button>
        </div>

        <!-- Cover Art (Big) -->
        <div class="ep-cover-wrapper">
            <img id="ep-cover"
                src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
                alt="Cover">
        </div>

        <!-- Info: Title & Subtitle -->
        <div class="ep-info-section">
            <h2 id="ep-title" class="ep-title">--</h2>
            <div id="ep-subtitle" class="ep-subtitle">--</div>
            <div id="ep-badges" class="ep-badges"></div>
        </div>

        <!-- Big Waveform & Time -->
        <div class="ep-waveform-section">
            <div id="ep-waveform" class="ep-waveform-container"></div>
            <div id="ep-time" class="ep-time">0:00</div>
        </div>

        <!-- Actions Row (Like, Download, Add, Options) -->
        <div class="ep-actions-row">
            <button class="ep-action-btn" id="ep-btn-options" title="Compartir"><i class="bi bi-share"></i></button>
            <div class="ep-action-separator"></div>
            <button class="ep-action-btn" id="ep-btn-add"><i class="bi bi-plus-lg"></i></button>
            <button class="ep-action-btn ep-btn-like" id="ep-btn-like"><i class="bi bi-heart"></i></button>
            <button class="ep-action-btn" id="ep-btn-download"><i class="bi bi-download"></i></button>
        </div>

        <!-- Main Controls Row (Loop, Prev, Play, Next, Share) -->
        <div class="ep-controls-row">
            <button class="ep-ctrl-small" id="ep-btn-loop"><i class="bi bi-arrow-repeat"></i></button>
            <button class="ep-ctrl-med" id="ep-btn-prev"><i class="bi bi-skip-start-fill"></i></button>
            <button class="ep-ctrl-large" id="ep-btn-play"><i class="bi bi-play-fill"
                    style="margin-left:4px;"></i></button>
            <button class="ep-ctrl-med" id="ep-btn-next"><i class="bi bi-skip-end-fill"></i></button>
            <button class="ep-ctrl-small" id="ep-btn-share"><i class="bi bi-upload"></i></button>
        </div>
    </div>
</div>
