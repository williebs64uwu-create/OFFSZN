<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFSZN | Buscar Beats, Kits & Presets</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/css/auth-ui.css">
    <link rel="stylesheet" href="/css/global-overlays.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/avatar-manager.css">
    <link rel="stylesheet" href="/css/search.css?v=1000">
    <link rel="stylesheet" href="/css/search-mobile.css?v=1">
    <link rel="stylesheet" href="/css/share-modal.css">
    <link rel="stylesheet" href="/css/sticky-player.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- Precise Mobile layout overrides moved to bottom of head -->
    <!-- 1. Cargar Configuración Segura y Supabase -->
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"
        integrity="sha384-o2Uz8M8jf3RRbNF9dFLYtjA2ohqUgp6vUxr43Uzvt8MJkkLNvpXvLCUVbWh+cadK"
        crossorigin="anonymous"></script>
    <script>
        window.supabaseClient = null;
        // Reiniciar Auth después de cargar env.js
        window.addEventListener('load', () => {
            if (window.AuthUtils && typeof window.AuthUtils.initSupabase === 'function') {
                window.AuthUtils.initSupabase();
            }
        });
    </script>
    <script src="/script/auth-utils.js?v=11"></script>
    <script src="/script/id-obfuscator.js"></script>
    <style>
        /* Modern Mobile Results (V2) - Strict Implementation */
        @media (max-width: 768px) {
            /* Aggressive Universal Reset for Mobile Search */
            html, body {
                width: 100% !important;
                overflow-x: hidden !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .search-main-container {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                outline: none !important;
                box-sizing: border-box !important;
            }

            /* Hide the sidebar completely on mobile to prevent layout shifts */
            .search-sidebar {
                display: none !important;
            }

            .search-results-wrapper {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 16px !important; /* Side padding for content only */
                margin: 0 !important;
                border: none !important;
                outline: none !important;
                box-sizing: border-box !important;
                display: block !important;
            }

            #search-results-container {
                width: 100% !important;
                display: block !important;
                margin-top: 10px !important;
                border: none !important;
                outline: none !important;
            }

            .results-header {
                padding: 20px 0 !important;
                border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
                width: 100% !important;
                margin-top: 20px !important;
                margin-bottom: 10px !important;
            }

            .offszn-m-track-v2 {
                background: #000 !important;
                padding: 16px 0 !important;
                border: none !important;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                box-sizing: border-box !important;
                margin: 0 !important;
            }

            .m-v2-main-row {
                display: grid !important;
                grid-template-columns: 52px 1fr 135px !important;
                grid-template-areas: "thumb info actions" !important;
                gap: 12px !important;
                align-items: center !important;
                width: 100% !important;
            }

            .m-v2-thumb {
                grid-area: thumb !important;
                width: 52px !important;
                height: 52px !important;
                border-radius: 8px !important;
                overflow: hidden !important;
                background: #111 !important;
                position: relative !important;
            }

            .m-v2-thumb img {
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important;
            }

            .m-v2-play-overlay {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                background: rgba(0,0,0,0.3) !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .m-v2-play-overlay i {
                color: #fff !important;
                font-size: 1.4rem !important;
            }

            .m-v2-info {
                grid-area: info !important;
                min-width: 0 !important;
            }

            .m-v2-title {
                color: #fff !important;
                font-weight: 800 !important;
                font-size: 0.95rem !important;
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                display: block !important;
                font-family: 'Plus Jakarta Sans', sans-serif !important;
            }

            .m-v2-producer {
                color: #888 !important;
                font-size: 0.8rem !important;
                font-weight: 500 !important;
                display: block !important;
                margin-top: -2px !important;
            }

            .m-v2-meta-row {
                display: flex !important;
                gap: 6px !important;
                margin-top: 6px !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
            }

            .m-v2-tag {
                background: rgba(255, 255, 255, 0.05) !important;
                border: 1px solid rgba(255, 255, 255, 0.08) !important;
                color: #bbb !important;
                font-size: 0.62rem !important;
                font-weight: 800 !important;
                padding: 1px 7px !important;
                border-radius: 4px !important;
                white-space: nowrap !important;
                text-transform: uppercase !important;
                line-height: normal !important;
            }

            .m-v2-actions {
                grid-area: actions !important;
                display: flex !important;
                align-items: center !important;
                justify-content: flex-end !important;
                gap: 8px !important;
                padding-right: 4px !important;
            }

            .m-v2-action-heart, .m-v2-action-more {
                width: 34px !important;
                height: 34px !important;
                background: rgba(255, 255, 255, 0.1) !important;
                backdrop-filter: blur(5px) !important;
                border: 1px solid rgba(255, 255, 255, 0.08) !important;
                border-radius: 50% !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 0 !important;
                cursor: pointer !important;
                flex-shrink: 0 !important;
            }

            .m-v2-action-heart i, .m-v2-action-more i {
                font-size: 1rem !important;
                color: #fff !important;
            }

            .m-v2-action-heart i.liked {
                color: #ff4757 !important;
            }

            .m-v2-price-btn {
                background: #fff !important;
                color: #000 !important;
                font-size: 0.7rem !important;
                font-weight: 800 !important;
                padding: 4px 10px !important;
                border-radius: 8px !important;
                white-space: nowrap !important;
                line-height: normal !important;
                min-width: 48px !important;
                text-align: center !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                height: 28px !important;
            }

            .m-v2-price-btn i {
                font-size: 0.9rem !important;
                color: #000 !important;
            }

            /* Hide Desktop Elements */
            .results-sort, .sidebar-main-title, .filter-header-static, .desktop-only {
                display: none !important;
            }
        }

        /* Continuous pulse animation for skeletons */
        @keyframes skeleton-pulse {
            0% { opacity: 0.6; }
            50% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }
        .skeleton-pulse {
            animation: skeleton-pulse 1.5s infinite ease-in-out;
            background: rgba(255, 255, 255, 0.05) !important;
        }
    </style>
</head>

<body>


    <!-- ==================== DYNAMIC NAVBAR ==================== -->
    <div id="navbar-placeholder">
        <!-- Static shell to prevent flash before JS loads -->
        <div
            style="background: rgba(0, 0, 0, 0.95); height: 58px; width: 100%; border-bottom: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;">
        </div>
    </div>
    <script src="/script/load-navbar.js?v=21"></script>

    <main class="search-main-container">
        <!-- Sidebar Filters -->
        <aside class="search-sidebar">
            <div class="filter-group">
                <div class="filter-header-static">
                    <span class="filter-title"><i class="bi bi-grid"></i> CATEGORÍA</span>
                </div>
                <div class="filter-content">
                    <div class="filter-options">
                        <label class="premium-checkbox">
                            <input type="checkbox" class="category-check" value="beat">
                            <span class="checkmark"></span>
                            <span class="label-text">Beats</span>
                        </label>
                        <label class="premium-checkbox">
                            <input type="checkbox" class="category-check" value="drumkit">
                            <span class="checkmark"></span>
                            <span class="label-text">Drum Kits</span>
                        </label>
                        <label class="premium-checkbox">
                            <input type="checkbox" class="category-check" value="loopkit">
                            <span class="checkmark"></span>
                            <span class="label-text">Loop Kits</span>
                        </label>
                        <label class="premium-checkbox">
                            <input type="checkbox" class="category-check" value="preset">
                            <span class="checkmark"></span>
                            <span class="label-text">Presets</span>
                        </label>
                        <label class="premium-checkbox">
                            <input type="checkbox" class="category-check" value="template">
                            <span class="checkmark"></span>
                            <span class="label-text">Plantillas</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- BPM Range Slider (Dual Handle) -->
            <div class="filter-group">
                <div class="filter-header-flex">
                    <span class="filter-title"><i class="bi bi-speedometer2"></i> TEMPO</span>
                    <span id="bpm-range-display" class="filter-value-display">40 - 250</span>
                </div>
                <div class="filter-content">
                    <div class="dual-range-container">
                        <div class="slider-track"></div>
                        <input type="range" id="bpm-min-slider" min="40" max="250" value="40" class="range-handle">
                        <input type="range" id="bpm-max-slider" min="40" max="250" value="250" class="range-handle">
                    </div>
                    <div class="filter-sub-action">
                        <label class="premium-checkbox sm">
                            <input type="checkbox" id="double-tempo-check">
                            <span class="checkmark"></span>
                            <span class="label-text">Doble Tempo</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-header-flex">
                    <span class="filter-title"><i class="bi bi-tag"></i> PRECIO</span>
                    <span id="price-display" class="filter-value-display">Cualquiera</span>
                </div>
                <div class="filter-content">
                    <div class="filter-sub-action" style="margin-bottom: 16px;">
                        <label class="premium-checkbox sm">
                            <input type="checkbox" id="free-filter-check">
                            <span class="checkmark"></span>
                            <span class="label-text" style="color: #38bdf8; font-weight: 700;">Gratis</span>
                        </label>
                    </div>
                    <div class="single-range-container">
                        <input type="range" id="price-max-slider" min="10" max="1000" value="1000" step="10"
                            class="premium-slider">
                    </div>
                </div>
            </div>

            <!-- Filter Group: Key (The focus of the request) -->
            <div class="filter-group accordion">
                <div class="filter-header" onclick="toggleFilterAccordion(this)">
                    <span class="filter-title"><i class="bi bi-music-note-beamed"></i> KEY</span>
                    <i class="bi bi-chevron-down accordion-icon"></i>
                </div>
                <div class="filter-content">
                    <div class="filter-options filter-options-scroll" id="key-options-container">
                        <!-- Key options will be injected here via JS -->
                    </div>
                    <button class="show-more-btn" onclick="toggleShowMoreKeys(this)">
                        <i class="bi bi-plus"></i> <span class="btn-text">Mostrar más</span>
                    </button>
                </div>
            </div>

            <button id="clear-filters-btn" class="btn-clear-filters">Limpiar Filtros</button>
        </aside>

        <!-- Results Area -->
        <section class="search-results-wrapper">
            <div class="results-header">
                <div class="results-count">
                    <span id="results-count-val">0</span> Resultados
                </div>
                <div class="results-sort">
                    <div class="custom-sort-container" id="customSortContainer">
                        <button class="sort-trigger" id="sortTrigger">
                            <span id="current-sort-label">Más Relevantes</span>
                            <i class="bi bi-chevron-down"></i>
                        </button>
                        <div class="sort-menu" id="sortMenu">
                            <div class="sort-item selected" data-value="relevance">Más Relevantes</div>
                            <div class="sort-item" data-value="newest">Más Recientes</div>
                            <div class="sort-item" data-value="price_low">Precio: Menor a Mayor</div>
                            <div class="sort-item" data-value="price_high">Precio: Mayor a Menor</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="search-results-container">
                <!-- Results (Horizontal v2 on Mobile) will be injected here -->
            </div>

            <!-- Recommendation Section -->
            <div class="recommendation-section" style="margin-top: 60px;">
                <h3
                    style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.2rem; margin-bottom: 24px; color: #fff;">
                    Tal vez te interese</h3>
                <div id="recommendations-container" class="recommendation-grid">
                    <!-- Recommendations injected here -->
                </div>
            </div>
        </section>
    </main>
    <!-- ==================== SIDE PANELS ==================== -->

    <!-- BACKDROP -->
    <div class="overlay-backdrop" id="globalBackdrop" onclick="closeAllOverlays()"></div>

    <!-- CART SIDE PANEL -->
    <div class="side-panel" id="globalCartPanel">
        <div class="panel-header">
            <div class="panel-title" style="display: flex; align-items: center; gap: 8px;">
                <div style="position: relative; display: flex;">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-panel-count" class="notification-badge"
                        style="position: absolute; top: -6px; right: -6px; display: flex;">1</span>
                </div>
                Tu Carrito
            </div>
            <button class="panel-close" onclick="closeAllOverlays()">&times;</button>
        </div>
        <div class="panel-content" id="cart-items-container">
            <div style="text-align:center; padding: 40px 0; color: #666;">
                <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <p>Tu carrito está vacío</p>
            </div>
        </div>
        <div class="cart-total-section" id="cart-summary">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem; color:#fff; font-weight:700;">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="btn-checkout-global" id="cart-checkout-btn"
                onclick="window.location.href='/pages/checkout.html'">
                <i class="bi bi-lock-fill" style="margin-right:6px;"></i> Ir a Pagar Seguro
            </button>

            <!-- TRUST BADGES -->
            <div
                style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
                <p style="font-size: 0.65rem; color: #666; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700;">
                    METODOS DE PAGO SEGUROS</p>
                <div style="display: flex; gap: 12px; justify-content: center; align-items: center; opacity: 0.8; filter: grayscale(100%); transition: filter 0.3s;"
                    onmouseover="this.style.filter='grayscale(0%)'" onmouseout="this.style.filter='grayscale(100%)'">
                    <i class="fab fa-cc-paypal" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-visa" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-mastercard" style="font-size: 26px; color: #fff;"></i>
                    <div
                        style="background: #742284; color: white; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center;">
                        YAPE</div>
                    <div
                        style="background: #00d3de; color: white; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center;">
                        PLIN</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Library needed for Sticky Player -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>

    <script src="/script/sticky-player.js"></script>
    <script src="/script/cart.js"></script>
    <script src="/script/notifications.js"></script>
    <script src="/script/avatar-manager.js"></script>
    <script src="/script/navbar.js?v=20" type="module"></script>
    <script src="/script/favorites-manager.js"></script>
    <script src="/script/r2-loader.js"></script>

    <script src="/script/search.js?v=530" type="module"></script>

    <!-- ==================== FOOTER ==================== -->
    <!-- Este div es el placeholder donde se inyectará el componente de footer (Desktop/Mobile) -->
    <!-- Se carga mediante /script/footer.js -->
    <div id="footer-placeholder"></div>

    <!-- Mobile Renderer Handled modularly in /script/search.js -->

</body>

</html>
