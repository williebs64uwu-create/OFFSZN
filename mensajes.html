<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes | OFFSZN</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth-ui.css">
    <link rel="stylesheet" href="/css/global-overlays.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/sticky-player.css">
    <link rel="stylesheet" href="/css/hover-card.css">
    <link rel="stylesheet" href="/css/chat-ui.css"> <!-- Specific case -->
    <link rel="stylesheet" href="/css/chat-skeleton.css">
    <link rel="stylesheet" href="/css/chat-modal.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- 1. Cargar Supabase (Moved to Head for Global Access) -->
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"
        integrity="sha384-o2Uz8M8jf3RRbNF9dFLYtjA2ohqUgp6vUxr43Uzvt8MJkkLNvpXvLCUVbWh+cadK"
        crossorigin="anonymous"></script>
    <script>
        window.supabaseClient = null;
        // Ensure initialization after environment variables load
        window.addEventListener('load', () => {
            if (window.AuthUtils) {
                window.SUPABASE_URL = window.SUPABASE_URL || window.ENV?.SUPABASE_URL || "";
                window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || window.ENV?.SUPABASE_ANON_KEY || "";
                window.AuthUtils.initSupabase();
            }
        });
    </script>
    <script src="/script/auth-utils.js?v=11"></script>
    <script src="/script/notifications.js"></script>
    <script src="/script/load-navbar.js?v=20" defer></script>
    <!-- Image Compression & Emoji Libs -->
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.4/dist/index.min.js"></script>
</head>

<body>



    <!-- ==================== EXTRACTED NAVBAR ==================== -->
    <div id="navbar-placeholder">
        <div style="background: rgba(0, 0, 0, 0.95); height: 58px; width: 100%; border-bottom: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;"></div>
    </div>
    <!-- ==================== SIDE PANELS (INJECTED MANUALLY FOR ANALYSIS) ==================== -->

    <!-- BACKDROP -->
    <div class="overlay-backdrop" id="globalBackdrop" onclick="closeAllOverlays()"></div>

    <!-- CART SIDE PANEL -->
    <div class="side-panel" id="globalCartPanel">
        <div class="panel-header">
            <div class="panel-title" style="display: flex; align-items: center; gap: 8px;">
                <div style="position: relative; display: flex;">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-panel-count" class="notification-badge"
                        style="position: absolute; top: -6px; right: -6px; display: flex;">1</span>
                </div>
                Tu Carrito
            </div>
            <button class="panel-close" onclick="closeAllOverlays()">&times;</button>
        </div>
        <!-- ID CHANGED: globalCartItems -> cart-items-container to match script/cart.js -->
        <div class="panel-content" id="cart-items-container">
            <div style="text-align:center; padding: 40px 0; color: #666;">
                <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <p>Tu carrito está vacío</p>
            </div>
        </div>
        <!-- ID ADDED: cart-summary (needed by script) -->
        <div class="cart-total-section" id="cart-summary">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem; color:#fff; font-weight:700;">
                <span>Total:</span>
                <!-- ID CHANGED for JS compatibility -->
                <span id="cart-total-price">$0.00</span>
            </div>
            <!-- ID CHANGED for JS compatibility -->
            <button class="btn-checkout-global" id="cart-checkout-btn"
                onclick="window.location.href='/pages/checkout.html'">
                <i class="bi bi-lock-fill" style="margin-right:6px;"></i> Ir a Pagar Seguro
            </button>

            <!-- TRUST BADGES -->
            <div
                style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
                <p style="font-size: 0.65rem; color: #666; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700;">
                    METODOS DE PAGO SEGUROS</p>

                <div style="display: flex; gap: 12px; justify-content: center; align-items: center; opacity: 0.8; filter: grayscale(100%); transition: filter 0.3s;"
                    onmouseover="this.style.filter='grayscale(0%)'" onmouseout="this.style.filter='grayscale(100%)'">
                    <!-- Global -->
                    <i class="fab fa-cc-paypal" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-visa" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-mastercard" style="font-size: 26px; color: #fff;"></i>

                    <!-- Local (Custom Badges) -->
                    <div class="badge-yape">YAPE</div>
                    <div
                        style="background: #00d3de; color: white; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center;">
                        PLIN</div>
                </div>
            </div>
        </div>
    </div>

    <main id="app-main">
        <!-- ==================== CHAT SYSTEM UI ==================== -->
        <div class="chat-wrapper" id="chatSystemRoot" style="display: flex; opacity: 1;">
            <!-- SIDEBAR -->
            <div class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <div class="tabs-nav-wrapper">
                        <div class="tabs-nav-left">
                            <button class="tab-btn active" id="tabPrincipal">Principal</button>
                            <button class="tab-btn" id="tabGrupos">Grupos</button>
                            <div class="tab-indicator" id="tabIndicator" style="transition:none"></div>
                        </div>
                        <div class="tabs-nav-right">
                            <button class="tab-btn-icon" id="btnFilterChats" title="Filtrar">
                                <i class="bi bi-funnel"></i>
                            </button>
                            <button class="action-btn" id="btnNewMessage" title="Nuevo Mensaje">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="search-bar-container">
                    <div class="search-input-wrapper">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Buscar">
                    </div>
                </div>

                <!-- STORIES / ACTIVE USERS -->
                <div class="stories-row" id="chatActiveUsers"></div>

                <!-- CONVERSATIONS LIST -->
                <div class="chat-list">
                    <!-- Skeletons (Initial state) -->
                    <div id="chatSidebarSkeletons">
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                        <div class="skeleton-chat-item skeleton-pulse">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-line name"></div>
                                <div class="skeleton-line preview"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Dynamic conversations rendered here (hidden until skeletons finish) -->
                    <div id="conversationsList" style="display:none"></div>
                </div>
            </div>

            <!-- MAIN CHAT AREA -->
            <div class="chat-main" id="chatMainArea">
                <!-- Empty State -->
                <div class="chat-placeholder" id="chatPlaceholder">
                    <!-- Skeleton for Placeholder -->
                    <div id="chatMainSkeleton" class="skeleton-main-placeholder" style="width: 100%;">
                        <div class="skeleton-circle-lg skeleton-pulse"></div>
                        <div class="skeleton-line skeleton-pulse" style="width: 200px; margin-bottom: 12px;"></div>
                        <div class="skeleton-line skeleton-pulse" style="width: 300px; opacity: 0.5;"></div>
                    </div>

                    <!-- Actual Content (Hidden during skeleton) -->
                    <div id="chatPlaceholderContent"
                        style="display: none; flex-direction: column; align-items: center;">
                        <i class="bi bi-send"
                            style="font-size: 4rem; margin-bottom: 12px; transform: rotate(-10deg); color: #fff;"></i>
                        <h2 style="font-weight: 300; margin-bottom: 6px;">Tus mensajes</h2>
                        <p style="color: #888; margin-bottom: 24px;">Conecta con otros productores y artistas.</p>
                        <button onclick="openNewMessageModal()"
                            style="padding: 7px 16px; background: #8b5cf6; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer;">
                            Enviar mensaje
                        </button>
                    </div>
                </div>

                <!-- Active Chat Interface (Hidden by default) -->
                <div id="activeChatContainer" style="display: none; flex-direction: column; height: 100%;">
                    <div class="chat-header">
                        <div class="chat-header-inner">
                            <div class="header-user">
                                <button class="back-btn" id="chatBackBtn" onclick="backToSidebar()"
                                    style="display: none; background: none; border: none; color: #fff; font-size: 1.4rem; padding: 0; margin-right: 8px; cursor: pointer;">
                                    <i class="bi bi-chevron-left"></i>
                                </button>
                                <div class="header-avatar" id="currentChatAvatar">
                                    <!-- Img -->
                                </div>
                                <div class="header-details">
                                    <h3 id="currentChatName">User</h3>
                                    <span id="currentChatStatus">Active now</span>
                                </div>
                            </div>
                            <div class="chat-actions">
                                <!-- Info button removed as requested -->
                            </div>
                        </div>
                    </div>

                    <div class="messages-feed" id="messagesFeed">
                        <div class="messages-feed-inner" id="messagesFeedInner">
                            <!-- Messages go here -->
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <div id="replyPreviewContainer" class="reply-preview-container">
                            <div class="reply-preview-content">
                                <div class="reply-preview-user" id="replyPreviewUser">Respondiendo a User</div>
                                <div class="reply-preview-text" id="replyPreviewText">Mensaje original...</div>
                            </div>
                            <button class="action-btn" onclick="cancelReply()" style="font-size: 1rem;">&times;</button>
                        </div>
                        <div class="input-container-wrapper">
                            <div class="input-container">
                                <button class="input-btn" id="emojiBtn"><i class="bi bi-emoji-smile"></i></button>
                                <textarea class="chat-input" placeholder="Envía un mensaje..." id="messageInput"
                                    rows="1"></textarea>

                                <!-- Send Button -->
                                <button class="input-btn" id="sendBtn">
                                    <i class="bi bi-send-fill" style="color: #8b5cf6;"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- STYLES -->


    <div id="sticky-player-container"></div>

    <script src="/script/cart.js"></script>
    <script src="/script/notifications.js"></script>

    <script src="/script/navbar.js?v=20" type="module"></script>
    <script src="/script/sticky-player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.StickyPlayer) window.StickyPlayer.init();
        });
    </script>
    <!-- <script src="/script/router.js"></script> -->
    <script src="/script/chat-engine.js?v=24" type="module"></script> <!-- CHAT ENGINE -->


    <!-- ==================== NEW MESSAGE MODAL ==================== -->
    <div id="newMessageModalOverlay" class="chat-modal-overlay" onclick="closeNewMessageModal(event)">
        <div class="chat-modal-container" onclick="event.stopPropagation()">
            <div class="chat-modal-header">
                <button class="chat-modal-back" onclick="closeNewMessageModal()">
                    <i class="bi bi-arrow-left-short" style="font-size: 2rem; color: #a855f7;"></i>
                </button>
                <div class="chat-modal-title">Nuevo mensaje</div>
                <div style="flex:0 0 40px"></div> <!-- Spacer -->
            </div>
            <div class="chat-modal-search">
                <span class="chat-modal-label">Para:</span>
                <input type="text" id="modalSearchInput" class="chat-modal-input" placeholder="Buscar..."
                    autocomplete="off">
            </div>
            <div class="chat-modal-results" id="modalResultsList">
                <!-- Results injected here -->
                <div style="padding: 20px; text-align: center; color: #666; font-size: 0.9rem;">
                    No se encontraron cuentas.
                </div>
            </div>
            <div class="chat-modal-footer">
                <button id="modalChatBtn" class="chat-modal-btn" onclick="startChatFromModal()">Chat</button>
            </div>
        </div>
    </div>

    <!-- ==================== FILTER OVERLAY ==================== -->
    <div id="filterOverlay" class="oz-filter-overlay">
        <div class="filter-header">
            <button class="filter-back" onclick="closeFilterOverlay()">
                <i class="bi bi-chevron-left"></i>
            </button>
            <h2 class="filter-title">Filtros</h2>
            <button class="filter-clear" onclick="clearAllFilters()">Limpiar</button>
        </div>
        <div class="filter-content">
            <div class="filter-section">
                <h3 class="filter-section-title">Roles</h3>
                <div class="filter-chips" id="filterRoles">
                    <button class="filter-chip" data-type="role" data-value="Productor Musical">Productores</button>
                    <button class="filter-chip" data-type="role" data-value="Artista / Cantante">Artistas</button>
                    <button class="filter-chip" data-type="role"
                        data-value="Ingeniero de Mezcla/Master">Ingenieros</button>
                    <button class="filter-chip" data-type="role"
                        data-value="Compositor / Songwriter">Compositores</button>
                    <button class="filter-chip" data-type="role" data-value="Músico / Instrumentista">Músicos</button>
                </div>
            </div>

            <div class="filter-section">
                <h3 class="filter-section-title">Experiencia</h3>
                <div class="filter-chips" id="filterExperience">
                    <button class="filter-chip" data-type="experience"
                        data-value="Principiante (0-1 año)">Principiante</button>
                    <button class="filter-chip" data-type="experience"
                        data-value="Intermedio (1-3 años)">Intermedio</button>
                    <button class="filter-chip" data-type="experience" data-value="Avanzado (3+ años)">Avanzado</button>
                </div>
            </div>

            <div class="filter-section">
                <h3 class="filter-section-title">DAWs</h3>
                <div class="filter-chips" id="filterDAWs">
                    <button class="filter-chip" data-type="daw" data-value="FL Studio">FL Studio</button>
                    <button class="filter-chip" data-type="daw" data-value="Ableton Live">Ableton</button>
                    <button class="filter-chip" data-type="daw" data-value="Logic Pro">Logic Pro</button>
                    <button class="filter-chip" data-type="daw" data-value="Pro Tools">Pro Tools</button>
                    <button class="filter-chip" data-type="daw" data-value="Studio One">Studio One</button>
                    <button class="filter-chip" data-type="daw" data-value="Cubase">Cubase</button>
                </div>
            </div>
        </div>
        <div class="filter-footer">
            <button class="filter-apply-btn" onclick="applyFilters()">Ver resultados</button>
        </div>
    </div>

</body>

</html>
