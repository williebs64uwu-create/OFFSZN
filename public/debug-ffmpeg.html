<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Debug Tool</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #fff;
            padding: 20px;
        }

        .card {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin: auto;
        }

        input,
        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
        }

        #status {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 12px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>FFmpeg Debug Tool</h2>
        <p>Esta página es para probar exclusivamente la carga de FFmpeg.</p>

        <label>1. Selecciona Portada (JPG/PNG)</label>
        <input type="file" id="input-img" accept="image/*">

        <label>2. Selecciona Audio (MP3/WAV)</label>
        <input type="file" id="input-audio" accept="audio/*">

        <button id="btn-load">Cargar FFmpeg</button>
        <button id="btn-render" disabled>Generar Video (Prueba)</button>

        <div id="status">Esperando...</div>
    </div>

    <!-- Cargar el JS de FFmpeg -->
    <script src="/ffmpeg_clean/ffmpeg.js"></script>
    <script src="/debug-ffmpeg.js"></script>
</body>

</html>
