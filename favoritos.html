            <h1 style="color:white; margin-bottom: 1rem; font-family: 'Montserrat', sans-serif;">Mis Favoritos</h1>

            <style>
                html {

                }
            </style>
            <!-- Controls -->
            <div class="fav-controls-container"
                style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center;">
                <style>
                    /* Mobile-specific adjustments for search and pills */
                    @media (max-width: 768px) {
                        .fav-search-input {
                            display: none !important;
                        }

                        .fav-controls-container {
                            gap: 0 !important;
                            /* Remove gap that shifts pills */
                        }

                        .fav-pills-container {
                            width: 100vw;
                            margin-left: 0;
                            padding: 8px 0 12px 0;
                            /* Top padding to fix clipping */
                            overflow-x: auto;
                            -webkit-overflow-scrolling: touch;
                            scroll-snap-type: x mandatory;
                            gap: 10px;
                            display: flex;
                            align-items: center;
                        }

                        .fav-pills-container::-webkit-scrollbar {
                            display: none;
                        }

                        .filter-tab {
                            flex-shrink: 0;
                            scroll-snap-align: start;
                        }
                    }

                    .filter-tab {
                        background: transparent;
                        border: 1px solid rgba(255, 255, 255, 0.15);
                        color: #777;
                        cursor: pointer;
                        padding: 7px 18px;
                        font-size: 0.82rem;
                        font-weight: 600;
                        border-radius: 20px;
                        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                        font-family: 'Plus Jakarta Sans', sans-serif;
                        white-space: nowrap;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        min-width: 80px;
                        /* Base width to stabilize small shifts */
                    }

                    .filter-tab:hover {
                        color: #fff;
                        border-color: rgba(255, 255, 255, 0.4);
                        background: rgba(255, 255, 255, 0.05);
                    }

                    .filter-tab.active {
                        color: #fff;
                        background: rgba(255, 255, 255, 0.12);
                        border-color: #fff;
                        /* 🛡️ STABILITY FIX: Use scale instead of font-weight to prevent width shift */
                        transform: scale(1.02);
                        box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
                    }
                </style>

                <input type="text" class="fav-search-input" placeholder="Buscar en favoritos..."
                    style="background: #111; border: 1px solid rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 8px; color: #fff; width: 300px;"
                    oninput="window.FavoritesManager.setSearch(this.value)">

                <div class="fav-pills-container"
                    style="color: #666; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
                    <button class="filter-tab active" onclick="activateFavFilter(this, 'all')">Todos</button>
                    <button class="filter-tab" onclick="activateFavFilter(this, 'beat')">Beats</button>
                    <button class="filter-tab" onclick="activateFavFilter(this, 'preset')">Presets</button>
                    <button class="filter-tab" onclick="activateFavFilter(this, 'loop')">LoopKits</button>
                    <button class="filter-tab" onclick="activateFavFilter(this, 'plantilla')">Plantillas</button>
                    <button class="filter-tab" onclick="activateFavFilter(this, 'drum')">DrumKits</button>
                </div>
            </div>

            <div id="favorites-grid" class="products-list-container">
                <!-- Favorites Injected Here -->
            </div>

            <script>
                // 🚀 STABILITY FIX: Rely on global session event
                // 🚀 STABILITY FIX: Run immediately for SPA compatibility
                (async function initFavoritesPage() {
                    // 1. Initial Player Init
                    if (window.StickyPlayer) window.StickyPlayer.init();

                    const containerId = 'favorites-grid';
                    const container = document.getElementById(containerId);

                    // 2. Render when session is confirmed (Listener)
                    // We keep this purely for auth-lag or re-login scenarios
                    window.addEventListener('offszn-session-ready', async (e) => {
                        if (e.detail.session && window.FavoritesManager) {
                            if (container && container.children.length > 0 && !container.querySelector('.skeleton-fav-row')) {
                                return;
                            }
                            await window.FavoritesManager.renderFavorites(containerId);
                        }
                    });

                    // 3. Immediate Render (The primary trigger for SPA)
                    if (window.FavoritesManager) {
                        // Check if we already have a list rendered to avoid flickering
                        if (container && container.children.length > 0 && !container.querySelector('.skeleton-fav-row')) {
                            // Already content? maybe verify it's not stale? 
                            // For now, trust it.
                        } else {
                            await window.FavoritesManager.renderFavorites(containerId);
                        }
                    } else {
                        // Fallback in case script loads late (unlikely given position)
                        console.warn("FavoritesManager not ready logic, waiting...");
                        const checkInterval = setInterval(() => {
                            if (window.FavoritesManager) {
                                clearInterval(checkInterval);
                                window.FavoritesManager.renderFavorites(containerId);
                            }
                        }, 100);
                        // Safety clear
                        setTimeout(() => clearInterval(checkInterval), 5000);
                    }
                })();

                function activateFavFilter(btn, type) {
                    // Update UI
                    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // Call Manager
                    if (window.FavoritesManager) {
                        window.FavoritesManager.setFilterType(type);
                    }
                }
            </script>
