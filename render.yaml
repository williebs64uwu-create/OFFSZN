services:
  - type: web
    name: offszn
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

    rewrites:
      # SECURITY: Block access to sensitive folders and files
      - source: "/server/*"
        destination: "/404.html"
      - source: "/.env"
        destination: "/404.html"
      - source: "/_redirects"
        destination: "/404.html"

      # Regla 1: Si la URL empieza con /@ (ej: /@willieinspired)
      - source: "/@:username"
        destination: "/perfil-publico.html"
        
      # Regla 2 (para el Owner): Si la URL es /producto/nombre-del-beat
      - source: "/producto/:slug"
        destination: "/pages/articulo.html"
        
      # Regla 3 (Fallback): Si nada coincide, sirve el index.
      - source: "/*"
        destination: "/index.html"
