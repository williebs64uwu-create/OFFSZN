services:
  - type: web
    name: offszn
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

    rewrites:
      # SECURITY: Block access to sensitive folders and files
      - source: "/server/*"
        destination: "/404.html"
      - source: "/.env"
        destination: "/404.html"
      - source: "/_redirects"
        destination: "/404.html"

      # Regla 1: Perfiles (@usuario)
      - source: "/@:username"
        destination: "/perfil-publico.html"
        
      # Regla 2: Productos (Compatibilidad)
      - source: "/producto/:slug"
        destination: "/producto.html"
        
      # Regla 3: Fallback (Node handles everything else)
      - source: "/*"
        destination: "/index.html"
