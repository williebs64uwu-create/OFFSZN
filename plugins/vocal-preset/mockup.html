<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocal Preset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0b0e;
      --bg-card: #111318;
      --bg-card-hover: #15181f;
      --bg-input: #101217;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-card: rgba(255, 255, 255, 0.05);
      --mint: #5cdbb5;
      --mint-glow: rgba(92, 219, 181, 0.25);
      --mint-dark: #1b352e;
      --text-main: #f3f4f6;
      --text-muted: #848a97;
      --text-dim: #4d5360;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 960px;
      height: 600px;
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      position: relative;
    }

    /* BARRA SUPERIOR */
    .header {
      height: 58px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: #0d0f13;
      z-index: 10;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    /* DROPDOWN CENTRAL: MODO HABLAR / MODO EFECTOS */
    .view-mode-selector {
      position: relative;
    }

    .view-dropdown-btn {
      background: #14171e;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-dropdown-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .view-dropdown-menu {
      position: absolute;
      top: 115%;
      left: 0;
      width: 100%;
      background: #151821;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      box-shadow: 0 12px 28px rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 50;
    }

    .view-dropdown-menu.show {
      display: flex;
    }

    .view-dropdown-item {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .view-dropdown-item:hover, .view-dropdown-item.active {
      background: #1f2533;
      color: var(--mint);
    }

    /* ROUTING (INSERTO / ENVÍO) & CONFIG */
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .routing-pills {
      display: flex;
      background: #14171d;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .routing-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .routing-btn.active {
      background: #1c322b;
      color: var(--mint);
      border: 1px solid rgba(92, 219, 181, 0.35);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--border-color);
      color: #fff;
    }

    /* CONTENEDOR PRINCIPAL DE PANTALLAS */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ====================================================
       1. PANTALLA: MODO HABLAR (SOLO PARA HABLAR)
       ==================================================== */
    .screen-hablar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 20px;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .ptt-btn-large {
      background: var(--mint);
      color: #0c0d10;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 36px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px var(--mint-glow);
      transition: transform 0.1s, box-shadow 0.2s, background-color 0.2s;
    }

    .ptt-btn-large:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(92, 219, 181, 0.4);
    }

    .ptt-btn-large:active, .ptt-btn-large.recording {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.5);
      transform: scale(0.98);
    }

    .cmd-input-container {
      width: 520px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      padding: 5px 14px;
      transition: border-color 0.2s;
    }

    .cmd-input-container:focus-within {
      border-color: rgba(92, 219, 181, 0.5);
    }

    .cmd-input-box {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      padding: 6px 0;
    }

    .cmd-input-box::placeholder {
      color: var(--text-dim);
    }

    .cmd-arrow-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .cmd-arrow-btn:hover {
      color: var(--mint);
    }

    .chips-row {
      display: flex;
      gap: 10px;
    }

    .chip-item {
      background: #14171e;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 6px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-item:hover {
      border-color: var(--mint);
      color: var(--mint);
      background: #172421;
    }

    /* TRANSCRIPCIÓN DIRECTA DEBAJO SIN RECUADROS NI BORDES */
    .speech-transcript-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--mint);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
    }

    .speech-transcript-text svg {
      width: 15px;
      height: 15px;
      fill: var(--mint);
    }

    /* ====================================================
       2. PANTALLA: MODO EFECTOS (RACK COMPLETO)
       ==================================================== */
    .screen-efectos {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 30px 24px;
      gap: 16px;
    }

    .effects-section-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .fx-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .fx-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 16px 14px 14px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .fx-card:hover {
      border-color: rgba(255, 255, 255, 0.14);
      background: var(--bg-card-hover);
    }

    .fx-card-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .fx-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    /* SWITCH TOGGLE */
    .switch-toggle {
      width: 32px;
      height: 18px;
      background: #232733;
      border-radius: var(--radius-full);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }

    .switch-toggle.on {
      background: var(--mint);
    }

    .switch-toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
    }

    .switch-toggle.on::after {
      transform: translateX(14px);
      background: #0a0b0e;
    }

    /* CIRCULAR GAUGE (SUBE DE IZQUIERDA A DERECHA EN SENTIDO HORARIO) */
    .arc-gauge-container {
      position: relative;
      width: 110px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ns-resize;
      margin: 4px 0;
    }

    .arc-gauge-svg {
      width: 100px;
      height: 100px;
      transform: rotate(135deg); /* Abre abajo, gira de izq a der en sentido horario */
    }

    .arc-bg {
      fill: none;
      stroke: #212530;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 176;
      stroke-dashoffset: 44;
    }

    .arc-fill {
      fill: none;
      stroke: var(--mint);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 176;
      stroke-dashoffset: 144;
      transition: stroke-dashoffset 0.05s ease-out;
      filter: drop-shadow(0 0 5px var(--mint-glow));
    }

    .gauge-center-info {
      position: absolute;
      top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .gauge-val {
      font-size: 16px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }

    .gauge-subtext {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* BOTÓN PERSONALIZAR DEBAJO DE CADA EFECTO */
    .btn-personalizar-card {
      width: 100%;
      background: #171a22;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-personalizar-card:hover {
      background: #212633;
      border-color: var(--mint);
      color: var(--mint);
    }

    /* BARRA INFERIOR (FOOTER) */
    .footer {
      height: 52px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      background: #0d0f13;
      margin-top: auto;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* GRUPO DESHACER Y REHACER MEJORADO */
    .history-group {
      display: flex;
      align-items: center;
      background: #14171e;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .history-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .history-btn:hover:not(:disabled) {
      background: #1f232e;
      color: #fff;
    }

    .history-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .history-divider {
      width: 1px;
      height: 18px;
      background: var(--border-color);
    }

    .footer-save-btn {
      background: #14171e;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .footer-save-btn:hover {
      background: #1f232e;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* SALIDA Y TELEMETRÍA (FOOTER DERECHO) */
    .footer-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .output-knob-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .output-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .output-title {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .output-db {
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }

    .output-mini-knob {
      width: 30px;
      height: 30px;
      position: relative;
      cursor: ns-resize;
    }

    .knob-svg {
      width: 30px;
      height: 30px;
      transform: rotate(-90deg);
    }

    .knob-bg {
      fill: none;
      stroke: #222631;
      stroke-width: 3;
    }

    .knob-fill {
      fill: none;
      stroke: var(--mint);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 82;
      stroke-dashoffset: 20;
    }

    /* ====================================================
       MODAL DE PERSONALIZACIÓN AVANZADA (MODO EFECTOS)
       ==================================================== */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 10, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 600px;
      background: #13161d;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: 0 20px 48px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalSlideUp 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: #101217;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title span {
      color: var(--mint);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      transition: color 0.15s;
    }

    .modal-close-btn:hover {
      color: #fff;
    }

    .modal-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mint);
    }

    .advanced-params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .adv-param-card {
      background: #0f1116;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .adv-param-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .adv-param-header span:last-child {
      color: var(--mint);
      font-family: 'JetBrains Mono', monospace;
    }

    .slider-track {
      width: 100%;
      height: 4px;
      background: #232733;
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .slider-fill {
      height: 100%;
      background: var(--mint);
      border-radius: 2px;
      position: relative;
    }

    .slider-thumb {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      right: -6px;
      transform: translateY(-50%);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="header">
    <div class="brand-title">Vocal Preset</div>

    <!-- DROPDOWN CENTRAL: MODO HABLAR / MODO EFECTOS -->
    <div class="view-mode-selector">
      <button class="view-dropdown-btn" id="dropdownBtn" onclick="toggleDropdown()">
        <span id="currentModeLabel">Modo Hablar</span>
        <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div class="view-dropdown-menu" id="dropdownMenu">
        <div class="view-dropdown-item active" id="itemHablar" onclick="selectMode('hablar')">Modo Hablar</div>
        <div class="view-dropdown-item" id="itemEfectos" onclick="selectMode('efectos')">Modo Efectos</div>
      </div>
    </div>

    <!-- ROUTING & AJUSTES -->
    <div class="header-right">
      <div class="routing-pills">
        <button class="routing-btn active" id="btnRoutingInsert" onclick="setRouting('insert')">Inserto</button>
        <button class="routing-btn" id="btnRoutingSend" onclick="setRouting('send')">Envío</button>
      </div>
      <button class="icon-btn" title="Ajustes">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="main-container">
    
    <!-- 1. PANTALLA: MODO HABLAR (SOLO PARA HABLAR) -->
    <section class="screen-hablar" id="screenHablar">
      <h1 class="hero-title">Tu voz. Tus efectos.</h1>

      <!-- BOTÓN PUSH TO TALK GRANDE -->
      <button class="ptt-btn-large" id="pttButton" onmousedown="startPTT()" onmouseup="stopPTT()" ontouchstart="startPTT()" ontouchend="stopPTT()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        <span id="pttLabel">Mantén para hablar</span>
      </button>

      <!-- BARRA DE ENTRADA MANUAL -->
      <div class="cmd-input-container">
        <input type="text" class="cmd-input-box" id="cmdInput" placeholder="O escribe un comando..." onkeydown="handleInputKey(event)" />
        <button class="cmd-arrow-btn" onclick="executeCurrentInput()">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42L16.86 11H5v2z"/></svg>
        </button>
      </div>

      <!-- CHIPS RÁPIDOS -->
      <div class="chips-row">
        <div class="chip-item" onclick="applyQuickPrompt('Chorus suave')">Chorus suave</div>
        <div class="chip-item" onclick="applyQuickPrompt('Doubler ancho')">Doubler ancho</div>
        <div class="chip-item" onclick="applyQuickPrompt('Reverb oscura')">Reverb oscura</div>
      </div>

      <!-- TRANSCRIPCIÓN DIRECTA DEBAJO SIN RECUADROS -->
      <div class="speech-transcript-text" id="speechTranscript">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <span id="speechTranscriptText">Reverb oscura aplicada</span>
      </div>
    </section>

    <!-- 2. PANTALLA: MODO EFECTOS (RACK COMPLETO) -->
    <section class="screen-efectos" id="screenEfectos">
      <div class="effects-section-title">EFECTOS</div>

      <div class="fx-grid">
        
        <!-- DOUBLER -->
        <div class="fx-card" id="card_doubler">
          <div class="fx-card-top">
            <span class="fx-card-title">Doubler</span>
            <div class="switch-toggle" id="toggle_doubler" onclick="toggleFx('doubler', event)"></div>
          </div>
          <div class="arc-gauge-container" onmousedown="startGaugeDrag(event, 'doubler')">
            <svg class="arc-gauge-svg" viewBox="0 0 80 80">
              <circle class="arc-bg" cx="40" cy="40" r="28"></circle>
              <circle class="arc-fill" id="arc_doubler" cx="40" cy="40" r="28" style="stroke-dashoffset: 141;"></circle>
            </svg>
            <div class="gauge-center-info">
              <span class="gauge-val" id="val_doubler">20%</span>
            </div>
          </div>
          <span class="gauge-subtext">Cantidad</span>
          <!-- BOTÓN PERSONALIZAR DEBAJO DEL EFECTO -->
          <button class="btn-personalizar-card" onclick="openPersonalizarModal('doubler')">
            <span>Personalizar</span>
            <svg width="11" height="11" fill="currentColor" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </button>
        </div>

        <!-- CHORUS -->
        <div class="fx-card" id="card_chorus">
          <div class="fx-card-top">
            <span class="fx-card-title">Chorus</span>
            <div class="switch-toggle" id="toggle_chorus" onclick="toggleFx('chorus', event)"></div>
          </div>
          <div class="arc-gauge-container" onmousedown="startGaugeDrag(event, 'chorus')">
            <svg class="arc-gauge-svg" viewBox="0 0 80 80">
              <circle class="arc-bg" cx="40" cy="40" r="28"></circle>
              <circle class="arc-fill" id="arc_chorus" cx="40" cy="40" r="28" style="stroke-dashoffset: 149;"></circle>
            </svg>
            <div class="gauge-center-info">
              <span class="gauge-val" id="val_chorus">15%</span>
            </div>
          </div>
          <span class="gauge-subtext">Cantidad</span>
          <!-- BOTÓN PERSONALIZAR DEBAJO DEL EFECTO -->
          <button class="btn-personalizar-card" onclick="openPersonalizarModal('chorus')">
            <span>Personalizar</span>
            <svg width="11" height="11" fill="currentColor" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </button>
        </div>

        <!-- DELAY -->
        <div class="fx-card" id="card_delay">
          <div class="fx-card-top">
            <span class="fx-card-title">Delay</span>
            <div class="switch-toggle" id="toggle_delay" onclick="toggleFx('delay', event)"></div>
          </div>
          <div class="arc-gauge-container" onmousedown="startGaugeDrag(event, 'delay')">
            <svg class="arc-gauge-svg" viewBox="0 0 80 80">
              <circle class="arc-bg" cx="40" cy="40" r="28"></circle>
              <circle class="arc-fill" id="arc_delay" cx="40" cy="40" r="28" style="stroke-dashoffset: 154;"></circle>
            </svg>
            <div class="gauge-center-info">
              <span class="gauge-val" id="val_delay">12%</span>
            </div>
          </div>
          <span class="gauge-subtext">Cantidad</span>
          <!-- BOTÓN PERSONALIZAR DEBAJO DEL EFECTO -->
          <button class="btn-personalizar-card" onclick="openPersonalizarModal('delay')">
            <span>Personalizar</span>
            <svg width="11" height="11" fill="currentColor" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </button>
        </div>

        <!-- REVERB -->
        <div class="fx-card" id="card_reverb">
          <div class="fx-card-top">
            <span class="fx-card-title">Reverb</span>
            <div class="switch-toggle on" id="toggle_reverb" onclick="toggleFx('reverb', event)"></div>
          </div>
          <div class="arc-gauge-container" onmousedown="startGaugeDrag(event, 'reverb')">
            <svg class="arc-gauge-svg" viewBox="0 0 80 80">
              <circle class="arc-bg" cx="40" cy="40" r="28"></circle>
              <circle class="arc-fill" id="arc_reverb" cx="40" cy="40" r="28" style="stroke-dashoffset: 144;"></circle>
            </svg>
            <div class="gauge-center-info">
              <span class="gauge-val" id="val_reverb">18%</span>
            </div>
          </div>
          <span class="gauge-subtext">Cantidad</span>
          <!-- BOTÓN PERSONALIZAR DEBAJO DEL EFECTO -->
          <button class="btn-personalizar-card" onclick="openPersonalizarModal('reverb')">
            <span>Personalizar</span>
            <svg width="11" height="11" fill="currentColor" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </button>
        </div>

      </div>
    </section>

  </main>

  <!-- BARRA INFERIOR (FOOTER) -->
  <footer class="footer">
    <div class="footer-left">
      <!-- GRUPO DESHACER Y REHACER MEJORADO -->
      <div class="history-group">
        <button class="history-btn" id="btnUndo" onclick="triggerUndo()" title="Deshacer última acción">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
          <span>Deshacer</span>
        </button>
        <div class="history-divider"></div>
        <button class="history-btn" id="btnRedo" onclick="triggerRedo()" title="Rehacer acción">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
          <span>Rehacer</span>
        </button>
      </div>

      <button class="footer-save-btn" onclick="savePreset()">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        <span>Guardar</span>
      </button>
    </div>

    <div class="footer-right">
      <div class="output-knob-group">
        <div class="output-info">
          <span class="output-title">Salida</span>
          <span class="output-db" id="valOutDb">0.0 dB</span>
        </div>
        <div class="output-mini-knob" onmousedown="startOutKnobDrag(event)">
          <svg class="knob-svg" viewBox="0 0 30 30">
            <circle class="knob-bg" cx="15" cy="15" r="12"></circle>
            <circle class="knob-fill" id="knobFill" cx="15" cy="15" r="12" style="stroke-dashoffset: 20;"></circle>
          </svg>
        </div>
      </div>
    </div>
  </footer>

  <!-- MODAL DE PERSONALIZACIÓN AVANZADA (ESTILO EASY MIX) -->
  <div class="modal-overlay" id="modalPersonalizar" onclick="closePersonalizarModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">
          <span>⚙ PERSONALIZAR</span> — <span id="modalFxTitle">REVERB</span>
        </div>
        <button class="modal-close-btn" onclick="closePersonalizarModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-section-title">Parámetros Detallados & Controles DSP</div>
        <div class="advanced-params-grid" id="advancedGrid">
          <!-- Se inyecta dinámicamente según el efecto seleccionado -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Estado General
    const state = {
      viewMode: 'hablar', // 'hablar' o 'efectos'
      routing: 'insert',
      effects: {
        doubler: {
          name: 'Doubler',
          on: false,
          amount: 20,
          advanced: [
            { name: 'Separación Stereo', val: '85%' },
            { name: 'Desafinación', val: '14 ct' },
            { name: 'Retardo L/R', val: '12 ms' },
            { name: 'Corte de Graves', val: '120 Hz' }
          ]
        },
        chorus: {
          name: 'Chorus',
          on: false,
          amount: 15,
          advanced: [
            { name: 'Profundidad', val: '60%' },
            { name: 'Velocidad LFO', val: '1.2 Hz' },
            { name: 'Fase Stereo', val: '90°' },
            { name: 'Color Cálido', val: 'Activo' }
          ]
        },
        delay: {
          name: 'Delay',
          on: false,
          amount: 12,
          advanced: [
            { name: 'Tiempo Sync', val: '1/4D' },
            { name: 'Repeticiones', val: '35%' },
            { name: 'Modo Ping-Pong', val: 'Activo' },
            { name: 'Filtro Pasa Altos', val: '220 Hz' }
          ]
        },
        reverb: {
          name: 'Reverb',
          on: true,
          amount: 18,
          advanced: [
            { name: 'Duración (Decay)', val: '1.2 s' },
            { name: 'Anchura Stereo', val: '80%' },
            { name: 'Oscuridad (Damp)', val: '60%' },
            { name: 'Pre-retardo', val: '24 ms' }
          ]
        }
      },
      outGain: 0.0,
      isRecording: false,
      history: []
    };

    // Dropdown de Modos (Modo Hablar vs Modo Efectos)
    function toggleDropdown() {
      document.getElementById('dropdownMenu').classList.toggle('show');
    }

    function selectMode(mode) {
      state.viewMode = mode;
      document.getElementById('currentModeLabel').textContent = mode === 'hablar' ? 'Modo Hablar' : 'Modo Efectos';
      document.getElementById('itemHablar').classList.toggle('active', mode === 'hablar');
      document.getElementById('itemEfectos').classList.toggle('active', mode === 'efectos');

      const screenHablar = document.getElementById('screenHablar');
      const screenEfectos = document.getElementById('screenEfectos');

      if (mode === 'hablar') {
        screenHablar.style.display = 'flex';
        screenEfectos.style.display = 'none';
      } else {
        screenHablar.style.display = 'none';
        screenEfectos.style.display = 'flex';
      }

      document.getElementById('dropdownMenu').classList.remove('show');
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.view-mode-selector')) {
        document.getElementById('dropdownMenu').classList.remove('show');
      }
    });

    // Toggle Bypass de Efectos
    function toggleFx(fxKey, event) {
      if (event) event.stopPropagation();
      const fx = state.effects[fxKey];
      if (!fx) return;

      fx.on = !fx.on;
      const toggleEl = document.getElementById('toggle_' + fxKey);
      if (toggleEl) toggleEl.classList.toggle('on', fx.on);

      setTranscriptText(fx.name + (fx.on ? ' activado' : ' desactivado'));
      sendToJuce(fxKey + '_on', fx.on ? 1.0 : 0.0);
    }

    // Drag del Gauge Circular (Sube de izquierda a derecha en sentido horario)
    let activeGauge = null;
    let gaugeStartY = 0;
    let gaugeStartVal = 0;

    function startGaugeDrag(e, fxKey) {
      e.preventDefault();
      activeGauge = fxKey;
      gaugeStartY = e.clientY;
      gaugeStartVal = state.effects[fxKey].amount;

      window.addEventListener('mousemove', onGaugeMouseMove);
      window.addEventListener('mouseup', onGaugeMouseUp);
    }

    function onGaugeMouseMove(e) {
      if (!activeGauge) return;
      const deltaY = gaugeStartY - e.clientY; // Arrastre hacia arriba sube cantidad
      let newVal = Math.round(gaugeStartVal + deltaY * 0.7);
      newVal = Math.max(0, Math.min(100, newVal));

      updateGauge(activeGauge, newVal);
    }

    function onGaugeMouseUp() {
      if (activeGauge) {
        sendToJuce(activeGauge + '_amount', state.effects[activeGauge].amount / 100.0);
      }
      activeGauge = null;
      window.removeEventListener('mousemove', onGaugeMouseMove);
      window.removeEventListener('mouseup', onGaugeMouseUp);
    }

    function updateGauge(fxKey, val) {
      state.effects[fxKey].amount = val;
      const arc = document.getElementById('arc_' + fxKey);
      const valEl = document.getElementById('val_' + fxKey);

      // Longitud total del arco visible ~132 (abre abajo, gira horario)
      const maxOffset = 176;
      const minOffset = 44;
      const offset = maxOffset - ((val / 100) * (maxOffset - minOffset));

      if (arc) arc.style.strokeDashoffset = offset;
      if (valEl) valEl.textContent = val + '%';
    }

    // Modal Personalizar (Debajo de cada tarjeta en Modo Efectos)
    function openPersonalizarModal(fxKey) {
      const modal = document.getElementById('modalPersonalizar');
      const title = document.getElementById('modalFxTitle');
      const grid = document.getElementById('advancedGrid');
      const fx = state.effects[fxKey];

      title.textContent = fx.name.toUpperCase();
      grid.innerHTML = '';

      fx.advanced.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'adv-param-card';
        div.innerHTML = `
          <div class="adv-param-header">
            <span>${item.name}</span>
            <span>${item.val}</span>
          </div>
          <div class="slider-track" onmousedown="startModalSliderDrag(event, ${idx})">
            <div class="slider-fill" style="width: 60%;">
              <div class="slider-thumb"></div>
            </div>
          </div>
        `;
        grid.appendChild(div);
      });

      modal.classList.add('open');
    }

    function closePersonalizarModal(e) {
      document.getElementById('modalPersonalizar').classList.remove('open');
    }

    function startModalSliderDrag(e, idx) {
      e.preventDefault();
      // Interacción visual suave de sliders dentro del modal
    }

    // Push To Talk (Modo Hablar)
    function startPTT() {
      state.isRecording = true;
      const btn = document.getElementById('pttButton');
      const lbl = document.getElementById('pttLabel');
      btn.classList.add('recording');
      lbl.textContent = 'Escuchando voz...';
      setTranscriptText('Escuchando voz localmente...');
    }

    function stopPTT() {
      if (!state.isRecording) return;
      state.isRecording = false;
      const btn = document.getElementById('pttButton');
      const lbl = document.getElementById('pttLabel');
      btn.classList.remove('recording');
      lbl.textContent = 'Mantén para hablar';

      setTimeout(() => {
        const randomAnswers = [
          "Reverb oscura aplicada",
          "Doubler ancho activado",
          "Chorus suave al 20%",
          "Delay tempo sync aplicado"
        ];
        const res = randomAnswers[Math.floor(Math.random() * randomAnswers.length)];
        applyTextCommand(res);
      }, 300);
    }

    function handleInputKey(e) {
      if (e.key === 'Enter') {
        executeCurrentInput();
      }
    }

    function executeCurrentInput() {
      const input = document.getElementById('cmdInput');
      const text = input.value.trim();
      if (text.length > 0) {
        applyTextCommand(text);
        input.value = '';
      }
    }

    function applyQuickPrompt(text) {
      applyTextCommand(text);
    }

    function applyTextCommand(text) {
      setTranscriptText(text);
      const lower = text.toLowerCase();

      if (lower.includes('reverb')) {
        state.effects.reverb.on = true;
        document.getElementById('toggle_reverb').classList.add('on');
        updateGauge('reverb', 22);
      }
      if (lower.includes('chorus')) {
        state.effects.chorus.on = true;
        document.getElementById('toggle_chorus').classList.add('on');
        updateGauge('chorus', 25);
      }
      if (lower.includes('doubler')) {
        state.effects.doubler.on = true;
        document.getElementById('toggle_doubler').classList.add('on');
        updateGauge('doubler', 30);
      }
      if (lower.includes('delay')) {
        state.effects.delay.on = true;
        document.getElementById('toggle_delay').classList.add('on');
        updateGauge('delay', 18);
      }

      if (window.__JUCE_EXECUTE_CMD) {
        window.__JUCE_EXECUTE_CMD(text);
      }
    }

    function setTranscriptText(text) {
      const el = document.getElementById('speechTranscriptText');
      if (el) el.textContent = text;
    }

    // Routing
    function setRouting(mode) {
      state.routing = mode;
      document.getElementById('btnRoutingInsert').classList.toggle('active', mode === 'insert');
      document.getElementById('btnRoutingSend').classList.toggle('active', mode === 'send');
      setTranscriptText('Modo ' + (mode === 'insert' ? 'Inserto (Dry + Wet)' : 'Envío (Solo Wet)'));
      sendToJuce('routing_mode', mode === 'send' ? 1.0 : 0.0);
    }

    // Deshacer / Rehacer
    function triggerUndo() {
      setTranscriptText('Acción deshecha');
    }

    function triggerRedo() {
      setTranscriptText('Acción rehecha');
    }

    function savePreset() {
      setTranscriptText('Configuración guardada correctamente');
    }

    // Salida Knob
    let activeOutKnob = false;
    let knobStartY = 0;
    let knobStartVal = 0;

    function startOutKnobDrag(e) {
      e.preventDefault();
      activeOutKnob = true;
      knobStartY = e.clientY;
      knobStartVal = state.outGain;

      window.addEventListener('mousemove', onKnobMouseMove);
      window.addEventListener('mouseup', onKnobMouseUp);
    }

    function onKnobMouseMove(e) {
      if (!activeOutKnob) return;
      const deltaY = knobStartY - e.clientY;
      let newDb = knobStartVal + (deltaY * 0.1);
      newDb = Math.max(-24.0, Math.min(6.0, newDb));
      state.outGain = newDb;

      document.getElementById('valOutDb').textContent = (newDb >= 0 ? '+' : '') + newDb.toFixed(1) + ' dB';
      const pct = (newDb + 24) / 30;
      const offset = 82 - (pct * 60);
      document.getElementById('knobFill').style.strokeDashoffset = offset;
    }

    function onKnobMouseUp() {
      activeOutKnob = false;
      window.removeEventListener('mousemove', onKnobMouseMove);
      window.removeEventListener('mouseup', onKnobMouseUp);
    }

    function sendToJuce(param, val) {
      if (window.__JUCE_SET_PARAM) {
        window.__JUCE_SET_PARAM(param, val);
      }
    }
  </script>
</body>
</html>
