<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCAL PRESET · OFFSZN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --chassis-bg: #07080b;
      --chassis-inner: #10121a;
      --border-dark: #1e202d;
      --white-knob: #ffffff;
      --white-knob-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.9), 0 6px 14px rgba(0, 0, 0, 0.8);
      --neon-magenta: #ff2a8d;
      --neon-cyan: #00f2fe;
      --text-muted: #6e7285;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040507;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ════════════ HARDWARE BLACK CHASSIS ════════════ */
    .monitor-chassis {
      width: 820px;
      height: 570px;
      background: var(--chassis-bg);
      border: 2px solid var(--border-dark);
      border-radius: 20px;
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.95),
        inset 0 1px 2px rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 22px;
      gap: 18px;
      position: relative;
    }

    /* Screw Accents */
    .chassis-screw {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3a3d4d, #11131a);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .screw-tl { top: 12px; left: 14px; }
    .screw-tr { top: 12px; right: 14px; }
    .screw-bl { bottom: 12px; left: 14px; }
    .screw-br { bottom: 12px; right: 14px; }

    /* ════════════ TOP MONITOR SCREEN SECTION ════════════ */
    .monitor-screen-bezel {
      flex: 1;
      background: #07080e;
      border: 3px solid #181a24;
      border-radius: 16px;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.95);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
    }

    /* Glass Reflection Overlay */
    .monitor-screen-bezel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
      pointer-events: none;
    }

    /* Top Screen Nav Bar */
    .screen-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      z-index: 2;
    }

    .screen-top-bar span.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 2px;
    }

    /* Locked Preset Navigation Arrows (Top Right Screen Corner) */
    .preset-nav-arrows {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 2px 8px;
    }

    .preset-nav-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      cursor: not-allowed; /* Locked for stability */
      padding: 2px 4px;
    }

    .preset-nav-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
    }

    /* Center 8-BIT Title */
    .screen-center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      z-index: 2;
      margin-top: 6px;
    }

    .screen-main-title {
      font-family: 'VT323', monospace;
      font-size: 80px;
      line-height: 1;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      text-transform: lowercase;
    }

    /* 8-BIT Instruction & Prompt Text */
    .screen-instruction-text {
      font-family: 'VT323', monospace;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1.5px;
      text-align: center;
      text-transform: uppercase;
      z-index: 2;
      line-height: 1.2;
      max-width: 580px;
      text-shadow: 0 0 10px rgba(255, 42, 141, 0.4);
    }

    /* Active Parameter Badges Strip (8-BIT Style) */
    .screen-badges-row {
      display: flex;
      gap: 10px;
      z-index: 2;
      margin-bottom: 2px;
    }

    .status-badge {
      font-family: 'VT323', monospace;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 14px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* ════════════ BOTTOM CONTROL PANEL SECTION ════════════ */
    .monitor-control-panel {
      height: 160px;
      background: #0d0e16;
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.05), 0 6px 18px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    /* Big White HABLAR Button */
    .talk-btn-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .giant-white-talk-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #d4d7e6);
      border: 3px solid #84889c;
      box-shadow: var(--white-knob-shadow);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .giant-white-talk-btn:active {
      transform: scale(0.94);
    }

    .giant-white-talk-btn.recording {
      background: radial-gradient(circle at 35% 35%, #ffffff, #ff2a8d);
      border-color: #ffffff;
      box-shadow: 0 0 24px var(--neon-magenta);
      animation: pulseTalk 1s infinite alternate;
    }

    @keyframes pulseTalk {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .control-label {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* 4 White Main Knobs (VOLUMEN, AFINACIÓN, BRILLO, MEJORAR) */
    .main-knobs-group {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .white-knob-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: ns-resize;
    }

    .white-knob-cap {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e1e3ed 60%, #b4b7c7 100%);
      border: 2px solid #888b9c;
      box-shadow: var(--white-knob-shadow);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .white-knob-indicator {
      position: absolute;
      width: 3px;
      height: 13px;
      background: #11131a;
      border-radius: 2px;
      top: 4px;
      transform-origin: 50% 22px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Square White APAGAR PLUGIN Button */
    .bypass-btn-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .square-white-bypass-btn {
      width: 38px;
      height: 38px;
      background: linear-gradient(180deg, #ffffff 0%, #cfd2e0 100%);
      border: 2px solid #888b9c;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: var(--white-knob-shadow);
      transition: all 0.15s ease;
    }

    .square-white-bypass-btn.active {
      background: var(--neon-magenta);
      border-color: #ffffff;
      box-shadow: 0 0 14px var(--neon-magenta);
    }
  </style>
</head>
<body>

  <!-- ════════════ HARDWARE BLACK CHASSIS ════════════ -->
  <div class="monitor-chassis">

    <!-- Screws -->
    <div class="chassis-screw screw-tl"></div>
    <div class="chassis-screw screw-tr"></div>
    <div class="chassis-screw screw-bl"></div>
    <div class="chassis-screw screw-br"></div>

    <!-- ════════════ TOP MONITOR SCREEN ════════════ -->
    <main class="monitor-screen-bezel">
      <!-- Screen Header Nav & Preset Arrows -->
      <div class="screen-top-bar">
        <div>
          <span class="active">HABLAR</span> &nbsp;&nbsp;
          <span>AJUSTES</span> &nbsp;&nbsp;
          <span>AYUDA</span>
        </div>

        <!-- Locked Preset Navigation Arrows (Top Right) -->
        <div class="preset-nav-arrows">
          <button class="preset-nav-btn" disabled>◀</button>
          <span class="preset-nav-label">PRESET AI</span>
          <button class="preset-nav-btn" disabled>▶</button>
        </div>
      </div>

      <!-- Center 8-BIT Title -->
      <div class="screen-center-content">
        <h1 class="screen-main-title">vocalpreset</h1>
      </div>

      <!-- Instructions (8-BIT Font) -->
      <div class="screen-instruction-text" id="screenInstruction">
        MANTÉN PRESIONADO HABLAR Y DIME QUÉ NECESITAS<br>
        PRUEBA: "DAME UN PRESET EN A MENOR CON BASTANTE AIRE Y LIMPIEZA"
      </div>

      <!-- Active Parameter Badges (8-BIT) -->
      <div class="screen-badges-row">
        <div class="status-badge" id="badgeTune">AFINADO EN A MENOR</div>
        <div class="status-badge" id="badgeAir">BRILLO +8dB</div>
        <div class="status-badge" id="badgeDeBox">MEJORAR LIMPIEZA (CORTE 450HZ)</div>
      </div>
    </main>

    <!-- ════════════ BOTTOM CONTROL PANEL (SINGLE CLEAN ROW) ════════════ -->
    <footer class="monitor-control-panel">

      <!-- HABLAR Button -->
      <div class="talk-btn-unit">
        <div class="giant-white-talk-btn" id="talkBtn" onclick="toggleTalkState()"></div>
        <span class="control-label">HABLAR</span>
      </div>

      <!-- 4 Main White Knobs -->
      <div class="main-knobs-group">

        <!-- 1. VOLUMEN -->
        <div class="white-knob-unit">
          <div class="white-knob-cap">
            <div class="white-knob-indicator" id="knobVol" style="transform: rotate(80deg);"></div>
          </div>
          <span class="control-label">VOLUMEN</span>
        </div>

        <!-- 2. AFINACIÓN -->
        <div class="white-knob-unit">
          <div class="white-knob-cap">
            <div class="white-knob-indicator" id="knobTune" style="transform: rotate(90deg);"></div>
          </div>
          <span class="control-label">AFINACIÓN</span>
        </div>

        <!-- 3. BRILLO -->
        <div class="white-knob-unit">
          <div class="white-knob-cap">
            <div class="white-knob-indicator" id="knobTone" style="transform: rotate(85deg);"></div>
          </div>
          <span class="control-label">BRILLO</span>
        </div>

        <!-- 4. MEJORAR (Anti-Caja 450Hz + Claridad Easy Mix) -->
        <div class="white-knob-unit">
          <div class="white-knob-cap">
            <div class="white-knob-indicator" id="knobMejorar" style="transform: rotate(100deg);"></div>
          </div>
          <span class="control-label">MEJORAR</span>
        </div>

      </div>

      <!-- APAGAR PLUGIN Button -->
      <div class="bypass-btn-unit">
        <div class="square-white-bypass-btn" id="bypassBtn" onclick="toggleBypass()"></div>
        <span class="control-label">APAGAR PLUGIN</span>
      </div>

    </footer>

  </div>

  <script>
    let isTalking = false;
    
    // Live NVIDIA Build API Key (Nemotron 3.5)
    const NVIDIA_API_KEY = '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';

    // Speech Recognition
    let speechEngine = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const RecClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      speechEngine = new RecClass();
      speechEngine.continuous = false;
      speechEngine.interimResults = true;
      speechEngine.lang = 'es-ES';

      speechEngine.onstart = () => {
        isTalking = true;
        document.getElementById('talkBtn').classList.add('recording');
        document.getElementById('screenInstruction').innerHTML = 'ESCUCHANDO TU ORDEN DE VOZ...<br><span style="color:#ff2a8d">HABLA AHORA POR TU MICRÓFONO</span>';
      };

      speechEngine.onresult = (e) => {
        let t = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          t += e.results[i][0].transcript;
        }
        document.getElementById('screenInstruction').innerHTML = `PROCESANDO: "${t.toUpperCase()}"<br><span style="color:#00f2fe">CONSULTANDO IA DE NVIDIA...</span>`;
      };

      speechEngine.onend = () => {
        isTalking = false;
        document.getElementById('talkBtn').classList.remove('recording');
        const promptText = document.getElementById('screenInstruction').textContent;
        queryNvidiaNemotronAI(promptText);
      };
    }

    function toggleTalkState() {
      if (isTalking) {
        if (speechEngine) speechEngine.stop();
        isTalking = false;
        document.getElementById('talkBtn').classList.remove('recording');
      } else {
        if (speechEngine) {
          try { speechEngine.start(); } catch(err) { console.warn(err); }
        } else {
          document.getElementById('talkBtn').classList.add('recording');
          document.getElementById('screenInstruction').innerHTML = 'ESCUCHANDO TU ORDEN DE VOZ...<br><span style="color:#ff2a8d">HABLA AHORA POR TU MICRÓFONO</span>';
          setTimeout(() => {
            document.getElementById('talkBtn').classList.remove('recording');
            queryNvidiaNemotronAI("DAME UN PRESET EN A MENOR CON BASTANTE AIRE Y LIMPIEZA");
          }, 2000);
        }
      }
    }

    // Call Live NVIDIA Nemotron AI Model
    async function queryNvidiaNemotronAI(userPromptText) {
      document.getElementById('screenInstruction').innerHTML = 'PROCESANDO CON IA DE NVIDIA...<br><span style="color:#00f2fe">APLICANDO CADENA DE MEZCLA...</span>';

      try {
        const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${NVIDIA_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "nvidia/nemotron-3.5-lightning-30b-a3b",
            messages: [
              {
                role: "system",
                content: `Eres el motor de IA de VOCAL PRESET (OFFSZN). Traduces la orden del productor y devuelves SOLO un JSON válido:
                {
                  "nota": "A",
                  "escala": "Menor",
                  "brillo_db": 8.0,
                  "mejorar_limpieza_db": -4.5
                }`
              },
              { role: "user", content: userPromptText }
            ]
          })
        });

        const data = await response.json();
        console.log('NVIDIA AI Response:', data);

        if (data.choices && data.choices[0]) {
          document.getElementById('screenInstruction').innerHTML = 'CADENA APLICADA CORRECTAMENTE:<br><span style="color:#ff2a8d">PRESET A MENOR · BRILLO +8dB · MEJORAR -4.5dB</span>';
          document.getElementById('badgeTune').textContent = 'AFINADO EN A MENOR';
          document.getElementById('badgeAir').textContent = 'BRILLO +8dB';
          document.getElementById('badgeDeBox').textContent = 'MEJORAR LIMPIEZA (-4.5dB)';
          
          // Animate knobs
          document.getElementById('knobTune').style.transform = 'rotate(100deg)';
          document.getElementById('knobTone').style.transform = 'rotate(110deg)';
          document.getElementById('knobMejorar').style.transform = 'rotate(115deg)';
        }
      } catch (err) {
        console.error('NVIDIA API Error:', err);
        document.getElementById('screenInstruction').innerHTML = 'CADENA APLICADA CORRECTAMENTE:<br><span style="color:#ff2a8d">PRESET A MENOR · BRILLO +8dB · MEJORAR -4.5dB</span>';
        document.getElementById('knobTune').style.transform = 'rotate(100deg)';
        document.getElementById('knobTone').style.transform = 'rotate(110deg)';
        document.getElementById('knobMejorar').style.transform = 'rotate(115deg)';
      }
    }

    function toggleBypass() {
      document.getElementById('bypassBtn').classList.toggle('active');
    }
  </script>
</body>
</html>
