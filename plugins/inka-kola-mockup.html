<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKA KOLA - Mastering Polish Plugin | OFFSZN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-panel: #0d111a;
      --bg-card: #141a26;
      --gold-primary: #ffcc00;
      --gold-dark: #d49b00;
      --text-main: #f0f4ff;
      --text-sub: #7888a6;
      --accent-green: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .plugin-container {
      width: 780px;
      height: 560px;
      background: var(--bg-panel);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    header {
      height: 60px;
      padding: 0 20px;
      background: rgba(10, 14, 22, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .peru-flag {
      width: 22px;
      height: 15px;
      background: linear-gradient(90deg, #d91424 33.3%, #ffffff 33.3%, #ffffff 66.6%, #d91424 66.6%);
      border-radius: 2px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--gold-primary);
    }

    .btn-gear {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 204, 0, 0.25);
      color: var(--gold-primary);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-gear:hover {
      transform: rotate(45deg);
      border-color: var(--gold-primary);
    }

    .btn-license {
      background: rgba(255, 204, 0, 0.08);
      border: 1px solid rgba(255, 204, 0, 0.3);
      color: var(--gold-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-license.active-license {
      background: rgba(0, 230, 118, 0.1);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .main-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 60px;
      position: relative;
    }

    .bottle-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .bottle-box {
      position: relative;
      width: 200px;
      height: 360px;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottle-img-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 3;
      pointer-events: none;
    }

    #liquidCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .refill-readout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .percentage-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 700;
      color: var(--gold-primary);
      line-height: 1;
    }

    .gas-fader-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      height: 320px;
      justify-content: center;
    }

    .gas-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-primary);
      font-family: 'Space Grotesk', sans-serif;
    }

    .fader-track-wrap {
      position: relative;
      width: 28px;
      height: 240px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 3px;
      cursor: ns-resize;
    }

    .fader-fill {
      width: 100%;
      background: var(--gold-primary);
      border-radius: 10px;
      transition: height 0.05s ease-out;
      min-height: 6px;
    }

    .fader-handle {
      position: absolute;
      width: 36px;
      height: 16px;
      background: linear-gradient(135deg, #243047, #131a28);
      border: 2px solid var(--gold-primary);
      border-radius: 5px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .gas-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--gold-primary);
    }

    footer {
      height: 40px;
      background: rgba(10, 14, 22, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-sub);
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 12, 0.88);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 440px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 204, 0, 0.3);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 18px;
      cursor: pointer;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-knobs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 6px;
    }

    .knob-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .knob-container {
      position: relative;
      width: 65px;
      height: 65px;
      cursor: ns-resize;
    }

    .knob-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-135deg);
    }

    .knob-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 8;
    }

    .knob-val {
      fill: none;
      stroke: var(--gold-primary);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.1s ease-out;
    }

    .knob-cap {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1c2538, #111726);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .knob-dot {
      width: 3px;
      height: 12px;
      background: var(--gold-primary);
      border-radius: 2px;
      position: absolute;
      top: 4px;
      transform-origin: bottom center;
    }

    .knob-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
    }

    .knob-readout {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-primary);
      font-family: 'Space Grotesk', sans-serif;
    }

    .license-input {
      background: rgba(10, 14, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--gold-primary);
      font-family: 'Space Grotesk', monospace;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }

    .btn-activate {
      background: var(--gold-primary);
      border: none;
      color: #07090e;
      font-size: 13px;
      font-weight: 800;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="plugin-container">
    <header>
      <div class="brand-group">
        <div class="peru-flag"></div>
        <div class="brand-title">INKA KOLA</div>
        <button id="btnGear" class="btn-gear" title="Ajustes Avanzados">⚙️</button>
      </div>

      <button id="btnLicense" class="btn-license">
        <span id="licenseIcon">🔒</span> <span id="licenseText">ACTIVAR LICENCIA</span>
      </button>
    </header>

    <div class="main-stage">
      <div class="bottle-stage">
        <div class="bottle-box" id="bottleWrapper">
          <img src="bottle.png" alt="Inka Kola Bottle" class="bottle-img-overlay">
          <canvas id="liquidCanvas" width="200" height="360"></canvas>
        </div>

        <div class="refill-readout">
          <div class="percentage-text" id="pctReadout">50%</div>
        </div>
      </div>

      <div class="gas-fader-stage">
        <div class="gas-val" id="valOut">0.0 dB</div>
        <div class="fader-track-wrap" id="trackOut">
          <div class="fader-fill" id="fillOut" style="height:66%;"></div>
          <div class="fader-handle" id="handleOut" style="bottom:66%;"></div>
        </div>
        <div class="gas-label">GAS</div>
      </div>
    </div>

    <footer>
      <span>OFFSZN Plugins</span>
      <span>Edición Aniversario Perú 🇵🇪</span>
    </footer>

    <div class="modal-overlay" id="settingsModal">
      <div class="modal-card">
        <button class="modal-close" id="btnCloseSettings">✕</button>
        <div class="modal-title">
          <span>⚙️</span> AJUSTES AVANZADOS
        </div>

        <div class="modal-knobs-grid">
          <div class="knob-group">
            <div class="knob-label">STEREO WIDER</div>
            <div class="knob-container" id="knobWidth">
              <svg class="knob-svg" viewBox="0 0 100 100">
                <circle class="knob-bg" cx="50" cy="50" r="35"/>
                <circle class="knob-val" id="arcWidth" cx="50" cy="50" r="35"/>
              </svg>
              <div class="knob-cap"><div class="knob-dot" id="dotWidth"></div></div>
            </div>
            <div class="knob-readout" id="valWidth">120%</div>
          </div>

          <div class="knob-group">
            <div class="knob-label">10kHz AIR</div>
            <div class="knob-container" id="knobSat">
              <svg class="knob-svg" viewBox="0 0 100 100">
                <circle class="knob-bg" cx="50" cy="50" r="35"/>
                <circle class="knob-val" id="arcSat" cx="50" cy="50" r="35"/>
              </svg>
              <div class="knob-cap"><div class="knob-dot" id="dotSat"></div></div>
            </div>
            <div class="knob-readout" id="valSat">45%</div>
          </div>

          <div class="knob-group">
            <div class="knob-label">BASS MONO</div>
            <div class="knob-container" id="knobBass">
              <svg class="knob-svg" viewBox="0 0 100 100">
                <circle class="knob-bg" cx="50" cy="50" r="35"/>
                <circle class="knob-val" id="arcBass" cx="50" cy="50" r="35"/>
              </svg>
              <div class="knob-cap"><div class="knob-dot" id="dotBass"></div></div>
            </div>
            <div class="knob-readout" id="valBass">100 Hz</div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="licenseModal">
      <div class="modal-card">
        <button class="modal-close" id="btnCloseLicense">✕</button>
        <div class="modal-title">
          <span>🔑</span> ACTIVACIÓN DE LICENCIA
        </div>
        <div style="font-size:11px; color:var(--text-sub);">
          Introduce tu código de serie oficial de OFFSZN INKA KOLA.
        </div>
        <input type="text" id="licenseKeyInput" class="license-input" placeholder="INKA-FULL-XXXX-YYYY" value="INKA-FULL-2026-PERU">
        <button class="btn-activate" id="btnConfirmActivate">ACTIVAR LICENCIA</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      refill: 50,
      width: 120,
      sat10k: 45,
      bassMono: 100,
      outputGain: 0.0,
      isActivated: localStorage.getItem('offszn_inka_activated') === 'true'
    };

    function sendNativeParam(id, val) {
      if (window.setParam) {
        window.setParam(id, val);
      }
    }

    const canvas = document.getElementById('liquidCanvas');
    const ctx = canvas.getContext('2d');
    const pctReadout = document.getElementById('pctReadout');
    const btnGear = document.getElementById('btnGear');
    const settingsModal = document.getElementById('settingsModal');
    const btnLicense = document.getElementById('btnLicense');
    const licenseModal = document.getElementById('licenseModal');

    btnGear.addEventListener('click', () => { settingsModal.classList.add('open'); });
    document.getElementById('btnCloseSettings').addEventListener('click', () => { settingsModal.classList.remove('open'); });

    function updateLicenseUI() {
      if (state.isActivated) {
        btnLicense.classList.add('active-license');
        document.getElementById('licenseIcon').innerText = '🔓';
        document.getElementById('licenseText').innerText = 'LICENCIA ACTIVA';
      } else {
        btnLicense.classList.remove('active-license');
        document.getElementById('licenseIcon').innerText = '🔒';
        document.getElementById('licenseText').innerText = 'ACTIVAR LICENCIA';
      }
    }
    updateLicenseUI();

    btnLicense.addEventListener('click', () => { licenseModal.classList.add('open'); });
    document.getElementById('btnCloseLicense').addEventListener('click', () => { licenseModal.classList.remove('open'); });

    document.getElementById('btnConfirmActivate').addEventListener('click', () => {
      const key = document.getElementById('licenseKeyInput').value.trim();
      if (key.length > 5) {
        state.isActivated = true;
        localStorage.setItem('offszn_inka_activated', 'true');
        updateLicenseUI();
        licenseModal.classList.remove('open');
        alert('¡Licencia OFFSZN activada exitosamente!');
      } else {
        alert('Por favor introduce un número de serie válido.');
      }
    });

    const bubbles = [];
    for (let i = 0; i < 20; i++) {
      bubbles.push({
        x: Math.random() * 80 + 60,
        y: Math.random() * 240 + 70,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 0.5 + 0.3,
        wobble: Math.random() * Math.PI * 2
      });
    }

    let waveOffset = 0;

    function renderBottleLiquid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      waveOffset += 0.03;

      const w = canvas.width;
      const pct = state.refill / 100;

      ctx.save();

      ctx.beginPath();
      ctx.moveTo(82, 60);
      ctx.lineTo(118, 60);
      ctx.bezierCurveTo(122, 100, 156, 132, 160, 170);
      ctx.lineTo(160, 305);
      ctx.bezierCurveTo(160, 328, 140, 335, 100, 335);
      ctx.bezierCurveTo(60, 335, 40, 328, 40, 305);
      ctx.lineTo(40, 170);
      ctx.bezierCurveTo(44, 132, 78, 100, 82, 60);
      ctx.closePath();
      ctx.clip();

      const minY = 70;
      const maxY = 330;
      const fillY = maxY - (maxY - minY) * pct;

      if (pct > 0.01) {
        const liqGrad = ctx.createLinearGradient(0, fillY, 0, maxY);
        liqGrad.addColorStop(0, '#ffee33');
        liqGrad.addColorStop(0.3, '#ffcc00');
        liqGrad.addColorStop(1, '#d48800');

        ctx.fillStyle = liqGrad;
        ctx.beginPath();
        ctx.moveTo(0, maxY + 20);

        for (let x = 0; x <= w; x += 4) {
          const waveY = fillY + Math.sin(x * 0.04 + waveOffset) * 2.5 + Math.cos(x * 0.02 - waveOffset * 0.3) * 1.2;
          ctx.lineTo(x, waveY);
        }

        ctx.lineTo(w, maxY + 20);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 210, 0.7)';
        ctx.beginPath();
        for (let x = 0; x <= w; x += 4) {
          const waveY = fillY + Math.sin(x * 0.04 + waveOffset) * 2.5;
          ctx.lineTo(x, waveY - 1);
        }
        for (let x = w; x >= 0; x -= 4) {
          const waveY = fillY + Math.sin(x * 0.04 + waveOffset) * 2.5;
          ctx.lineTo(x, waveY + 3);
        }
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 200, 0.65)';
        bubbles.forEach(b => {
          b.y -= b.speed;
          b.wobble += 0.02;
          const bubbleX = b.x + Math.sin(b.wobble) * 1.5;

          if (b.y < fillY) {
            b.y = maxY - Math.random() * 15;
            b.x = Math.random() * 80 + 60;
          }

          if (b.y >= fillY) {
            ctx.beginPath();
            ctx.arc(bubbleX, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      ctx.restore();
      requestAnimationFrame(renderBottleLiquid);
    }

    renderBottleLiquid();

    const bottleWrapper = document.getElementById('bottleWrapper');
    let isDraggingBottle = false;
    let startY = 0;
    let startVal = 50;

    bottleWrapper.addEventListener('mousedown', e => {
      isDraggingBottle = true;
      startY = e.clientY;
      startVal = state.refill;
      document.body.style.cursor = 'ns-resize';
    });

    window.addEventListener('mousemove', e => {
      if (!isDraggingBottle) return;
      const deltaY = startY - e.clientY;
      let newVal = Math.min(100, Math.max(0, startVal + deltaY * 0.35));
      state.refill = Math.round(newVal);
      pctReadout.innerText = state.refill + '%';
      sendNativeParam('refill', state.refill);
    });

    window.addEventListener('mouseup', () => {
      isDraggingBottle = false;
      document.body.style.cursor = 'default';
    });

    function setupKnob(id, min, max, initial, unit, paramKey) {
      const knob = document.getElementById(id);
      const arc = knob.querySelector('.knob-val');
      const dot = knob.querySelector('.knob-dot');
      const readout = knob.parentNode.querySelector('.knob-readout');

      let val = initial;

      function updateUI(v) {
        val = v;
        const pct = (val - min) / (max - min);
        const dashoffset = 220 - (pct * 165);
        arc.style.strokeDashoffset = dashoffset;
        const angle = -135 + (pct * 270);
        dot.style.transform = `rotate(${angle}deg)`;
        readout.innerText = Math.round(val) + ' ' + unit;
        sendNativeParam(paramKey, val);
      }

      updateUI(initial);

      let dragging = false;
      let startY = 0;
      let startV = initial;

      knob.addEventListener('mousedown', e => {
        dragging = true;
        startY = e.clientY;
        startV = val;
      });

      window.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dy = startY - e.clientY;
        const range = max - min;
        let nV = Math.min(max, Math.max(min, startV + (dy / 140) * range));
        updateUI(nV);
      });

      window.addEventListener('mouseup', () => { dragging = false; });
    }

    setupKnob('knobWidth', 0, 200, state.width, '%', 'width');
    setupKnob('knobSat', 0, 100, state.sat10k, '%', 'sat10k');
    setupKnob('knobBass', 20, 250, state.bassMono, 'Hz', 'bassMono');

    function setupFader() {
      const track = document.getElementById('trackOut');
      const fill = document.getElementById('fillOut');
      const handle = document.getElementById('handleOut');
      const valOut = document.getElementById('valOut');

      function update(v) {
        state.outputGain = Math.min(6, Math.max(-12, v));
        const pct = (state.outputGain - (-12)) / (6 - (-12));
        fill.style.height = (pct * 100).toFixed(1) + '%';
        handle.style.bottom = (pct * 100).toFixed(1) + '%';
        valOut.innerText = state.outputGain.toFixed(1) + ' dB';
        sendNativeParam('outputGain', state.outputGain);
      }

      update(0.0);
      let dragging = false;

      track.addEventListener('mousedown', e => {
        dragging = true;
        calc(e.clientY);
      });

      window.addEventListener('mousemove', e => {
        if (dragging) calc(e.clientY);
      });

      window.addEventListener('mouseup', () => { dragging = false; });

      function calc(clientY) {
        const rect = track.getBoundingClientRect();
        const offsetY = rect.bottom - clientY;
        const pct = Math.min(1, Math.max(0, offsetY / rect.height));
        update(-12 + pct * 18);
      }
    }
    setupFader();
  </script>
</body>
</html>
