<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INKA KOLA by OFFSZN</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcc00;
            --gold-dark: #b88800;
            --bg: #080b12;
            --panel: #0c1020;
            --dim: #4e5e78;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: #f0f4ff;
            font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; width: 100vw;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        /* ─── PLUGIN CONTAINER (COMPACT FIXED WIDTH) ─── */
        .plugin {
            width: 580px;
            height: 520px;
            background: var(--panel);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
            flex-shrink: 0;
        }

        /* ─── HEADER ─── */
        .hdr {
            height: 48px;
            background: rgba(4,7,14,0.98);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .hdr-l { display: flex; align-items: center; gap: 10px; }
        .flag {
            width: 20px; height: 13px;
            background: linear-gradient(90deg, #d91424 33.3%, #fff 33.3%, #fff 66.6%, #d91424 66.6%);
            border-radius: 2px;
            flex-shrink: 0;
        }
        .brand { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--gold); }
        
        .btn-gear {
            width: 28px; height: 28px; border-radius: 6px;
            background: rgba(255,204,0,.06); border: 1px solid rgba(255,204,0,.18);
            color: var(--gold); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .hdr-r { display: flex; align-items: center; gap: 8px; }

        /* Subtle 7-day trial badge */
        .trial-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--gold);
            background: rgba(255, 204, 0, 0.08);
            border: 1px solid rgba(255, 204, 0, 0.2);
            border-radius: 12px;
            padding: 3px 8px;
            text-transform: uppercase;
        }

        .btn-lic {
            padding: 4px 10px;
            background: rgba(255,204,0,.06); border: 1px solid rgba(255,204,0,.2);
            border-radius: 16px; color: var(--gold);
            font-size: 10px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-lic.active { background: rgba(0,230,118,.08); border-color: #00e676; color: #00e676; }
        .l-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

        /* ─── STAGE (FIXED LAYOUT - NO JITTER) ─── */
        .stage {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            gap: 40px; padding: 10px 20px;
        }

        /* ─── BOTTLE CONTAINER ─── */
        .bottle-zone {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            flex-shrink: 0;
            width: 220px;
        }

        .bottle-wrap {
            position: relative;
            width: 220px;
            height: 360px;
            cursor: ns-resize;
            flex-shrink: 0;
        }

        /* White backing for multiply blend mode */
        .bottle-bg-white {
            position: absolute; inset: 0;
            background: #ffffff; border-radius: 4px;
        }

        .bottle-empty {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 1;
        }

        /* Full bottle liquid - NO TRANSITION to eliminate drag jitter/wobble */
        .bottle-full {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 2;
            clip-path: inset(50% 0 0 0);
            transition: none;
        }

        /* Label on top of everything - 100% OPAQUE NORMAL BLEND MODE */
        .bottle-label {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            mix-blend-mode: normal;
            pointer-events: none;
            z-index: 10;
        }

        /* Editable Percentage Input Box - NO SPINNER ARROWS & PERFECT FIT */
        .pct-box {
            display: flex; align-items: center; justify-content: center;
            gap: 1px;
            width: 120px;
            margin-top: 2px;
        }

        /* Hide HTML5 input number spinners completely */
        .pct-input::-webkit-outer-spin-button,
        .pct-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .pct-input[type=number] {
            -moz-appearance: textfield;
        }

        .pct-input {
            width: 72px;
            background: transparent;
            border: none;
            color: var(--gold);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px; font-weight: 700;
            text-align: right;
            outline: none;
            padding: 0;
            box-shadow: none;
        }
        .pct-symbol {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px; font-weight: 700; color: var(--gold);
            line-height: 1;
        }

        /* ─── GAS FADER (FIXED WIDTH - NO JITTER) ─── */
        .fader-col {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            flex-shrink: 0;
            width: 60px;
        }
        .fader-db {
            font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; color: var(--gold);
            width: 60px; text-align: center;
            flex-shrink: 0;
        }
        .fader-track {
            position: relative; width: 22px; height: 230px;
            background: rgba(0,0,0,.8); border-radius: 11px;
            border: 1px solid rgba(255,255,255,.08);
            cursor: ns-resize; display: flex; align-items: flex-end; padding: 3px;
            flex-shrink: 0;
        }
        .fader-fill {
            width: 100%; background: linear-gradient(0deg, var(--gold-dark), var(--gold), #ffe566);
            border-radius: 8px; min-height: 4px;
            transition: none;
        }
        .fader-thumb {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 30px; height: 12px;
            background: linear-gradient(135deg, #1e2d42, #111825);
            border: 1.5px solid var(--gold); border-radius: 4px; pointer-events: none;
            transition: none;
        }
        .fader-lbl { font-size: 10px; font-weight: 900; letter-spacing: 3px; color: var(--gold); }

        /* ─── FOOTER ─── */
        .ftr {
            height: 32px; background: rgba(4,7,14,.98);
            border-top: 1px solid rgba(255,255,255,.05); padding: 0 18px;
            display: flex; align-items: center; justify-content: space-between;
            font-size: 9px; color: var(--dim); font-weight: 600; letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* ─── MODALS (ONLY CLOSES WITH 'X' BUTTON) ─── */
        .modal {
            position: absolute; inset: 0;
            background: rgba(3,5,12,.92); backdrop-filter: blur(12px);
            z-index: 500; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; border-radius: 14px;
        }
        .modal.open { opacity: 1; pointer-events: auto; }
        .mcard {
            width: 420px;
            background: #0d1424;
            border: 1px solid rgba(255,204,0,.2); border-radius: 12px; padding: 20px 24px;
            display: flex; flex-direction: column; gap: 16px; position: relative;
        }
        .mhdr { display: flex; justify-content: space-between; align-items: center; }
        .mttl { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--gold); display: flex; align-items: center; gap: 6px; }
        .mx { background: none; border: none; color: var(--dim); font-size: 16px; cursor: pointer; }
        .mx:hover { color: #fff; }

        /* Knobs Row */
        .knobs { display: flex; justify-content: space-between; align-items: flex-start; padding: 4px 0; }
        .kg { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 110px; }
        .klbl { font-size: 9px; font-weight: 800; letter-spacing: 1px; color: #8899bb; text-align: center; }
        
        .kw {
            position: relative; width: 70px; height: 70px; cursor: ns-resize;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* SVG Knob Arc Alignment Fix */
        .ksvg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            transform: rotate(135deg); /* 135deg rotation aligns 0% at 7:30 o'clock */
        }
        .kbg {
            fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 5;
            stroke-linecap: round;
        }
        .kfg {
            fill: none; stroke: var(--gold); stroke-width: 5; stroke-linecap: round;
        }

        .kcap {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(145deg, #182436, #0e1624);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 4px 8px rgba(0,0,0,.4);
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .kpip {
            width: 3px; height: 11px; background: var(--gold); border-radius: 2px;
            position: absolute; top: 5px;
            transform-origin: center 19px;
        }
        .kval { font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; color: var(--gold); }

        /* License modal */
        .lmod { position: absolute; inset: 0; background: rgba(3,5,12,.92); backdrop-filter: blur(12px); z-index: 600; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; border-radius: 14px; }
        .lmod.open { opacity: 1; pointer-events: auto; }
        .lcard { width: 330px; background: #0d1424; border: 1px solid rgba(255,204,0,.2); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; position: relative; }
        .lx { position: absolute; top: 12px; right: 14px; background: none; border: none; color: var(--dim); font-size: 15px; cursor: pointer; }
        .lx:hover { color: #fff; }
        .lttl { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--gold); }
        .lsub { font-size: 10px; color: var(--dim); line-height: 1.4; }
        .lin { width: 100%; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 9px; color: var(--gold); font-family: 'Space Grotesk', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; outline: none; text-align: center; }
        .lin:focus { border-color: var(--gold); }
        .lbtn { width: 100%; padding: 10px; border-radius: 6px; border: none; background: var(--gold); color: #080b12; font-family: 'Outfit'; font-size: 11px; font-weight: 800; letter-spacing: 1px; cursor: pointer; }
    </style>
</head>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
    refill: parseInt(localStorage.getItem('inka_refill')) || 50,
    gain:   parseFloat(localStorage.getItem('inka_gain')) || 0,
    width:  parseInt(localStorage.getItem('inka_width'))  || 120,
    air:    parseInt(localStorage.getItem('inka_air'))    || 45,
    bass:   parseInt(localStorage.getItem('inka_bass'))   || 100,
    lic:    localStorage.getItem('inka_lic_v1') === '1'
};

function send(id, v) {
    if (window.__JUCE__?.postMessageToNative) window.__JUCE__.postMessageToNative('setParam', [id, v]);
    else if (window.setParam) window.setParam(id, v);
}

const bFull    = document.getElementById('bFull');
const pctInput = document.getElementById('pctInput');

function updateRefill(val, updateInput = true) {
    S.refill = Math.min(100, Math.max(0, Math.round(val)));
    localStorage.setItem('inka_refill', S.refill);
    
    if (updateInput) {
        pctInput.value = S.refill;
    }

    // Map 0-100% to liquid height inside bottle
    // 0% -> 96% top clip (empty)
    // 100% -> 12% top clip (full liquid)
    const topClip = 96 - (S.refill / 100) * 84;
    bFull.style.clipPath = `inset(${topClip.toFixed(1)}% 0 0 0)`;

    send('refill', S.refill);
}

// REAL-TIME VALIDATION & CHANGE ONLY ON ENTER / BLUR
pctInput.addEventListener('input', e => {
    let val = parseInt(e.target.value);
    // Real-time validation: prevent values > 100
    if (val > 100) {
        e.target.value = 100;
    } else if (val < 0) {
        e.target.value = 0;
    }
});

function applyPctFromInput() {
    let val = parseInt(pctInput.value);
    if (isNaN(val)) val = S.refill;
    val = Math.min(100, Math.max(0, val));
    updateRefill(val, true);
}

pctInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        applyPctFromInput();
        pctInput.blur();
    }
});

pctInput.addEventListener('blur', () => {
    applyPctFromInput();
});

// ─── BOTTLE DRAG (vertical → fill %) ─────────────────────────────────────────
const bWrap = document.getElementById('bWrap');
let bd = false, bsy = 0, bsv = 50;

bWrap.addEventListener('mousedown', e => {
    bd = true; bsy = e.clientY; bsv = S.refill;
    document.body.style.cursor = 'ns-resize';
    e.preventDefault();
});
window.addEventListener('mousemove', e => {
    if (!bd) return;
    updateRefill(bsv + (bsy - e.clientY) * 0.5);
});
window.addEventListener('mouseup', () => { bd = false; document.body.style.cursor = ''; });

bWrap.addEventListener('touchstart', e => {
    bd = true; bsy = e.touches[0].clientY; bsv = S.refill;
    e.preventDefault();
}, { passive: false });
window.addEventListener('touchmove', e => {
    if (!bd) return;
    updateRefill(bsv + (bsy - e.touches[0].clientY) * 0.5);
}, { passive: false });
window.addEventListener('touchend', () => { bd = false; });

// ─── GAS FADER ───────────────────────────────────────────────────────────────
const ft  = document.getElementById('ftrack');
const ff  = document.getElementById('ffill');
const fth = document.getElementById('fthumb');

function setG(v) {
    S.gain = Math.min(6, Math.max(-12, v));
    localStorage.setItem('inka_gain', S.gain);
    const p = (S.gain + 12) / 18, h = (p * 100).toFixed(1) + '%';
    ff.style.height = h; fth.style.bottom = h;
    document.getElementById('fdb').textContent = S.gain.toFixed(1) + ' dB';
    send('outputGain', S.gain);
}

let fd = false;
ft.addEventListener('mousedown', e => { fd = true; cg(e.clientY); e.preventDefault(); });
window.addEventListener('mousemove', e => { if (fd) cg(e.clientY); });
window.addEventListener('mouseup', () => { fd = false; });
function cg(cy) {
    const r = ft.getBoundingClientRect();
    setG(-12 + Math.min(1, Math.max(0, (r.bottom - cy) / r.height)) * 18);
}

// ─── KNOBS ENGINE WITH PERFECT SVG ALIGNMENT ─────────────────────────────────
function knob(wi, ai, pi, vi, min, max, initVal, keyName, fmt) {
    const wrap = document.getElementById(wi);
    const arc  = document.getElementById(ai);
    const pip  = document.getElementById(pi);
    const val  = document.getElementById(vi);

    // r = 28, C = 2 * PI * 28 = 175.93
    const C = 2 * Math.PI * 28;
    const ARC_SPAN = 0.75; // 270 degrees sweep

    let currentVal = initVal;

    function set(nv) {
        currentVal = Math.min(max, Math.max(min, nv));
        S[keyName] = currentVal;
        localStorage.setItem('inka_' + keyName, currentVal);

        const pct = (currentVal - min) / (max - min);

        // Arc dashoffset: C * (1 - pct * 0.75)
        const filledLen = pct * C * ARC_SPAN;
        arc.style.strokeDashoffset = (C - filledLen).toFixed(2);

        // Indicator needle rotation: -135deg (min) to +135deg (max)
        const angle = -135 + pct * 270;
        pip.style.transform = `rotate(${angle.toFixed(1)}deg)`;

        val.textContent = fmt(currentVal);
        send(keyName, currentVal);
    }

    let kd = false, ky = 0, kv = initVal;
    wrap.addEventListener('mousedown', e => { kd = true; ky = e.clientY; kv = currentVal; e.preventDefault(); });
    window.addEventListener('mousemove', e => {
        if (!kd) return;
        set(kv + (ky - e.clientY) / 140 * (max - min));
    });
    window.addEventListener('mouseup', () => { kd = false; });

    set(initVal);
}

// Initialize Knobs with saved/initial values
knob('kW', 'aW', 'pW', 'vW',  0, 200, S.width, 'width', v => Math.round(v) + '%');
knob('kA', 'aA', 'pA', 'vA',  0, 100, S.air,   'air',   v => Math.round(v) + '%');
knob('kB', 'aB', 'pB', 'vB', 20, 250, S.bass,  'bass',  v => Math.round(v) + ' Hz');

// Initial state application
updateRefill(S.refill);
setG(S.gain);

// ─── MODALS (ONLY CLOSES WITH 'X' BUTTON, NOT ON BACKDROP CLICK) ─────────────
const sm = document.getElementById('sMod'), lm = document.getElementById('lMod');
document.getElementById('btnGear').onclick = () => sm.classList.add('open');
document.getElementById('mClose').onclick  = () => sm.classList.remove('open');
document.getElementById('btnLic').onclick  = () => lm.classList.add('open');
document.getElementById('lClose').onclick  = () => lm.classList.remove('open');

function rLic() {
    const b = document.getElementById('btnLic'), t = document.getElementById('licTxt');
    if (S.lic) { b.classList.add('active'); t.textContent = 'LICENCIA ACTIVA'; }
    else { b.classList.remove('active'); t.textContent = 'ACTIVAR'; }
}
rLic();
document.getElementById('lBtn').onclick = () => {
    if (document.getElementById('licIn').value.trim().length >= 6) {
        S.lic = true; localStorage.setItem('inka_lic_v1', '1'); rLic(); lm.classList.remove('open');
    }
};
