<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INKA KOLA by OFFSZN</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcc00;
            --gold-dark: #b88800;
            --bg: #080b12;
            --panel: #0c1020;
            --dim: #4e5e78;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: #f0f4ff;
            font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; width: 100vw;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        /* ─── LOADING SCREEN ─── */
        .loading-overlay {
            position: absolute; inset: 0;
            background: #080b12;
            z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.fade-out {
            opacity: 0; pointer-events: none;
        }
        .loading-logo {
            font-size: 22px; font-weight: 800; letter-spacing: 4px; color: var(--gold);
            margin-bottom: 4px;
        }
        .loading-sub {
            font-size: 10px; font-weight: 700; letter-spacing: 3px; color: var(--dim);
            margin-bottom: 24px;
        }
        .loading-track {
            width: 140px; height: 3px;
            background: rgba(255,255,255,0.08); border-radius: 2px;
            overflow: hidden; position: relative;
        }
        .loading-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold));
            border-radius: 2px;
            transition: width 0.7s ease;
        }

        /* ─── PLUGIN CONTAINER ─── */
        .plugin {
            width: 580px;
            height: 520px;
            background: var(--panel);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
            flex-shrink: 0;
        }

        /* ─── HEADER ─── */
        .hdr {
            height: 48px;
            background: rgba(4,7,14,0.98);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .hdr-l { display: flex; align-items: center; gap: 10px; }
        .flag {
            width: 20px; height: 13px;
            background: linear-gradient(90deg, #d91424 33.3%, #fff 33.3%, #fff 66.6%, #d91424 66.6%);
            border-radius: 2px;
            flex-shrink: 0;
        }
        .brand { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--gold); }
        
        .btn-gear {
            width: 28px; height: 28px; border-radius: 6px;
            background: rgba(255,204,0,.06); border: 1px solid rgba(255,204,0,.18);
            color: var(--gold); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .btn-gear:hover { background: rgba(255,204,0,.14); }

        .hdr-r { display: flex; align-items: center; gap: 8px; }

        /* Subtle 7-day trial badge */
        .trial-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--gold);
            background: rgba(255, 204, 0, 0.08);
            border: 1px solid rgba(255, 204, 0, 0.2);
            border-radius: 12px;
            padding: 3px 8px;
            text-transform: uppercase;
        }

        /* ─── STAGE ─── */
        .stage {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            gap: 40px; padding: 10px 20px;
        }

        /* ─── BOTTLE CONTAINER ─── */
        .bottle-zone {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            flex-shrink: 0;
            width: 220px;
        }

        .bottle-wrap {
            position: relative;
            width: 220px;
            height: 360px;
            cursor: ns-resize;
            flex-shrink: 0;
        }

        /* White backing for multiply blend mode */
        .bottle-bg-white {
            position: absolute; inset: 0;
            background: #ffffff; border-radius: 4px;
        }

        .bottle-empty {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 1;
        }

        /* Full bottle liquid - NO TRANSITION to eliminate drag jitter/wobble */
        .bottle-full {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 2;
            clip-path: inset(50% 0 0 0);
            transition: none;
        }

        /* Label on top of everything - NORMAL BLEND (never tinted) */
        .bottle-label {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            mix-blend-mode: normal;
            pointer-events: none;
            z-index: 10;
        }

        /* Editable Percentage Input Box - NO SPINNER ARROWS */
        .pct-box {
            display: flex; align-items: center; justify-content: center;
            gap: 1px;
            width: 120px;
            margin-top: 2px;
        }

        /* Hide HTML5 input number spinners completely */
        .pct-input::-webkit-outer-spin-button,
        .pct-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .pct-input[type=number] {
            -moz-appearance: textfield;
        }

        .pct-input {
            width: 72px;
            background: transparent;
            border: none;
            color: var(--gold);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px; font-weight: 700;
            text-align: right;
            outline: none;
            padding: 0;
            box-shadow: none;
        }
        .pct-symbol {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px; font-weight: 700; color: var(--gold);
            line-height: 1;
        }

        /* ─── GAS FADER (0–100%) ─── */
        .fader-col {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            flex-shrink: 0;
            width: 60px;
        }
        .fader-track {
            position: relative; width: 22px; height: 230px;
            background: rgba(0,0,0,.8); border-radius: 11px;
            border: 1px solid rgba(255,255,255,.08);
            cursor: ns-resize; display: flex; align-items: flex-end; padding: 3px;
            flex-shrink: 0;
        }
        .fader-fill {
            width: 100%; background: linear-gradient(0deg, var(--gold-dark), var(--gold), #ffe566);
            border-radius: 8px; min-height: 4px;
            transition: none;
        }
        .fader-thumb {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 30px; height: 12px;
            background: linear-gradient(135deg, #1e2d42, #111825);
            border: 1.5px solid var(--gold); border-radius: 4px; pointer-events: none;
            transition: none;
        }
        .fader-lbl { font-size: 10px; font-weight: 900; letter-spacing: 3px; color: var(--gold); }

        /* ─── FOOTER ─── */
        .ftr {
            height: 32px; background: rgba(4,7,14,.98);
            border-top: 1px solid rgba(255,255,255,.05); padding: 0 18px;
            display: flex; align-items: center; justify-content: space-between;
            font-size: 9px; color: var(--dim); font-weight: 600; letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* ─── MODALS (ONLY CLOSES WITH 'X' BUTTON) ─── */
        .modal {
            position: absolute; inset: 0;
            background: rgba(3,5,12,.92); backdrop-filter: blur(12px);
            z-index: 500; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
        }
        .modal.open { opacity: 1; pointer-events: auto; }
        .mcard {
            width: 420px;
            background: #0d1424;
            border: 1px solid rgba(255,204,0,.2); border-radius: 12px; padding: 20px 24px;
            display: flex; flex-direction: column; gap: 16px; position: relative;
        }
        .mhdr { display: flex; justify-content: space-between; align-items: center; }
        .mttl { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--gold); display: flex; align-items: center; gap: 6px; }
        .mx { background: none; border: none; color: var(--dim); font-size: 16px; cursor: pointer; padding: 4px 8px; }
        .mx:hover { color: #fff; }

        /* Knobs Row */
        .knobs { display: flex; justify-content: space-between; align-items: flex-start; padding: 4px 0; }
        .kg { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 110px; }
        .klbl { font-size: 9px; font-weight: 800; letter-spacing: 1px; color: #8899bb; text-align: center; }
        
        .kw {
            position: relative; width: 70px; height: 70px; cursor: ns-resize;
            display: flex; align-items: center; justify-content: center;
        }
        
        .ksvg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            transform: rotate(135deg);
        }
        .kbg {
            fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 5;
            stroke-linecap: round;
        }
        .kfg {
            fill: none; stroke: var(--gold); stroke-width: 5; stroke-linecap: round;
        }

        .kcap {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(145deg, #182436, #0e1624);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 4px 8px rgba(0,0,0,.4);
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .kpip {
            width: 3px; height: 11px; background: var(--gold); border-radius: 2px;
            position: absolute; top: 5px;
            transform-origin: center 19px;
        }
        .kval { font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; color: var(--gold); }
    </style>
</head>
<body>
<div class="plugin">

    <!-- PANTALLA DE CARGA INKA KOLA -->

        <div class="loading-logo">INKA KOLA</div>

            <button class="btn-gear" id="btnGear" title="Ajustes Avanzados">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

                <img class="bottle-label" src="ETIQUETA PNG.png" alt="Inka Kola Label">

    <div class="modal" id="sMod">

<script>
// ─── PANTALLA DE CARGA (1s, animación de barra suave + fade out) ───────────
(function() {
    var screen = document.getElementById('loading-screen');
    var bar = document.getElementById('loadingBar');
    if (!screen || !bar) return;
    setTimeout(function() { bar.style.width = '100%'; }, 50);
    setTimeout(function() {
        screen.classList.add('fade-out');
        setTimeout(function() { screen.style.display = 'none'; }, 450);
    }, 900);
})();

// ─── JUCE NATIVE BRIDGE ──────────────────────────────────────────────────────
function sendToJUCE(id, v) {
    try {
        if (window.__JUCE__ && window.__JUCE__.backend) {
            window.__JUCE__.backend.emitEvent('setParam', [id, v]);
        }
    } catch(e) {
        // standalone browser preview: ignore
    }
}

// ─── STATE (SINGLE UNIFIED GAS/REFILL VALUE) ──────────────────────────────
const S = {
    gas:   parseInt(localStorage.getItem('inka_gas'))  || 50,  // default 50%
    width: parseInt(localStorage.getItem('inka_width')) || 120,
    air:   parseInt(localStorage.getItem('inka_air'))   || 45,
    bass:  parseInt(localStorage.getItem('inka_bass'))  || 100,
};

// ─── DOM ELEMENTS ─────────────────────────────────────────────────────────────
const bFull    = document.getElementById('bFull');
const pctInput = document.getElementById('pctInput');
const ft       = document.getElementById('ftrack');
const ff       = document.getElementById('ffill');
const fth      = document.getElementById('fthumb');

// ─── UNIFIED REAL-TIME UPDATE FUNCTION ──────────────────────────────────────
function updateGas(val, updateInput) {
    S.gas = Math.min(100, Math.max(0, Math.round(val)));
    localStorage.setItem('inka_gas', S.gas);
    
    if (updateInput !== false) {
        pctInput.value = S.gas;
    }

    const topClip = 96 - (S.gas / 100) * 84;
    bFull.style.clipPath = 'inset(' + topClip.toFixed(1) + '% 0 0 0)';

    const h = S.gas + '%';
    ff.style.height  = h;
    fth.style.bottom = h;

    sendToJUCE('refill', S.gas);
    sendToJUCE('outputGain', S.gas);
}

// ─── PERCENTAGE INPUT VALIDATION & REAL-TIME EVENT HANDLERS ────────────────
pctInput.addEventListener('input', function(e) {
    var val = parseInt(e.target.value);
    if (val > 100) e.target.value = 100;
    else if (val < 0) e.target.value = 0;
});

function applyPctFromInput() {
    var val = parseInt(pctInput.value);
    if (isNaN(val)) val = S.gas;
    val = Math.min(100, Math.max(0, val));
    updateGas(val, true);
}

pctInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { applyPctFromInput(); pctInput.blur(); }
});
pctInput.addEventListener('blur', applyPctFromInput);

// ─── BOTTLE REAL-TIME DRAG ──────────────────────────────────────────────────
var bWrap = document.getElementById('bWrap');
var bd = false, bsy = 0, bsv = 50;

bWrap.addEventListener('mousedown', function(e) {
    bd = true; bsy = e.clientY; bsv = S.gas;
    document.body.style.cursor = 'ns-resize';
    e.preventDefault();
});
document.addEventListener('mousemove', function(e) {
    if (!bd) return;
    updateGas(bsv + (bsy - e.clientY) * 0.5);
});
document.addEventListener('mouseup', function() { bd = false; document.body.style.cursor = ''; });

bWrap.addEventListener('touchstart', function(e) {
    bd = true; bsy = e.touches[0].clientY; bsv = S.gas;
    e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', function(e) {
    if (!bd) return;
    updateGas(bsv + (bsy - e.touches[0].clientY) * 0.5);
}, { passive: false });
document.addEventListener('touchend', function() { bd = false; });

// ─── GAS FADER REAL-TIME DRAG ──────────────────────────────────────────────
var ffd = false;

function calcGain(clientY) {
    var r = ft.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (r.bottom - clientY) / r.height));
    updateGas(p * 100);
}

ft.addEventListener('mousedown', function(e) { ffd = true; calcGain(e.clientY); e.preventDefault(); });
document.addEventListener('mousemove', function(e) { if (ffd) calcGain(e.clientY); });
document.addEventListener('mouseup',   function()  { ffd = false; });

ft.addEventListener('touchstart', function(e) { ffd = true; calcGain(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', function(e) { if (ffd) calcGain(e.touches[0].clientY); }, { passive: false });
document.addEventListener('touchend', function() { ffd = false; });

// ─── KNOBS ENGINE ────────────────────────────────────────────────────────────
function makeKnob(wrapId, arcId, pipId, valId, min, max, initVal, paramKey, formatFn) {
    var wrap = document.getElementById(wrapId);
    var arc  = document.getElementById(arcId);
    var pip  = document.getElementById(pipId);
    var lbl  = document.getElementById(valId);

    if (!wrap || !arc || !pip || !lbl) return;

    var C = 2 * Math.PI * 28;   // circumference for r=28
    var currentVal = initVal;
    var dragging = false, startY = 0, startVal = initVal;

    function applyVal(nv) {
        currentVal = Math.min(max, Math.max(min, nv));
        S[paramKey] = currentVal;
        localStorage.setItem('inka_' + paramKey, currentVal);

        var pct = (currentVal - min) / (max - min);

        var filledLen = pct * C * 0.75;
        arc.style.strokeDashoffset = (C - filledLen).toFixed(2);

        var angle = -135 + pct * 270;
        pip.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';

        lbl.textContent = formatFn(currentVal);
        sendToJUCE(paramKey, currentVal);
    }

    wrap.addEventListener('mousedown', function(e) {
        dragging = true; startY = e.clientY; startVal = currentVal;
        e.preventDefault(); e.stopPropagation();
    });
    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        applyVal(startVal + (startY - e.clientY) / 140 * (max - min));
    });
    document.addEventListener('mouseup', function() { dragging = false; });

    wrap.addEventListener('touchstart', function(e) {
        dragging = true; startY = e.touches[0].clientY; startVal = currentVal;
        e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchmove', function(e) {
        if (!dragging) return;
        applyVal(startVal + (startY - e.touches[0].clientY) / 140 * (max - min));
    }, { passive: false });
    document.addEventListener('touchend', function() { dragging = false; });

    applyVal(initVal);
}

makeKnob('kA', 'aA', 'pA', 'vA',  0,   100, S.air,   'air',   function(v) { return Math.round(v) + '%'; });
