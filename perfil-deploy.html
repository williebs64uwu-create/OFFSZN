<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - OFFSZN</title>
    
    <!-- Fuentes y Iconos Base -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="/store-builder/css/theme-base.css">
    <link rel="stylesheet" href="/css/global-overlays.css">
</head>
<body>

    <!-- LIENZO DE DESPLIEGUE -->
    <div class="store-root" id="storeRenderRoot">
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff;">
            <div class="spinner-border text-light" role="status"></div>
        </div>
    </div>

    <!-- Scripts Globales (Para Auth y BD) -->
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/script/premium-profile-bg.js"></script>
    <script src="/script/cart.js?v=23"></script>
    
    <!-- Configuración del entorno de despliegue -->
    <script>
        window.IS_LIVE_PROFILE = true; // Indica que es el entorno de producción
        window.supabase = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        window.supabaseClient = window.supabase; // Requerido por cart.js

        // Definir closeAllOverlays para que cart.js pueda cerrarse
        window.closeAllOverlays = function() {
            const cart = document.getElementById('globalCartPanel');
            const back = document.getElementById('globalBackdrop');
            if (cart) cart.classList.remove('active');
            if (back) back.classList.remove('active');
        };
    </script>

    <!-- Scripts del Renderizador -->
    <script type="module">
        import { RendererEngine } from '/store-builder/js/renderer/engine.js';
        
        async function loadDeployedProfile() {
            try {
                // 1. Identificar el perfil a cargar (variable inyectada, parámetro URL o subdominio)
                let requestedUser = window.OFFSZN_PROFILE_USER || new URLSearchParams(window.location.search).get('u');
                
                if (!requestedUser) {
                    // Intento por subdominio
                    const host = window.location.host;
                    if (host && (host.includes('.offszn.lat') || host.includes('.localhost:3000'))) {
                        const parts = host.split('.');
                        if (parts.length >= 2) {
                            requestedUser = parts[0];
                        }
                    }
                }
                
                if (!requestedUser) {
                    document.getElementById('storeRenderRoot').innerHTML = '<div style="padding: 100px; text-align: center; color: #fff;">Usuario no especificado</div>';
                    return;
                }

                // 2. Buscar usuario en Supabase
                const { data: userData, error: userError } = await window.supabase
                    .from('users')
                    .select('id, nickname, email, avatar_url, bio, role, license_settings, socials')
                    .eq('nickname', requestedUser)
                    .single();

                if (userError || !userData) {
                    document.getElementById('storeRenderRoot').innerHTML = '<div style="padding: 100px; text-align: center; color: #fff;">Perfil no encontrado</div>';
                    return;
                }

                window.userNickname = userData.nickname;
                window.builderNickname = userData.nickname;

                // 2b. Buscar productos reales del usuario en public.products
                const { data: productsData } = await window.supabase
                    .from('products')
                    .select('*')
                    .eq('producer_id', userData.id)
                    .eq('visibility', 'public')
                    .order('created_at', { ascending: false });

                const productsArray = productsData || [];

                // Convertir license_settings (objeto) a array para el renderer (igual que en premium-profile-core.js)
                const systemDefaults = {
                    basic: { name: 'Basic Lease', price: 20, enabled: true, usage: { streams: '50000', sales: '2000', radio: 'No Permitido' }, files: { mp3: true, wav: false, stems: false }, publishing: 50, royalties: 50, is_favorite: false },
                    premium: { name: 'Premium Lease', price: 50, enabled: true, usage: { streams: '500000', sales: '5000', radio: '2 Estaciones' }, files: { mp3: true, wav: true, stems: false }, publishing: 50, royalties: 50, is_favorite: false },
                    trackout: { name: 'Trackout Lease', price: 100, enabled: true, usage: { streams: '1000000', sales: '10000', radio: 'ILIMITADO' }, files: { mp3: true, wav: true, stems: true }, publishing: 50, royalties: 50, is_favorite: false },
                    unlimited: { name: 'Unlimited License', price: 300, enabled: true, usage: { streams: 'UNLIMITED', sales: 'UNLIMITED', radio: 'ILIMITADO' }, files: { mp3: true, wav: true, stems: true }, publishing: 50, royalties: 50, is_favorite: false }
                };

                let licensesArray = [];
                const baseSettings = userData.license_settings || {};

                ['basic', 'premium', 'trackout', 'unlimited'].forEach((key, index) => {
                    let userLic = {};
                    if (key === 'trackout') {
                        userLic = baseSettings['offszn_unlimited'] || baseSettings['trackout'] || {};
                    } else if (key === 'unlimited') {
                        userLic = baseSettings['offszn_exclusive'] || baseSettings['unlimited'] || {};
                    } else {
                        userLic = baseSettings[`offszn_${key}`] || baseSettings[key] || {};
                    }
                    const sysLic = systemDefaults[key];
                    const enabled = (userLic.enabled !== undefined) ? (userLic.enabled !== false && userLic.enabled !== 'false' && userLic.enabled !== "") : true;

                    if (enabled) {
                        licensesArray.push({
                            id: key,
                            nombre: userLic.name || sysLic.name,
                            precio: userLic.price !== undefined ? userLic.price : sysLic.price,
                            isFeatured: (key === 'premium') || (index === 1),
                            publishing: userLic.publishing !== undefined ? userLic.publishing : sysLic.publishing,
                            royalties: userLic.royalties !== undefined ? userLic.royalties : sysLic.royalties,
                            files: {
                                mp3: true,
                                wav: userLic.files?.wav !== undefined ? !!userLic.files?.wav : sysLic.files.wav,
                                stems: userLic.files?.stems !== undefined ? !!userLic.files?.stems : sysLic.files.stems
                            },
                            is_favorite: !!userLic.is_favorite,
                            usage: {
                                streams: userLic.usage?.streams || userLic.streams || sysLic.usage.streams,
                                sales: userLic.usage?.sales || userLic.sales || sysLic.usage.sales,
                                radio: userLic.usage?.radio || userLic.radio || sysLic.usage.radio
                            }
                        });
                    }
                });

                // 3. Obtener el layout real guardado en store_configs
                const { data: configData, error: configError } = await window.supabase
                    .from('store_configs')
                    .select('config_json')
                    .eq('user_id', userData.id)
                    .maybeSingle();

                const defaultState = {
                    theme: {
                        primaryColor: '#ffffff',
                        backgroundColor: '#000000',
                        fontFamily: "'Plus Jakarta Sans', sans-serif"
                    },
                    sections: [
                        { id: 'nav_1', type: 'navbar', props: { logoText: userData.nickname, links: ['BEATS', 'SERVICIOS'], avatarUrl: userData.avatar_url } },
                        { id: 'hero_1', type: 'hero', props: { title: userData.nickname, subtitle: userData.bio || 'La mejor calidad de sonido.' } },
                        { id: 'products_1', type: 'products', props: { products: [] } },
                        { id: 'licenses_1', type: 'licenses', props: { licenses: [] } },
                        { id: 'services_1', type: 'services', props: { services: [] } },
                        { id: 'faq_1', type: 'faq', props: { email: userData.email || 'hola@offszn.lat' } },
                        { id: 'footer_1', type: 'footer', props: { showBranding: true } }
                    ]
                };

                let storeLayout = defaultState;
                if (!configError && configData && configData.config_json) {
                    storeLayout = configData.config_json;
                    console.log("Configuración real de la tienda cargada de la BD:", storeLayout);
                } else {
                    console.log("El usuario no tiene una tienda personalizada guardada, usando plantilla base.");
                }

                // Inyectar productos y licencias dinámicamente desde la base de datos a las secciones correspondientes
                storeLayout.sections = storeLayout.sections.map(sec => {
                    if (sec.type === 'products') {
                        return {
                            ...sec,
                            props: {
                                ...sec.props,
                                products: productsArray,
                                userNickname: userData.nickname
                            }
                        };
                    }
                    if (sec.type === 'licenses') {
                        return {
                            ...sec,
                            props: {
                                ...sec.props,
                                licenses: licensesArray
                            }
                        };
                    }
                    if (sec.type === 'services') {
                        return {
                            ...sec,
                            props: {
                                ...sec.props,
                                services: userData.socials?.custom_services || []
                            }
                        };
                    }
                    if (sec.type === 'faq') {
                        return {
                            ...sec,
                            props: {
                                ...sec.props,
                                email: userData.email || 'hola@offszn.lat'
                            }
                        };
                    }
                    if (sec.type === 'navbar') {
                        return {
                            ...sec,
                            props: {
                                logoText: userData.nickname,
                                avatarUrl: userData.avatar_url,
                                ...(sec.props || {})
                            }
                        };
                    }
                    if (sec.type === 'footer') {
                        return {
                            ...sec,
                            props: {
                                ...sec.props,
                                socials: userData.socials || {}
                            }
                        };
                    }
                    return sec;
                });

                // 4. Renderizar
                const rootEl = document.getElementById('storeRenderRoot');
                // Limpiar el loader de la pantalla para evitar que tome 100vh de espacio
                rootEl.innerHTML = '';
                
                const renderer = new RendererEngine(rootEl, storeLayout);
                
                // Actualizar el DOM
                renderer.render(storeLayout);

                // 5. Inicializar fondo de partículas del Hero
                if (typeof window.initParticles === 'function') {
                    setTimeout(() => {
                        window.initParticles();
                    }, 100);
                }

                // 6. Inicializar scroll del Navbar
                setTimeout(() => {
                    const nav = rootEl.querySelector('.prof-nav');
                    if (nav) {
                        window.addEventListener('scroll', () => {
                            nav.classList.toggle('scrolled', window.scrollY > 50);
                        });
                    }
                }, 150);

            } catch (error) {
                console.error("Error al cargar el perfil desplegado:", error);
                document.getElementById('storeRenderRoot').innerHTML = '<div style="padding: 100px; text-align: center; color: #fff;">Error al cargar el perfil</div>';
            }
        }

        // Definir toggleFaq globalmente para la interacción del acordeón de preguntas
        window.toggleFaq = function(btn) {
            const item = btn.parentElement;
            const isActive = item.classList.contains('active');
            document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('active'));
            if (!isActive) item.classList.add('active');
        };

        document.addEventListener('DOMContentLoaded', loadDeployedProfile);
    </script>
</body>
</html>
