    <main class="main-container">

        <!-- STEP 1: AUTHENTICATION -->
        <section class="section-card" id="authSection">
            <div class="section-header">
                <h3>1. Conexión</h3>
                <span class="status-badge pending" id="connectionStatus">No conectado</span>
            </div>

            <div id="authConnectView">
                <p class="section-desc">Conecta tu canal de YouTube para permitir la subida automática.</p>
                <button id="btnConnect" class="btn-youtube">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                    </svg>
                    Conectar Canal de YouTube
                </button>
            </div>

            <div id="authConnectedView" class="hidden auth-connected-container">
                <div class="channel-info">
                    <div class="channel-avatar"></div>
                    <div>
                        <strong id="channelName">Nombre del Canal</strong>
                        <p id="channelHandle">@handle</p>
                    </div>
                </div>
                <button id="btnDisconnect" class="btn-text">Desconectar</button>
            </div>
        </section>
        <label>Tags (separados por coma)</label>
        <textarea id="tagsInput" rows="3" placeholder="trap beat, free type beat, ..."></textarea>
        <div class="field-footer">
            <span>Máximo 500 caracteres</span>
        </div>
        </div>
        </section>

        <!-- SUBMIT -->
        <div class="action-bar">
            <button id="btnSubmit" class="btn-primary-lg">Subir a YouTube</button>
        </div>

    </main>

    <!-- TOAST -->
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="youtube.js"></script>
