  <script>
    // --- AUTH & INIT ---
    document.addEventListener('DOMContentLoaded', async () => {
      // Wait a tick for stored auth to init
      setTimeout(() => {
        loadAnalyticsData('30d');
      }, 500);
    });

    // --- CHART GLOBAL ---
    let revenueChartInstance = null;

    // --- FILTERS ---
    function setFilter(period) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${period}`).classList.add('active');
      loadAnalyticsData(period);
    }

    // --- DATA FETCHING (SUPABASE) ---
    async function loadAnalyticsData(period) {
      // 1. Loading UI
      showSkeletons();

      // 2. Auth Helper
      let userId = null;
      if (window.currentUser) {
        userId = window.currentUser.id;
      } else if (window.supabaseClient) {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (user) userId = user.id;
      }

      if (!userId) {
        console.error("No authenticated user found for analytics.");
        // Potentially could redirect or show error UI
        return;
      }

      // 3. Determine Date Range
      let startDate = null; // null means "all time"
      const end = new Date();

      if (period === '7d') {
        startDate = new Date();
        startDate.setDate(end.getDate() - 7);
      } else if (period === '30d') {
        startDate = new Date();
        startDate.setDate(end.getDate() - 30);
      }
      // else 'all', remain null

      try {
        // --- A) PAGE VIEWS ---
        let viewsQuery = window.supabaseClient
          .from('page_views')
          .select('viewed_at')
          .eq('user_id', userId);

        if (startDate) {
          viewsQuery = viewsQuery.gte('viewed_at', startDate.toISOString());
        }
        const { data: rawViews, error: viewsError } = await viewsQuery;
        if (viewsError) throw viewsError;

        // --- B) ORDERS (Revenue) ---
        let ordersQuery = window.supabaseClient
          .from('orders')
          .select('id, amount, created_at')
          .eq('producer_id', userId);

        if (startDate) {
          ordersQuery = ordersQuery.gte('created_at', startDate.toISOString());
        }
        const { data: rawOrders, error: ordersError } = await ordersQuery;
        if (ordersError) throw ordersError;

        // --- C) TOP PRODUCTS ---
        //    We need to relate orders to products. 'order_items' connects them. 
        //    To calculate popular products in *this specific period*, filtering logic is needed.
        //    Option 1: Fetch all order_items for these specific order IDs.

        let topProductsData = [];
        if (rawOrders && rawOrders.length > 0) {
          const orderIds = rawOrders.map(o => o.id);

          const { data: rawOrderItems, error: itemsError } = await window.supabaseClient
            .from('order_items')
            .select('product_id, price')
            .in('order_id', orderIds);

          if (!itemsError && rawOrderItems) {
            // Aggregate by product_id
            const productStats = {}; // { prodId: { count, revenue } }

            rawOrderItems.forEach(item => {
              if (!productStats[item.product_id]) productStats[item.product_id] = { count: 0, revenue: 0 };
              productStats[item.product_id].count++;
              productStats[item.product_id].revenue += (item.price || 0);
            });

            // Get top 5 IDs
            const sortedIds = Object.keys(productStats)
              .sort((a, b) => productStats[b].revenue - productStats[a].revenue) // Sort by revenue or count? User said "Mas vendidos" (sold), user also said "ganancias". Revenue is usually better key metric for sorting top.
              .slice(0, 5);

            // Fetch Product Details (Name, Image)
            if (sortedIds.length > 0) {
              const { data: productDetails } = await window.supabaseClient
                .from('products')
                .select('id, name, cover_url, image_url') // Fetch both possible columns
                .in('id', sortedIds);

              // Merge details
              topProductsData = sortedIds.map(id => {
                const details = productDetails?.find(p => p.id == id); // Loose equality
                const stats = productStats[id];
                return {
                  name: details?.name || 'Producto Eliminado',
                  sales: stats.count,
                  revenue: stats.revenue,
                  img: details?.cover_url || details?.image_url // Fallback handled in render
                };
              });
            }
          }
        }

        // --- D) PROCESS DATA FOR CHART ---
        const chartData = processChartData(rawViews || [], rawOrders || [], startDate, period);
        const totalViews = rawViews ? rawViews.length : 0;
        const totalOrders = rawOrders ? rawOrders.length : 0; // Or sum of counts?

        // --- 4. RENDER UI ---
        hideSkeletons();
        renderConversion(totalViews, totalOrders);
        renderChart(chartData.labels, chartData.views, chartData.sales);
        renderTopProducts(topProductsData);

      } catch (err) {
        console.error("Analytics Error:", err);
        // Fallback / Empty State could be shown here
        hideSkeletons(); // Ensure UI unblocks
      }
    }

    // --- HELPER: Process Date Buckets ---
    function processChartData(viewsList, ordersList, startDate, period) {
      // If startDate is null (all time), we need to find the earliest date in data to start array
      // OR simpler: just group unique existing dates. ChartJS handles sparse data well if formatted, 
      // but for a smooth Line/Area chart, '0' values for missing days are better.

      // 1. Define Date Map
      const dataMap = {};
      const dateLabels = [];

      // Generate Labels / Keys
      let current = startDate ? new Date(startDate) : new Date(); // If all time, start logic is tricky. 
      // For "All Time" simplification: 
      // we will rely on data-driven dates or just last 90 days if 'all time' is huge.

      if (!startDate) {
        // Find min date
        const vMin = viewsList.length > 0 ? new Date(viewsList[0].viewed_at) : new Date();
        const oMin = ordersList.length > 0 ? new Date(ordersList[ordersList.length - 1].created_at) : new Date(); // orders sorted desc? dashboard was.
        // Assuming unsorted data from simple select, let's just pick reasonable.
        // If "All Time" is selected, let's just show actual data points present, 
        // aggregating by day.

        // Strategy: Iterate all data, populate map, then sort keys.

        // Views
        viewsList.forEach(v => {
          const k = v.viewed_at.split('T')[0];
          if (!dataMap[k]) dataMap[k] = { v: 0, s: 0 };
          dataMap[k].v++;
        });

        // Orders
        ordersList.forEach(o => {
          const k = o.created_at.split('T')[0];
          if (!dataMap[k]) dataMap[k] = { v: 0, s: 0 };
          dataMap[k].s += (o.amount || 0);
        });

        // Sort keys
        const sortedKeys = Object.keys(dataMap).sort();

        // FALLBACK: If "All Time" has absolutely no data, show last 30 days of 0s
        if (sortedKeys.length === 0) {
          const fallbackDate = new Date();
          fallbackDate.setDate(fallbackDate.getDate() - 30);
          return processChartData([], [], fallbackDate, '30d');
        }

        return {
          labels: sortedKeys, // Format nicely in render
          views: sortedKeys.map(k => dataMap[k].v),
          sales: sortedKeys.map(k => dataMap[k].s)
        };

      } else {
        // Fixed Range (7d, 30d) - Fill zeros for missing days
        const now = new Date();
        // Reset current to startDate (without time)
        current = new Date(startDate);
        current.setHours(0, 0, 0, 0);

        while (current <= now) {
          const k = current.toISOString().split('T')[0];
          dateLabels.push(k);
          dataMap[k] = { v: 0, s: 0 };
          current.setDate(current.getDate() + 1);
        }

        viewsList.forEach(v => {
          const k = v.viewed_at.split('T')[0];
          if (dataMap[k]) dataMap[k].v++;
        });

        ordersList.forEach(o => {
          const k = o.created_at.split('T')[0];
          if (dataMap[k]) dataMap[k].s += (o.amount || 0);
        });

        return {
          labels: dateLabels,
          views: dateLabels.map(k => dataMap[k].v),
          sales: dateLabels.map(k => dataMap[k].s)
        };
      }
    }


    // --- UI ---
    function showSkeletons() {
      document.getElementById('chartSkeleton').style.display = 'block';
      document.getElementById('revenueChart').style.display = 'none';
      document.getElementById('conversionContent').innerHTML = `
                <div class="skeleton skeleton-text" style="width:80px; height:40px;"></div>
                <div class="skeleton skeleton-text" style="width:200px; height:20px; margin-top:10px;"></div>
            `;
      document.getElementById('topProductsList').innerHTML = `
            <div class="product-row" style="pointer-events:none;">
                <div class="skeleton" style="width:24px; height:24px; border-radius:6px; background:#1a1a1a; flex-shrink:0;"></div>
                <div class="skeleton" style="width:48px; height:48px; border-radius:8px; background:#1a1a1a; flex-shrink:0;"></div>
                <div style="flex:1; min-width:0;">
                    <div class="skeleton" style="width:60%; height:14px; margin-bottom:6px; border-radius:4px; background:#1a1a1a;"></div>
                    <div class="skeleton" style="width:40%; height:12px; border-radius:4px; background:#1a1a1a;"></div>
                </div>
                <div class="skeleton" style="width:60px; height:18px; border-radius:4px; background:#1a1a1a;"></div>
            </div>
            `.repeat(3);
    }

    function hideSkeletons() {
      document.getElementById('chartSkeleton').style.display = 'none';
      document.getElementById('revenueChart').style.display = 'block';
    }

    function renderConversion(views, orders) {
      const rate = views > 0 ? ((orders / views) * 100).toFixed(1) : 0;
      const html = `
                <div style="display:flex; align-items:flex-end; gap:12px;">
                    <div class="conversion-value">${rate}%</div>
                    <div style="display:flex; flex-direction:column; margin-bottom:8px;">
                        <span style="font-size:16px; font-weight:700; color:#fff;">${orders.toLocaleString()} ordenes</span>
                        <span style="font-size:12px; color:#888;">de ${views.toLocaleString()} visitas Ãºnicas</span>
                    </div>
                </div>
            `;
      document.getElementById('conversionContent').innerHTML = html;
    }

    function renderChart(labels, viewsData, salesData) {
      const ctx = document.getElementById('revenueChart').getContext('2d');
      if (revenueChartInstance) revenueChartInstance.destroy();

      // Nice formatting for labels
      const formattedLabels = labels.map(l => {
        const parts = l.split('-'); // YYYY-MM-DD
        return `${parts[2]}/${parts[1]}`; // DD/MM
      });

      // Gradients
      const gradientPurple = ctx.createLinearGradient(0, 0, 0, 400);
      gradientPurple.addColorStop(0, 'rgba(139, 92, 246, 0.5)');
      gradientPurple.addColorStop(1, 'rgba(139, 92, 246, 0.0)');

      const gradientGreen = ctx.createLinearGradient(0, 0, 0, 400);
      gradientGreen.addColorStop(0, 'rgba(16, 185, 129, 0.5)');
      gradientGreen.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

      revenueChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: formattedLabels,
          datasets: [
            {
              label: 'Visitas',
              data: viewsData,
              borderColor: '#8B5CF6',
              backgroundColor: gradientPurple,
              borderWidth: 2,
              tension: 0.4,
              fill: true,
              pointRadius: viewsData.some(v => v > 0) ? 3 : 0, // Only show points if there is data
              pointHoverRadius: 6,
              yAxisID: 'y'
            },
            {
              label: 'Ventas ($)',
              data: salesData,
              borderColor: '#10B981',
              backgroundColor: gradientGreen,
              borderWidth: 2,
              tension: 0.4,
              fill: true,
              pointRadius: salesData.some(s => s > 0) ? 3 : 0,
              pointHoverRadius: 6,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#111',
              titleColor: '#fff',
              bodyColor: '#ccc',
              borderColor: '#333',
              borderWidth: 1,
              padding: 12,
              displayColors: true,
              callbacks: {
                label: function (context) {
                  let label = context.dataset.label || '';
                  if (label) {
                    label += ': ';
                  }
                  if (context.parsed.y !== null) {
                    if (context.datasetIndex === 1) { // Sales
                      label += new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(context.parsed.y);
                    } else {
                      label += context.parsed.y;
                    }
                  }
                  return label;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false, drawBorder: false },
              ticks: { color: '#666', font: { size: 10 } }
            },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              min: 0, // FORCE 0 BASE
              suggestedMax: 10, // Avoid 0-1 single tick
              grid: { color: '#222', drawBorder: false },
              ticks: {
                color: '#666',
                precision: 0, // No decimals for views
                maxTicksLimit: 6
              }
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              min: 0, // FORCE 0 BASE
              suggestedMax: 100, // Reasonable default for money
              grid: { display: false },
              ticks: {
                color: '#10B981',
                callback: (val) => '$' + val,
                maxTicksLimit: 6
              }
            }
          }
        }
      });
    }

    function renderTopProducts(products) {
      if (!products || products.length === 0) {
        document.getElementById('topProductsList').innerHTML = `<p style="text-align:center; color:#666; padding:20px;">Sin datos de ventas en este periodo.</p>`;
        return;
      }

      const html = products.map((prod, index) => `
                <div class="product-row">
                    <div class="rank-badge rank-${index + 1}">${index + 1}</div>
                    <img src="${prod.img || '../images/PORTADA%20DEFAULT.png'}" class="product-thumb" alt="Cover" onerror="this.src='../images/PORTADA%20DEFAULT.png'">
                    <div class="product-info">
                        <div class="product-name" title="${prod.name}">${prod.name}</div>
                        <div class="product-sales">${prod.sales} ventas</div>
                    </div>
                    <div class="product-revenue">$${prod.revenue.toLocaleString()}</div>
                </div>
            `).join('');
      document.getElementById('topProductsList').innerHTML = html;
    }



  </script>
