    <script>
        // Use global client
        const supabaseClient = window.supabaseClient;

        // INIT
        let currentUser = null;
        // GLOBAL DATA State
        let allCouponsData = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            renderLoading(); // Show skeletons IMMEDIATELY before auth check

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            currentUser = user;
            loadCoupons();
            // Set default date to today
            document.getElementById('cValidFrom').valueAsDate = new Date();

            // Auto-clamp Amount (Max 1000 for fixed, 100 for percent) & Clear Errors
            const cAmount = document.getElementById('cAmount');
            cAmount.addEventListener('input', function () {
                clearErrors();
                // Sanitize leading zeros immediately
                if (this.value.length > 1 && this.value.startsWith('0') && !this.value.startsWith('0.')) {
                    this.value = parseFloat(this.value);
                }

                const type = document.getElementById('cType').value;
                const val = parseFloat(this.value);
                if (type === 'fixed' && val > 1000) {
                    this.value = 1000;
                } else if (type === 'percent' && val > 100) {
                    this.value = 100;
                }
            });
            cAmount.addEventListener('blur', function () {
                // Ensure sanitized value persists on blur
                if (this.value.length > 1 && this.value.startsWith('0') && !this.value.startsWith('0.')) {
                    this.value = parseFloat(this.value);
                }
            });

            // Enforce Min Purchase Max $1000
            document.getElementById('cMinPurchase').addEventListener('input', function () {
                clearErrors();
                // Sanitize leading zeros immediately
                if (this.value.length > 1 && this.value.startsWith('0') && !this.value.startsWith('0.')) {
                    this.value = parseFloat(this.value);
                }
                if (this.value > 1000) this.value = 1000;
            });

            // Enforce Limit Max 1000
            document.getElementById('cLimit').addEventListener('input', function () {
                clearErrors();
                // Sanitize leading zeros immediately
                if (this.value.length > 1 && this.value.startsWith('0') && !this.value.startsWith('0.')) {
                    this.value = parseFloat(this.value);
                }
                if (this.value > 1000) this.value = 1000;
            });

            document.getElementById('cCode').addEventListener('input', clearErrors);
            ['cValidFrom', 'cValidTo'].forEach(id => {
                document.getElementById(id).addEventListener('change', clearErrors);
            });
            document.getElementById('cMinPurchase').addEventListener('input', function () {
                clearErrors();
                if (this.value > 1000) this.value = 1000;
            });

            // Enforce Limit Max 1000
            document.getElementById('cLimit').addEventListener('input', function () {
                clearErrors();
                if (this.value > 1000) this.value = 1000;
            });

            document.getElementById('cCode').addEventListener('input', clearErrors);
            ['cValidFrom', 'cValidTo'].forEach(id => {
                document.getElementById(id).addEventListener('change', clearErrors);
            });

            // Global Click Listener for Search Dropdown
            document.addEventListener('click', (e) => {
                const searchContainer = document.querySelector('.search-container');
                const searchResults = document.getElementById('searchResults');
                if (searchContainer && !searchContainer.contains(e.target)) {
                    searchResults.style.display = 'none';
                }
            });
        });

        function toggleOption(id, show) {
            document.getElementById(id).style.display = show ? 'block' : 'none';
        }

        let editingCouponId = null; // State for Edit Mode

        function openModal() {
            // Reset State for Create Mode
            editingCouponId = null;
            document.querySelector('#modalCoupon h3').innerText = "Nuevo Cupón";
            document.querySelector('#modalCoupon button[onclick="saveCoupon()"]').innerText = "Crear Cupón";

            document.getElementById('cCode').value = '';
            document.getElementById('cAmount').value = '';
            document.getElementById('cType').value = 'percent';
            document.getElementById('cAppliesTo').value = 'product';

            // Reset Advanced Options
            ['chkStartDate', 'chkEndDate', 'chkLimit', 'chkMinPurchase'].forEach(id => {
                document.getElementById(id).checked = false;
                // Trigger change to hide wrappers
                document.getElementById(id).onchange({ target: document.getElementById(id) });
            });
            document.getElementById('cLimit').value = '';
            document.getElementById('cMinPurchase').value = '';
            // Reset dates
            document.getElementById('cValidFrom').valueAsDate = new Date();
            document.getElementById('cValidTo').value = '';

            // Reset Search & Products
            selectedProducts = [];
            document.getElementById('cProductSearch').value = '';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchResults').style.display = 'none';
            document.querySelector('.search-container').style.display = 'block';
            document.getElementById('couponPreview').style.display = 'none';
            renderSelectedProducts();
            toggleAppliesToInputs();
            updateAmountPlaceholder();

            clearErrors(); // Clear any red borders

            document.getElementById('modalCoupon').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalCoupon').classList.remove('active');
            editingCouponId = null; // Safety clear
        }

        function generateMagicCode() {
            clearErrors();
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // No I, O, 1, 0
            let code = '';
            for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('cCode').value = `OFFSZN-${code}`;
        }

        async function loadCoupons() {
            // Skeletons are already shown by DOMContentLoaded

            const { data, error } = await supabaseClient
                .from('coupons')
                .select('*')
                .eq('producer_id', currentUser.id)
                .order('created_at', { ascending: false });

            // Simulate slight delay for smooth transition (optional, can remove)
            setTimeout(() => {
                if (error) {
                    console.error("Error loading coupons:", error);
                    return;
                }
                allCouponsData = data || []; // Cache Logic

                // REVEAL PILL TEXT
                const pills = [
                    { id: 'text-all', text: 'Todos' },
                    { id: 'text-active', text: 'Activos' },
                    { id: 'text-scheduled', text: 'Programados' },
                    { id: 'text-expired', text: 'Caducados' }
                ];
                pills.forEach(p => {
                    const el = document.getElementById(p.id);
                    if (el) {
                        el.innerText = p.text;
                        el.classList.remove('skeleton-text');
                        el.style.width = 'auto';
                    }
                });

                // RESTORE STATE
                const savedFilter = localStorage.getItem('couponFilter') || 'all';
                // Find button to activate UI
                const btnId = 'btn-' + savedFilter;
                const btn = document.getElementById(btnId);

                filterCoupons(savedFilter, btn);
            }, 600);
        }

        function renderLoading() {
            const grid = document.getElementById('couponGrid');
            grid.innerHTML = '';
            // Generate 3 skeletons for grid
            for (let i = 0; i < 3; i++) {
                grid.innerHTML += `
                    <div class="coupon-card">
                        <div class="c-header">
                            <!-- Code Badge Skeleton -->
                            <div class="skeleton" style="width:100px; height:32px; border-radius:8px;"></div>
                            <!-- Status Badge Skeleton -->
                            <div class="skeleton" style="width:70px; height:24px; border-radius:4px;"></div>
                        </div>
                        <div class="c-info">
                            <!-- Discount Amount Skeleton -->
                            <div class="skeleton" style="width:120px; height:36px; margin-bottom:10px; border-radius:4px;"></div>
                            <!-- Date Info Skeleton -->
                            <div class="skeleton" style="width:100%; height:16px; margin-bottom:6px; border-radius:4px;"></div>
                            <!-- Meta Info Skeleton -->
                            <div class="skeleton" style="width:80%; height:16px; border-radius:4px;"></div>
                        </div>
                        <div class="c-footer">
                            <!-- Usage Stats Skeleton -->
                            <div class="skeleton" style="width:80px; height:16px; border-radius:4px;"></div>
                            <!-- Actions Skeleton -->
                            <div style="display:flex; gap:10px;">
                                <div class="skeleton" style="width:24px; height:24px; border-radius:4px;"></div>
                                <div class="skeleton" style="width:24px; height:24px; border-radius:4px;"></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // --- NEW FILTER LOGIC ---
        function filterCoupons(filterType, btnElement = null) {
            localStorage.setItem('couponFilter', filterType); // Save State
            currentFilter = filterType;

            // Visual Update Pills
            if (btnElement) {
                document.querySelectorAll('.filter-pill').forEach(el => el.classList.remove('active'));
                btnElement.classList.add('active');
            } else {
                // If called by script, find the right button
                const btns = document.querySelectorAll('.filter-pill');
                document.querySelectorAll('.filter-pill').forEach(el => el.classList.remove('active')); // Ensure reset
                if (filterType === 'all') document.getElementById('btn-all').classList.add('active');
                if (filterType === 'active') document.getElementById('btn-active').classList.add('active');
                if (filterType === 'scheduled') document.getElementById('btn-scheduled').classList.add('active');
                if (filterType === 'expired') document.getElementById('btn-expired').classList.add('active');
            }

            const now = new Date();
            let filtered = [];

            if (filterType === 'all') {
                filtered = allCouponsData;
            } else if (filterType === 'active') {
                filtered = allCouponsData.filter(c => {
                    const start = c.valid_from ? new Date(c.valid_from) : new Date(0);
                    const end = c.valid_to ? new Date(c.valid_to) : null;
                    return (start <= now) && (!end || end > now);
                });
            } else if (filterType === 'scheduled') {
                filtered = allCouponsData.filter(c => {
                    const start = c.valid_from ? new Date(c.valid_from) : new Date(0);
                    return start > now;
                });
            } else if (filterType === 'expired') {
                filtered = allCouponsData.filter(c => {
                    const end = c.valid_to ? new Date(c.valid_to) : null;
                    return end && now > end;
                });
            }

            renderCoupons(filtered);

            // Update Count
            const countLabel = document.getElementById('filterCount');
            if (countLabel) {
                countLabel.innerText = filtered.length === 1 ? '1 cupón' : `${filtered.length} cupones`;
            }
        }

        function renderCoupons(coupons) {
            const grid = document.getElementById('couponGrid');
            grid.innerHTML = '';

            // Re-render Skeletons if loading? No, this is instant.

            if (coupons.length === 0) {
                grid.innerHTML = '<p style="color:#666;">No tienes cupones creados.</p>';
                return;
            }

            coupons.forEach(c => {
                // Status Logic
                const now = new Date();
                const start = c.valid_from ? new Date(c.valid_from) : new Date(0); // If valid_from null, assume past
                const end = c.valid_to ? new Date(c.valid_to) : null;

                let statusText = 'Activo';
                let statusClass = 'active';

                if (start > now) {
                    statusText = 'Programado';
                    statusClass = 'pending'; // You might need to add this class css or use inline style
                } else if (end && now > end) {
                    statusText = 'Expirado';
                    statusClass = 'expired'; // Assuming you have or will default to gray
                }

                const typeIcon = c.discount_percent ? '%' : '$';
                const val = c.discount_percent || c.discount_amount;
                const minPurchase = c.min_purchase_amount > 0 ? `$${c.min_purchase_amount}` : 'Sin mín.';

                // Date Formatting
                const formatDate = (d) => {
                    if (!d) return '∞';
                    return new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
                };
                const dateRange = `${formatDate(c.valid_from)} - ${c.valid_to ? formatDate(c.valid_to) : 'Siempre'}`;

                // Truncate logic in HTML
                grid.innerHTML += `
                    <div class="coupon-card">
                        <div class="c-header">
                            <div class="c-code" title="${c.code}">${c.code}</div>
                            <div class="c-status ${statusClass}" style="${statusClass === 'pending' ? 'color:#facc15; border-color:#facc15;' : ''}">${statusText}</div>
                        </div>
                        <div class="c-info">
                            <div class="c-discount">${typeIcon}${val} OFF</div>
                             <div style="font-size:12px; color:#666; margin-bottom:8px; display:flex; align-items:center; gap:6px;">
                                <i class="bi bi-calendar-event"></i> ${dateRange}
                            </div>
                            <div class="c-meta">
                                <span><i class="bi bi-cart"></i> Mín: ${minPurchase}</span>
                                <span><i class="bi bi-arrow-repeat"></i> ${c.is_single_use ? '1/cliente' : 'Multiuso'}</span>
                            </div>
                        </div>
                        <div class="c-footer">
                            <div class="c-uses">
                                <i class="bi bi-people-fill"></i> ${c.times_used || 0} / ${c.uses_limit || '∞'}
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button class="btn-icon" onclick="editCoupon(${c.id})" title="Editar"><i class="bi bi-pencil-fill"></i></button>
                                <button class="btn-icon" onclick="deleteCoupon(${c.id})" title="Eliminar"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function updateStats(coupons) {
            const active = coupons.filter(c => (!c.valid_to || new Date(c.valid_to) > new Date())).length;
            const redeemed = coupons.reduce((acc, curr) => acc + (curr.times_used || 0), 0);
            // Mock value for now
            const generated = '$0';

            // Rebuild Stats HTML
            const statsBar = document.querySelector('.stats-bar');
            statsBar.innerHTML = `
                <div class="stat-card">
                    <h4>Activos</h4>
                    <div class="value" id="activeCount">${active}</div>
                </div>
                <div class="stat-card">
                    <h4>Redimidos</h4>
                    <div class="value" id="redeemedCount">${redeemed}</div>
                </div>
                <div class="stat-card">
                    <h4>Valor Generado</h4>
                    <div class="value" id="generatedValue">${generated}</div>
                </div>
             `;
        }

        // STATE
        let selectedProducts = [];
        let allProductsCache = [];

        // UX HELPERS
        function updateAmountPlaceholder() {
            const type = document.getElementById('cType').value;
            const input = document.getElementById('cAmount');
            const symbol = document.getElementById('amountSymbol');

            if (type === 'percent') {
                input.placeholder = "20";
                symbol.innerText = "%";
                if (parseFloat(input.value) > 100) input.value = 100;
            } else {
                input.placeholder = "10.00";
                symbol.innerText = "$";
            }
            updateSavingsPreview();
        }

        function updateSavingsPreview() {
            const type = document.getElementById('cType').value;
            const amount = parseFloat(document.getElementById('cAmount').value) || 0;
            const preview = document.getElementById('savingsPreview');

            if (type === 'percent' && amount > 100) {
                document.getElementById('cAmount').value = 100;
                preview.innerText = "Máximo 100%";
                return;
            }

            if (amount <= 0) {
                preview.innerText = "";
                return;
            }

            if (type === 'percent') {
                const saving = (100 * (amount / 100)).toFixed(2);
                preview.innerText = `Este cupón descontará $${saving} de una venta de $100.00`;
            } else {
                preview.innerText = `Este cupón descontará $${amount.toFixed(2)} del total de la venta (El total nunca será menor a $0.00)`;
            }
        }

        function toggleFree() {
            const btn = document.getElementById('btnFree');
            const type = document.getElementById('cType');
            const amount = document.getElementById('cAmount');

            if (btn.classList.contains('checked')) {
                // Untoggle
                btn.classList.remove('checked');
                amount.value = '';
                amount.disabled = false;
                type.disabled = false;
                updateSavingsPreview();
            } else {
                // Toggle ON
                btn.classList.add('checked');
                type.value = 'percent';
                amount.value = 100;
                amount.disabled = true;
                type.disabled = true;
                updateAmountPlaceholder();
                updateSavingsPreview();
            }
        }

        function toggleAppliesToInputs() {
            const appliesTo = document.getElementById('cAppliesTo').value;
            const catUI = document.getElementById('categoryUI');
            const prodUI = document.getElementById('productUI');

            catUI.style.display = 'none';
            prodUI.style.display = 'none';

            if (appliesTo === 'category') {
                catUI.style.display = 'block';
            } else if (appliesTo === 'product') {
                prodUI.style.display = 'block';
                if (selectedProducts.length === 0) document.getElementById('cProductSearch').focus();
            }
        }

        function updateCouponPreview() {
            if (selectedProducts.length === 0) return;

            const p = selectedProducts[0];
            const type = document.getElementById('cType').value;
            const amount = parseFloat(document.getElementById('cAmount').value) || 0;

            const price = parseFloat(p.price_basic) || 0;
            let discountVal = 0;

            if (type === 'percent') {
                discountVal = price * (amount / 100);
            } else {
                discountVal = amount;
            }

            // Ensure no negative total
            if (discountVal > price) discountVal = price;

            const total = price - discountVal;

            // Update UI
            document.getElementById('prevName').innerText = p.name;
            document.getElementById('prevPrice').innerText = `$${price.toFixed(2)}`;
            document.getElementById('prevDiscount').innerText = `-$${discountVal.toFixed(2)}`;
            document.getElementById('prevTotal').innerText = `$${Math.max(0, total).toFixed(2)}`;

            let img = p.image_url || '/images/portada-default.png';
            if (img.includes('/object/')) {
                img = img.replace('/object/', '/render/image/') + '?width=100&quality=80&resize=contain';
            }
            document.getElementById('prevImg').src = img;
            document.getElementById('prevImg').onerror = function () {
                this.onerror = null;
                this.src = '/images/portada-default.png';
            };
        }

        // --- SEARCH LOGIC ---
        // Helper to block invalid chars for integers
        function preventInvalidChars(e) {
            // Block 'e', 'E', '+', '-', '.', ','
            if (['e', 'E', '+', '-', '.', ','].includes(e.key)) {
                e.preventDefault();
                return false;
            }
            return true;
        }

        // Helper to clean input (paste protection)
        function enforceInteger(el) {
            el.value = el.value.replace(/[^0-9]/g, '');
            // Also ensure strictly positive logic if needed, but regex handles non-digits
        }

        let searchTimeout;
        async function searchProducts(query) {
            const resultsDiv = document.getElementById('searchResults');

            // If query is empty -> Show Recent Products (Top 3)
            if (!query) {
                // Modified: Only hide if we are explicitly entering single-product selection mode via CLICK, not just having state
                // Actually, if query is empty we SHOULD show recents to allow changing selection

                // Fetch recent
                if (!currentUser) return;

                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '<div style="padding:10px; color:#666; font-size:12px;">Recientes...</div>';

                const { data, error } = await supabaseClient
                    .from('products')
                    .select('id, name, price_basic, image_url, status, visibility')
                    .eq('producer_id', currentUser.id)
                    .eq('status', 'approved')
                    .in('visibility', ['public', 'unlisted'])
                    .order('created_at', { ascending: false })
                    .limit(3);

                if (error || !data || data.length === 0) {
                    resultsDiv.style.display = 'none';
                    return;
                }

                resultsDiv.innerHTML = '';
                renderSearchResults(data, resultsDiv);
                return;
            }

            // Normal Search
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '<div style="padding:10px; color:#666;">Buscando...</div>';

                if (!currentUser) return;

                // Final Fix: Use correct columns from schema (name, price_basic, image_url, status)
                // AND FILTER BY producer_id to only show MY products
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('id, name, price_basic, image_url, status, visibility')
                    .eq('producer_id', currentUser.id)
                    .ilike('name', `%${query}%`)
                    .eq('status', 'approved')
                    .in('visibility', ['public', 'unlisted'])
                    .order('name', { ascending: true })
                    .limit(5);

                if (error) {
                    console.error(error);
                    resultsDiv.innerHTML = '<div style="padding:10px; color:red;">Error al buscar</div>';
                    return;
                }

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<div style="padding:10px; color:#666;">No se encontraron productos</div>';
                    return;
                }

                resultsDiv.innerHTML = '';
                renderSearchResults(data, resultsDiv);
            }, 300);
        }

        function renderSearchResults(data, container) {
            data.forEach(p => {
                const imgUrl = p.image_url || '/images/portada-default.png';

                const price = p.price_basic || 0;

                const el = document.createElement('div');
                el.className = 'product-item';
                el.onclick = () => selectProduct(p);
                el.innerHTML = `
                         <div style="width:32px; height:32px; background:#333; border-radius:4px; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                            <img src="${imgUrl}" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null; this.src='/images/portada-default.png'">
                         </div>
                         <div>
                             <div style="font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px;">${escapeHtml(p.name)}</div>
                             <div style="font-size:11px; color:#888;">Precio: $${price}</div>
                         </div>
                    `;
                container.appendChild(el);
            });
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function selectProduct(product) {
            // Enforce Single Product Logic: Replace array with just this one
            selectedProducts = [product];
            renderSelectedProducts();

            // UX: Lock Search & Show Preview
            document.getElementById('cProductSearch').value = '';
            document.querySelector('.search-container').style.display = 'none'; // Hide search
            document.getElementById('productUILabel').style.display = 'none'; // Hide label

            updateCouponPreview(); // Calculate logic
            document.getElementById('couponPreview').style.display = 'block'; // Show preview
            document.getElementById('searchResults').style.display = 'none'; // Ensure dropdown closed
        }

        function removeProduct(id) {
            selectedProducts = []; // Since it's single mode, clear all
            renderSelectedProducts();

            // UX: Unlock Search & Hide Preview
            document.querySelector('.search-container').style.display = 'block';
            document.getElementById('productUILabel').style.display = 'block'; // Show label
            document.getElementById('couponPreview').style.display = 'none';
            document.getElementById('cProductSearch').focus();
        }

        function renderSelectedProducts() {
            const container = document.getElementById('selectedProductsList');
            container.innerHTML = '';

            selectedProducts.forEach(p => {
                const el = document.createElement('div');
                el.className = 'selected-chip';
                // Minimalist Chip: Just Name + X (No Image, No Price)
                el.innerHTML = `
                    <span style="font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; display:block;">${escapeHtml(p.name)}</span>
                    <button onclick="removeProduct(${p.id})" style="background:none; border:none; color:#ff4444; font-size:16px; cursor:pointer; display:flex; align-items:center; flex-shrink:0;"><i class="bi bi-x-circle-fill"></i></button>
                `;
                container.appendChild(el);
            });

            if (selectedProducts.length > 0) {
                document.getElementById('cProductSearch').value = '';
            }
        }

        // Helper for Errors
        function showError(id, msg) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('error');
                // Inline error text
                let errorDiv = el.parentNode.querySelector('.form-error-text');
                if (!errorDiv) {
                    errorDiv = document.createElement('div');
                    errorDiv.className = 'form-error-text';
                    el.parentNode.appendChild(errorDiv);
                }
                errorDiv.innerText = msg;
            }
        }
        function clearErrors() {
            document.querySelectorAll('.elite-input.error').forEach(el => el.classList.remove('error'));
            document.querySelectorAll('.form-error-text').forEach(el => el.remove());
        }

        async function saveCoupon() {
            if (!currentUser) return;
            clearErrors();

            const code = document.getElementById('cCode').value.toUpperCase();
            let type = document.getElementById('cType').value;
            let amount = parseFloat(document.getElementById('cAmount').value);

            // Dates Logic (Checkbox Dependent)
            const useStartDate = document.getElementById('chkStartDate').checked;
            const useEndDate = document.getElementById('chkEndDate').checked;

            const validFromInput = document.getElementById('cValidFrom').value;
            const validToInput = document.getElementById('cValidTo').value;

            // Helper to get Local ISO String (Start of Day)
            const getLocalISO = (dateStr) => {
                if (!dateStr) return null;
                // Create date using split to force Local Timezone (Hours 00:00:00)
                const [y, m, d] = dateStr.split('-').map(Number);
                const localDate = new Date(y, m - 1, d); // Months are 0-indexed
                return localDate.toISOString();
            };

            // If checkbox checked, use input. Else default: Start=Now, End=Null
            // Fixed: Now uses getLocalISO to ensure it matches USER'S clock 00:00
            const valid_from = useStartDate && validFromInput ? getLocalISO(validFromInput) : new Date().toISOString();
            const valid_to = useEndDate && validToInput ? getLocalISO(validToInput) : null;

            const appliesTo = document.getElementById('cAppliesTo').value;

            if (!code) {
                showError('cCode', "Por favor genera o escribe un código.");
                return;
            }
            if (!amount || amount <= 0) {
                showError('cAmount', "Por favor ingresa un valor válido para el descuento.");
                return;
            }
            if (type === 'percent' && amount > 100) {
                showError('cAmount', "El porcentaje no puede ser mayor al 100%.");
                return;
            }
            if (type === 'fixed') {
                if (amount < 1 || amount > 1000) {
                    showError('cAmount', "El monto fijo debe ser entre $1 y $1000.");
                    return;
                }
            }

            // Advanced Options Logic (Checkboxes)
            const useGlobalLimit = document.getElementById('chkLimit').checked;
            const globalLimitVal = document.getElementById('cLimit').value;
            const uses_limit = (useGlobalLimit && globalLimitVal) ? parseInt(globalLimitVal) : null;

            const useMinPurchase = document.getElementById('chkMinPurchase').checked;
            const minPurchaseVal = document.getElementById('cMinPurchase').value;
            const min_purchase_amount = (useMinPurchase && minPurchaseVal) ? parseFloat(minPurchaseVal) : 0;

            // Validations
            if (useMinPurchase) {
                if (min_purchase_amount < 1 || min_purchase_amount > 1000) {
                    showError('cMinPurchase', "El monto mínimo debe ser entre $1 y $1000 USD.");
                    return;
                }
            }

            if (useGlobalLimit) {
                if (uses_limit < 1 || uses_limit > 1000) {
                    showError('cLimit', "El límite de usos debe ser entre 1 y 1000.");
                    return;
                }
            }

            if (useStartDate && useEndDate && validFromInput && validToInput) {
                if (new Date(valid_to) <= new Date(valid_from)) {
                    showError('cValidTo', "La fecha de expiración debe ser posterior a la fecha de inicio.");
                    return;
                }
            }

            // Local Date Validation (Strict)
            // If setting a start date, it cannot be in the past (yesterday)
            if (useStartDate && validFromInput) {
                const selectedDate = new Date(validFromInput); // Local string "YYYY-MM-DD" parses to UTC 00:00 usually, but let's compare Date objects
                // Create TODAY at 00:00:00 Local
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                // Fix: Parse input manually to unnecessary timezone shifts
                const [y, m, d] = validFromInput.split('-').map(Number);
                const localSelected = new Date(y, m - 1, d);

                if (localSelected < today) {
                    showError('cValidFrom', "La fecha de inicio no puede ser en el pasado.");
                    return;
                }
            }

            if (amount < 0 || min_purchase_amount < 0) {
                showError('cAmount', "Los valores no pueden ser negativos.");
                return;
            }

            // Logic for Applies To IDs
            let appliesToId = null;
            if (appliesTo === 'category') {
                appliesToId = document.getElementById('cCategorySelect').value;
            } else if (appliesTo === 'product') {
                if (selectedProducts.length === 0) {
                    showError('cProductSearch', "Por favor selecciona un producto.");
                    return;
                }
                // Strict check matching search logic
                const validSelectedProducts = selectedProducts.filter(p =>
                    p.status === 'approved' && ['public', 'unlisted'].includes(p.visibility)
                );

                if (validSelectedProducts.length === 0) {
                    showError('cProductSearch', "El producto seleccionado no es válido (Debe estar Aprobado y ser Público/No Listado).");
                    return;
                }
                appliesToId = validSelectedProducts.map(p => p.id).join(',');
            }

            const payload = {
                code,
                // discount_type: type, // Removed: Column does not exist in DB
                discount_amount: type === 'fixed' ? amount : null,
                discount_percent: type === 'percent' ? amount : null,
                valid_from: valid_from,
                valid_to: valid_to,
                uses_limit: uses_limit,
                // times_used: 0, // Removed: Schema mismatch, column does not exist
                min_purchase_amount: min_purchase_amount,
                applies_to: appliesTo,
                applies_to_id: appliesToId,
                is_single_use: false,
                producer_id: currentUser.id
            };

            let error;
            if (editingCouponId) {
                // UPDATE
                const { error: updateError } = await supabaseClient
                    .from('coupons')
                    .update(payload)
                    .eq('id', editingCouponId);
                error = updateError;
            } else {
                // INSERT
                const { error: insertError } = await supabaseClient.from('coupons').insert([payload]);
                error = insertError;
            }

            if (error) {
                console.error(error);
                showToast("Error al " + (editingCouponId ? "actualizar" : "crear") + " el cupón: " + error.message, true);
            } else {
                closeModal();
                loadCoupons();
                showToast(editingCouponId ? "Cupón actualizado!" : "Cupón creado exitosamente!");
            }
        }

        // Custom Toast Notification (Standardized)
        function showToast(message, isError = false) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `elite-toast ${isError ? 'error' : 'success'}`;
            const icon = isError ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill';
            toast.innerHTML = `<i class="bi ${icon}"></i> <span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastSlideUp 0.3s reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function editCoupon(id) {
            const c = allCouponsData.find(x => x.id === id);
            if (!c) return;

            editingCouponId = id;
            document.querySelector('#modalCoupon h3').innerText = "Editar Cupón";
            document.querySelector('#modalCoupon button[onclick="saveCoupon()"]').innerText = "Guardar Cambios";

            // Prefill Inputs
            document.getElementById('cCode').value = c.code;

            // Determine Type & Amount
            if (c.discount_percent) {
                document.getElementById('cType').value = 'percent';
                document.getElementById('cAmount').value = c.discount_percent;
            } else {
                document.getElementById('cType').value = 'fixed';
                document.getElementById('cAmount').value = c.discount_amount;
            }
            updateAmountPlaceholder();
            updateSavingsPreview();

            // Applies To
            const appliesTo = c.applies_to || 'product'; // default
            document.getElementById('cAppliesTo').value = appliesTo;
            toggleAppliesToInputs();

            if (appliesTo === 'category') {
                document.getElementById('cCategorySelect').value = c.applies_to_id || 'Beats';
            } else if (appliesTo === 'product') {
                // Reset Selection
                selectedProducts = [];
                // If ID exists, try to fetch info to show chip
                if (c.applies_to_id) {
                    // Try to fetch product details for chip
                    const { data: prod } = await supabaseClient.from('products').select('*').eq('id', c.applies_to_id).single();
                    if (prod) {
                        selectedProducts = [prod];
                        renderSelectedProducts();
                        updateCouponPreview();
                        document.getElementById('couponPreview').style.display = 'block';
                        document.getElementById('productUILabel').style.display = 'none';
                        document.querySelector('.search-container').style.display = 'none';
                    }
                }
            }

            // Advanced Options
            // Dates
            if (c.valid_from) {
                document.getElementById('chkStartDate').checked = true;
                toggleOption('wrapperStartDate', true);
                // Extract date part only (YYYY-MM-DD)
                document.getElementById('cValidFrom').value = c.valid_from.split('T')[0];
            } else {
                document.getElementById('chkStartDate').checked = false;
                toggleOption('wrapperStartDate', false);
            }

            if (c.valid_to) {
                document.getElementById('chkEndDate').checked = true;
                toggleOption('wrapperEndDate', true);
                document.getElementById('cValidTo').value = c.valid_to.split('T')[0];
            } else {
                document.getElementById('chkEndDate').checked = false;
                toggleOption('wrapperEndDate', false);
            }

            // Limit
            if (c.uses_limit) {
                document.getElementById('chkLimit').checked = true;
                toggleOption('wrapperLimit', true);
                document.getElementById('cLimit').value = c.uses_limit;
            } else {
                document.getElementById('chkLimit').checked = false;
                toggleOption('wrapperLimit', false);
            }

            // Min Purchase
            if (c.min_purchase_amount > 0) {
                document.getElementById('chkMinPurchase').checked = true;
                toggleOption('wrapperMinPurchase', true);
                document.getElementById('cMinPurchase').value = c.min_purchase_amount;
            } else {
                document.getElementById('chkMinPurchase').checked = false;
                toggleOption('wrapperMinPurchase', false);
            }

            document.getElementById('modalCoupon').classList.add('active');
        }

        async function deleteCoupon(id) {
            if (!confirm("Eliminar este cupón?")) return;

            const { error } = await supabaseClient.from('coupons').delete().eq('id', id);
            if (error) alert("Error deleting");
            else loadCoupons();
        }

    </script>
