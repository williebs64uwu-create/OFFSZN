<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suscripción Especial - OFFSZN</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/script/auth-utils.js?v=11"></script>
    <script src="../script/auth-guard.js"></script>

    <style>
        :root {
            --bg-left: #0A0A0A;
            --bg-right: #000000;
            --border-color: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #888888;
            --accent-purple: #8B5CF6;
            --accent-gold: #FFD700;
            --success: #10B981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-right);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .product-label {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .price-amount {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .price-currency {
            font-size: 24px;
            color: var(--text-secondary);
        }

        .trial-info {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-purple);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .btn-activate {
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-activate:hover {
            transform: scale(1.02);
            background: #f0f0f0;
        }

        .btn-activate:disabled {
            background: #333;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #messageBox {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
        }

        #messageBox.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        #messageBox.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>
    <div class="promo-container">
        <p class="product-label">Promoción Especial Exclusiva</p>
        <div class="price-container">
            <span class="price-amount" style="text-decoration: line-through; color: #555; font-size: 32px;">$7.00</span>
            <span class="price-amount" style="color: var(--success);">$0.00</span>
        </div>
        <div class="trial-info">
            <i class="bi bi-stars"></i>
            <span>1 Mes de OFFSZN PRO Gratis</span>
        </div>

        <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; line-height: 1.6;">
            Como invitado especial, tienes acceso a todos los beneficios del plan <b>PRO</b> (Subidas Ilimitadas, 0% Comisión, Soporte VIP y más) completamente gratis durante 1 mes. Luego se te cobrará $7.00/mes. Cancela cuando quieras.
        </p>

        <button class="btn-activate" id="btnActivate" onclick="activatePromo()">Activar mi mes gratis</button>
        <div id="messageBox"></div>
    </div>

    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000'
            : window.location.origin;

        async function activatePromo() {
            const btn = document.getElementById('btnActivate');
            const msgBox = document.getElementById('messageBox');
            
            btn.disabled = true;
            btn.textContent = 'Activando...';
            msgBox.style.display = 'none';
            msgBox.className = '';

            try {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (!session) {
                    throw new Error('No estás autenticado.');
                }

                const res = await fetch(`${API_URL}/api/subscriptions/promo/jareem`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`
                    }
                });
                
                const data = await res.json();

                if (res.ok) {
                    msgBox.textContent = '¡Promo activada! Redirigiendo...';
                    msgBox.className = 'success';
                    msgBox.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/cuenta/planes.html?upgrade=success&plan=PRO';
                    }, 1500);
                } else {
                    msgBox.textContent = data.error || 'Ocurrió un error.';
                    msgBox.className = 'error';
                    msgBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Activar mi mes gratis';
                }
            } catch (err) {
                console.error(err);
                msgBox.textContent = err.message || 'Error de conexión.';
                msgBox.className = 'error';
                msgBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Activar mi mes gratis';
            }
        }
    </script>
</body>
</html>
