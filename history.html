<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Búsquedas - OFFSZN</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth-ui.css">
    <link rel="stylesheet" href="/css/global-overlays.css">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- 1. Cargar Supabase (Head for Global Access) -->
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"
        integrity="sha384-o2Uz8M8jf3RRbNF9dFLYtjA2ohqUgp6vUxr43Uzvt8MJkkLNvpXvLCUVbWh+cadK"
        crossorigin="anonymous"></script>
    <script>
        window.supabaseClient = null;

        // Ensure initialization after environment variables load
        window.addEventListener('load', () => {
            if (window.AuthUtils) {
                // Ensure SUPABASE_URL is populated from ENV if env.js didn't set it directly
                window.SUPABASE_URL = window.SUPABASE_URL || window.ENV?.SUPABASE_URL || "";
                window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || window.ENV?.SUPABASE_ANON_KEY || "";
                window.AuthUtils.initSupabase();
            }
        });

        // XSS Helper
        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }
    </script>
    <script src="/script/auth-utils.js?v=11"></script>
    <script src="/script/id-obfuscator.js?v=11"></script>
    <script src="/script/notifications.js"></script>
    <!-- EmailJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        (function () {
            if (typeof emailjs !== 'undefined' && window.EMAILJS_PUBLIC_KEY) {
                emailjs.init(window.EMAILJS_PUBLIC_KEY);
            }
        })();
    </script>
</head>

<body>



    <!-- ==================== EXTRACTED NAVBAR ==================== -->
    <!-- ==================== DYNAMIC NAVBAR ==================== -->

    <main style="padding: 85px 20px 80px; max-width: 1200px; margin: 0 auto; min-height: 100vh;">

        <div id="history-items-container" style="display: grid; gap: 12px;">

                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 12px;"></div>

    <!-- CSS Addition for History Page -->
    <style>
        .history-card {
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .history-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .history-card.disabled {
            cursor: default;
            opacity: 0.5;
            filter: grayscale(1);
        }

        .history-card.disabled:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .history-info {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff;
            flex: 1;
        }

        .history-info span {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-info .history-meta {
            font-size: 0.75rem;
            color: #888;
            font-weight: 400;
        }

        .history-card.disabled .history-info span,
        .history-card.disabled .history-info .history-meta {
            color: #666;
        }

        .history-card.disabled .history-info span::after {
            content: "(No disponible)";
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 8px;
            font-weight: 400;
        }

        .mark-read-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .mark-read-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: translateY(-1px);
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff;
            font-weight: 500;
        }

        .history-info i {
            color: #666;
            font-size: 1.2rem;
        }

        .history-actions {
            display: flex;
            gap: 12px;
        }

        .btn-delete-item {
            color: #444;
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
        }

        .btn-delete-item:hover {
            color: #ef4444;
        }

        .skeleton {
            background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }

        #clear-all-btn:hover {

        /* CUSTOM CONFIRM MODAL - Premium Redesign */
        .confirm-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .confirm-modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .confirm-modal-box {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 28px;
            width: 90%;

        .modal-btn {

        }

        .modal-btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .modal-btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .modal-btn-confirm {
            background: #ef4444;
            border: none;
            color: #fff;
        }

        .modal-btn-confirm:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);

    </style>

    <!-- CUSTOM CONFIRM MODAL -->
    <div id="clear-history-modal" class="confirm-modal-overlay">
        <div class="confirm-modal-box">
            <div class="modal-icon-circle">
                <i class="bi bi-trash3"></i>
            </div>
            <h3
                style="color: #fff; margin-bottom: 12px; font-weight: 700; font-size: 1.5rem; font-family: 'Plus Jakarta Sans', sans-serif;">
                ¿Borrar historial?</h3>
            <p style="color: #888; font-size: 1rem; line-height: 1.6; font-family: 'Inter', sans-serif;">Esto eliminará
                permanentemente todas tus búsquedas guardadas. Esta acción no se puede deshacer.</p>
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-cancel" onclick="closeClearModal()">Cancelar</button>
                <button class="modal-btn modal-btn-confirm" onclick="executeClearAll()">Borrar Todo</button>
            </div>
        </div>

    <script>
        let currentHistory = [];

        function renderSearchSkeletons() {
            const container = document.getElementById('history-items-container');
            let html = '';
            for (let i = 0; i < 15; i++) {
                html += `
                <div class="history-card skeleton-pulse" style="pointer-events:none; opacity:0.5; margin-bottom:8px;">
                    <div class="history-info">
                        <div style="width:20px; height:20px; background:rgba(255,255,255,0.05); border-radius:50%; margin-right:12px;"></div>
                        <div style="width:150px; height:12px; background:rgba(255,255,255,0.05); border-radius:4px;"></div>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }


        async function resolveHistoryItems(history) {
            if (!window.supabaseClient) return history;

            const textItems = history.filter(item => {
                const historyObj = typeof item === 'string' ? { type: 'text', term: item } : item;
                return historyObj.type === 'text' || !historyObj.type;
            });

            if (textItems.length === 0) return history.map(item => typeof item === 'string' ? { type: 'text', term: item } : item);

            const terms = [...new Set(textItems.map(item => {
                const historyObj = typeof item === 'string' ? { type: 'text', term: item } : item;
                return historyObj.term.trim();
            }))];

            try {
                // Batch query users
                const { data: users } = await window.supabaseClient
                    .from('users')
                    .select('nickname, avatar_url')
                    .in('nickname', terms);

                // Batch query products (by name and slug)
                const { data: productsByName } = await window.supabaseClient
                    .from('products')
                    .select('id, name, public_slug, image_url, product_type, producer_id')
                    .in('name', terms)
                    .eq('visibility', 'public');

                const { data: productsBySlug } = await window.supabaseClient
                    .from('products')
                    .select('id, name, public_slug, image_url, product_type, producer_id')
                    .in('public_slug', terms)
                    .eq('visibility', 'public');

                const allProducts = [...(productsByName || []), ...(productsBySlug || [])];

                return history.map(item => {
                    const historyObj = typeof item === 'string' ? { type: 'text', term: item } : item;
                    if (historyObj.type && historyObj.type !== 'text') return historyObj;

                    const term = historyObj.term.toLowerCase().trim();

                    const userMatch = users?.find(u => u.nickname.toLowerCase().trim() === term);
                    if (userMatch) {
                        return { type: 'user', term: userMatch.nickname, subtitle: 'Producer', img: userMatch.avatar_url };
                    }

                    const productMatch = allProducts?.find(p =>
                        p.name.toLowerCase().trim() === term ||
                        p.public_slug.toLowerCase().trim() === term
                    );
                    if (productMatch) {
                        return {
                            type: productMatch.product_type === 'beat' ? 'beat' : 'kit',
                            term: productMatch.name,
                            id: productMatch.id,
                            public_slug: productMatch.public_slug,
                            img: productMatch.image_url
                        };
                    }

                    // No match found -> unresolved
                    return { ...historyObj, unresolved: true };
                });
            } catch (e) {
                console.error("Resolution failed:", e);
                return history.map(item => typeof item === 'string' ? { type: 'text', term: item } : item);
            }
        }

        async function loadFullHistory() {
            const container = document.getElementById('history-items-container');

            // Show skeletons briefly
            if (!container.innerHTML || container.innerHTML.trim() === '') {
                renderSearchSkeletons();
            }

            // Artificial short delay for visual consistency (Show skeletons)
            await new Promise(r => setTimeout(r, 2000));

            let history = JSON.parse(localStorage.getItem('offszn_search_history')) || [];

            // 🔥 SMART RESOLUTION: Check if text items correspond to real entities
            const resolvedHistory = await resolveHistoryItems(history);
            currentHistory = resolvedHistory;

            const clearBtn = document.getElementById('clear-all-btn');
            if (resolvedHistory.length > 0) {
                clearBtn.style.display = 'flex';
            } else {
                clearBtn.style.display = 'none';
            }

            if (resolvedHistory.length === 0) {
                container.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 60px 20px; text-align: center; margin-top: -20px;">
                        <div style="font-size: 2.5rem; margin-bottom: 20px; color: #333; opacity: 0.5;">
                            <i class="bi bi-clock-history"></i>
                        </div>
                        <h2 style="font-size: 0.95rem; color: #666; margin-bottom: 32px; font-weight: 500; font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0.3px;">Sin búsquedas recientes</h2>
                        <a href="/explorar.html" class="btn btn-light rounded-pill" 
                           style="background: #fff; color: #000; font-weight: 800; border: none; padding: 10px 32px; font-size: 0.75rem; font-family: 'Plus Jakarta Sans', sans-serif; text-decoration: none; display: inline-block; transition: opacity 0.2s; text-transform: uppercase; letter-spacing: 1px; border-radius: 99px !important;">
                            Explorar
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = resolvedHistory.map((item) => {
                let historyObj = item;
                const termEscaped = escapeHTML(historyObj.term);

                // Safe URL generation
                const safeUrlTerm = encodeURIComponent(historyObj.term).replace(/'/g, "%27");

                let targetUrl = '';
                let isDisabled = false;

                if (historyObj.type === 'user') {
                    targetUrl = `/@${safeUrlTerm}`;
                } else if ((historyObj.type === 'beat' || historyObj.type === 'kit') && (historyObj.id || historyObj.public_slug)) {
                    // Use SEO link if createSeoLink is available
                    if (window.createSeoLink) {
                        targetUrl = window.createSeoLink(historyObj);
                    } else {
                        targetUrl = `/producto.html?id=${historyObj.id}`;
                    }
                } else if (historyObj.unresolved) {
                    isDisabled = true;
                } else {
                    // Generic text search - User wants these to be "not clickable" if they don't exist as entity
                    // But if it was saved as text and not resolved, we mark as disabled.
                    isDisabled = true;
                }

                let iconHtml = '<i class="bi bi-clock-history"></i>';
                if (historyObj.img) {
                    iconHtml = `<img data-r2-src="${historyObj.img}" src="" onerror="this.src=''; this.style.display='none';" style="width:32px; height:32px; border-radius:${historyObj.type === 'user' ? '50%' : '6px'}; object-fit:cover; background:#1a1a1a;">`;
                } else if (historyObj.type === 'user') {
                    iconHtml = '<i class="bi bi-person-circle" style="color:#888; font-size: 1.5rem;"></i>';
                } else if (historyObj.type === 'beat' || historyObj.type === 'kit') {
                    iconHtml = `<i class="bi ${historyObj.type === 'kit' ? 'bi-box-seam' : 'bi-music-note-beamed'}" style="color:#888; font-size: 1.5rem;"></i>`;
                }

                let subtitle = historyObj.subtitle || '';
                if (!subtitle) {
                    if (historyObj.type === 'user') subtitle = 'Producer';
                    else if (historyObj.type === 'beat') subtitle = 'Beat';
                    else if (historyObj.type === 'kit') subtitle = 'Sound Kit';
                }

                return `
                <div class="history-card ${isDisabled ? 'disabled' : ''}" ${!isDisabled ? `onclick="window.location.href='${targetUrl}'"` : ''}>
                    <div class="history-info">
                        ${iconHtml}
                        <span>
                            ${termEscaped}
                            ${subtitle ? `<span class="history-meta">• ${escapeHTML(subtitle)}</span>` : ''}
                        </span>
                    </div>
                    <div class="history-actions">
                        <button class="btn-delete-item" data-term="${termEscaped}" onclick="deleteHistoryItemFromPage(this.getAttribute('data-term'), event, this)">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            `;
            }).join('');

            // 🔥 POST-RENDER: Sign R2 images in history items
            container.querySelectorAll('img[data-r2-src]').forEach(async (img) => {
                const rawSrc = img.getAttribute('data-r2-src');
                if (!rawSrc) return;
                try {
                    if (window.getAuthorizedUrl) {
                        const signedUrl = await window.getAuthorizedUrl(rawSrc);
                        if (signedUrl) {
                            img.src = signedUrl;
                            img.style.opacity = '1';
                        }
                    } else {
                        img.src = rawSrc;
                    }
                } catch (e) {
                    img.src = rawSrc;
                }
            });
        }

        async function deleteHistoryItemFromPage(term, event, btnEl) {
            event.stopPropagation();

            // UI INSTANT REMOVE
            const card = btnEl.closest('.history-card');
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translateX(20px)';
                card.style.transition = 'all 0.3s ease';
                setTimeout(() => card.remove(), 300);
            }

            // Logic background
            if (window.deleteHistoryItem) {
                await window.deleteHistoryItem(term, event);
            } else {
                const lowerTerm = term.toLowerCase().trim();
                let history = JSON.parse(localStorage.getItem('offszn_search_history')) || [];
                history = history.filter(t => {
                    const textVal = typeof t === 'string' ? t : t.term;
                    return textVal.toLowerCase().trim() !== lowerTerm;
                });
                localStorage.setItem('offszn_search_history', JSON.stringify(history));
                // No need to reload full history immediately if UI is handled
            }
        }

        function clearFullHistory() {
            document.getElementById('clear-history-modal').classList.add('active');
        }

        function closeClearModal() {
            document.getElementById('clear-history-modal').classList.remove('active');
        }

        async function executeClearAll() {
            closeClearModal();

            if (window.updateUniversalSearchHistory) {
                await window.updateUniversalSearchHistory([]);
            } else {
                localStorage.setItem('offszn_search_history', JSON.stringify([]));
                loadFullHistory();
            }
        }

        // 🔄 REACTIVE SYNC: Listen for history changes from Navbar or other sources
        window.addEventListener('offszn-history-changed', (e) => {
            loadFullHistory();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Initial load
            loadFullHistory();
            // Retry after navbar init
            setTimeout(loadFullHistory, 800);
        });
    </script>
