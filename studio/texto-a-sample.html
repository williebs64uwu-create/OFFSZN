<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFSZN | Master Template</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- SEO & Social Meta Tags -->
    <meta name="description" content="OFFSZN - El marketplace #1 de productores musicales en Perú.">
    <meta property="og:title" content="OFFSZN | Master Template">
    <meta property="og:description" content="Explora, compra y vende recursos musicales de alta calidad.">
    <meta property="og:image" content="https://offszn.lat/images/logo.webp">
    <meta property="og:url" content="https://offszn.lat/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://offszn.lat/images/logo.webp">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth-ui.css">
    <link rel="stylesheet" href="/css/global-overlays.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/avatar-manager.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- 1. Cargar Configuración Segura y Supabase -->
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.supabaseClient = null;
    </script>
    <script src="/script/auth-utils.js?v=11"></script>
</head>

<body>

    <!-- ==================== DYNAMIC NAVBAR ==================== -->
    <div id="navbar-placeholder">
        <div
            style="background: rgba(0, 0, 0, 0.95); height: 58px; width: 100%; border-bottom: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;">
        </div>
    </div>
    <script src="/script/load-navbar.js?v=21"></script>

    <!-- ==================== AI STUDIO HERO ==================== -->
    <main style="min-height: 80vh; padding: 80px 20px; text-align: center; color: #fff;">
        <div style="max-width: 800px; margin: 0 auto;">
            
            <!-- Credits Badge -->
            <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3); padding: 6px 16px; border-radius: 20px; color: #ffd700; font-size: 0.85rem; font-weight: 600; margin-bottom: 24px;">
                <i class="fas fa-gem"></i>
                <span id="user-credits-display">Cargando créditos...</span>
            </div>

            <h1 style="font-size: 3rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 16px; font-family: 'Plus Jakarta Sans', sans-serif;">
                Genera tu <span style="background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Sonido.</span>
            </h1>
            <p style="color: #999; font-size: 1.1rem; margin-bottom: 40px; max-width: 600px; margin-left: auto; margin-right: auto;">
                Describe lo que quieres escuchar. Nuestra IA creará un sample único y libre de royalties en segundos. 10 créditos por generación.
            </p>

            <!-- Search / Prompt Area -->
            <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 12px; display: flex; align-items:center; transition: all 0.3s;" id="prompt-container">
                <input type="text" id="ai-prompt-input" placeholder="Ej. Un bombo 808 muy distorsionado para drill, BPM 140..." 
                    style="flex: 1; background: transparent; border: none; color: #fff; padding: 16px 20px; font-size: 1.1rem; outline: none;">
                
                <button id="btn-generate-ai" style="background: #fff; color: #000; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-wand-magic-sparkles"></i>
                    Generar 
                </button>
            </div>
            
            <!-- Feedback & Loader -->
            <div id="ai-feedback" style="margin-top: 16px; font-size: 0.9rem; color: #ff4757; display: none;"></div>
            <div id="ai-loader" style="margin-top: 40px; display: none;">
                <div style="display: flex; justify-content: center; gap: 4px; align-items: center; height: 30px;" class="wave-loader">
                    <div style="width: 4px; height: 10px; background: #fff; border-radius: 2px; animation: wave 1s infinite ease-in-out;"></div>
                    <div style="width: 4px; height: 20px; background: #fff; border-radius: 2px; animation: wave 1s infinite ease-in-out 0.1s;"></div>
                    <div style="width: 4px; height: 30px; background: #fff; border-radius: 2px; animation: wave 1s infinite ease-in-out 0.2s;"></div>
                    <div style="width: 4px; height: 20px; background: #fff; border-radius: 2px; animation: wave 1s infinite ease-in-out 0.3s;"></div>
                    <div style="width: 4px; height: 10px; background: #fff; border-radius: 2px; animation: wave 1s infinite ease-in-out 0.4s;"></div>
                </div>
                <p style="color: #888; margin-top: 16px; font-size: 0.9rem; letter-spacing: 1px; font-weight: 500;">Sintetizando audio...</p>
            </div>

            <!-- Result Player -->
            <div id="ai-result-card" style="margin-top: 40px; padding: 24px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; text-align: left; display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="font-size: 1.1rem; font-weight: 600; margin: 0;">Resultado Generado</h3>
                    <button id="btn-download-ai" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s;">
                        <i class="fas fa-download"></i> Descargar .WAV
                    </button>
                </div>
                <!-- Native Audio Player injected here -->
                <audio id="ai-audio-player" crossorigin="anonymous" controls style="width: 100%; border-radius: 8px; outline: none;"></audio>
            </div>

        </div>
    </main>
    
    <style>
        /* Loader Animation */
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
            50% { transform: scaleY(1.5); opacity: 1; }
        }
        #prompt-container:focus-within {
            border-color: rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 0 20px rgba(255,255,255,0.05);
        }
        #btn-generate-ai:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        #btn-generate-ai:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>

    <!-- ==================== SIDE PANELS ==================== -->

    <!-- BACKDROP -->
    <div class="overlay-backdrop" id="globalBackdrop" onclick="closeAllOverlays()"></div>

    <!-- CART SIDE PANEL -->
    <div class="side-panel" id="globalCartPanel">
        <div class="panel-header">
            <div class="panel-title" style="display: flex; align-items: center; gap: 8px;">
                <div style="position: relative; display: flex;">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-panel-count" class="notification-badge"
                        style="position: absolute; top: -6px; right: -6px; display: flex;">0</span>
                </div>
                Tu Carrito
            </div>
            <button class="panel-close" onclick="closeAllOverlays()">&times;</button>
        </div>
        <div class="panel-content" id="cart-items-container">
            <div style="text-align:center; padding: 40px 0; color: #666;">
                <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <p>Tu carrito está vacío</p>
            </div>
        </div>
        <div class="cart-total-section" id="cart-summary">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem; color:#fff; font-weight:700;">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="btn-checkout-global" id="cart-checkout-btn"
                onclick="window.location.href='/pages/checkout.html'">
                <i class="bi bi-lock-fill" style="margin-right:6px;"></i> Ir a Pagar Seguro
            </button>

            <!-- TRUST BADGES -->
            <div
                style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
                <p style="font-size: 0.65rem; color: #666; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700;">
                    METODOS DE PAGO SEGUROS</p>

                <div style="display: flex; gap: 12px; justify-content: center; align-items: center; opacity: 0.8; filter: grayscale(100%); transition: filter 0.3s;"
                    onmouseover="this.style.filter='grayscale(0%)'" onmouseout="this.style.filter='grayscale(100%)'">
                    <i class="fab fa-cc-paypal" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-visa" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-mastercard" style="font-size: 26px; color: #fff;"></i>
                    <!-- Standardized YAPE format -->
                    <span class="badge-yape">YAPE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== FOOTER ==================== -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="/script/id-obfuscator.js?v=1"></script>
    <script src="/script/cart.js?v=21"></script>
    <script src="/script/notifications.js?v=21"></script>
    <script src="/script/avatar-manager.js?v=21"></script>
    <script src="/script/footer.js?v=21"></script>
    <script src="/script/navbar.js?v=21" type="module"></script>
    <script src="/script/toast.js?v=21" type="module"></script>
    <script src="/script/studio-ai.js?v=1" type="module"></script>

</body>

</html>
