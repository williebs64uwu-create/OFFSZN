name: STAR CHAIN · repaso de cobros de PayPal

# Cada 10 minutos: le pregunta a PayPal qué cobros de STAR CHAIN (cuotas) hubo y registra los que falten (clave, pedido, finanzas y correo).
# Es la red de seguridad por si el webhook o la página fallan. Es seguro repetirlo: cada cobro se registra una sola vez.
# Necesita el secret STORE_CRON_SECRET (el mismo valor que la variable de entorno del servidor).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STORE_CRON_SECRET: ${{ secrets.STORE_CRON_SECRET }}
    steps:
      - name: Llamar al repaso de STAR CHAIN
        if: ${{ env.STORE_CRON_SECRET != '' }}
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $STORE_CRON_SECRET" \
            https://offszn.lat/api/store/cron/star-reconcile
