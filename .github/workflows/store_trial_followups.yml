name: Tienda Willie · automatizaciones

# Cada hora: "¿lo instalaste?" a las 48 h sin activar y la oferta por país cuando vence la prueba.
# Necesita el secret STORE_CRON_SECRET (el mismo valor que la variable de entorno del servidor).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  followups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STORE_CRON_SECRET: ${{ secrets.STORE_CRON_SECRET }}
    steps:
      - name: Llamar al cron de la tienda
        if: ${{ env.STORE_CRON_SECRET != '' }}
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $STORE_CRON_SECRET" \
            https://offszn.lat/api/store/cron/trial-followups
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $STORE_CRON_SECRET" \
            https://offszn.lat/api/store/cron/automations
