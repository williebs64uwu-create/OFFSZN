name: Correo semanal de finanzas

# Cada lunes a las 8:00 (hora de Lima = 13:00 UTC) manda a tu correo cómo vas con el dinero.
# Necesita el secret STORE_CRON_SECRET (el mismo valor que la variable de entorno del servidor).
# Y el correo guardado en finance_settings (report_email) o la variable FINANCE_REPORT_EMAIL.
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STORE_CRON_SECRET: ${{ secrets.STORE_CRON_SECRET }}
    steps:
      - name: Mandar el correo semanal
        if: ${{ env.STORE_CRON_SECRET != '' }}
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $STORE_CRON_SECRET" \
            https://offszn.lat/api/store/cron/weekly-finance
