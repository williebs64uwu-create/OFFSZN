<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Debug Tool - OFFSZN</title>
    <style>
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }

        .card {
            background: #111;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
            border: 1px solid #333;
        }

        h2 {
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }

        input,
        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border-radius: 6px;
            border: none;
        }

        input[type="file"] {
            background: #222;
            color: #fff;
            cursor: pointer;
        }

        button {
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-load {
            background: #fff;
            color: #000;
        }

        #btn-load:hover {
            background: #ccc;
        }

        #btn-render {
            background: #3b82f6;
            color: #fff;
        }

        #btn-render:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        #status {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
            margin-top: 20px;
            border: 1px solid #222;
            height: 300px;
            overflow-y: auto;
        }

        .success {
            color: #4ade80;
            margin-bottom: 5px;
        }

        .error {
            color: #f87171;
            margin-bottom: 5px;
        }

        video {
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>🚀 FFmpeg Clean Debugger</h2>
        <p>Prueba aislada del motor de video en <code>/offszn-debug/</code></p>

        <label>1. Imagen de Portada (JPG/PNG)</label>
        <input type="file" id="input-img" accept="image/*">

        <label>2. Beat Audio (MP3/WAV)</label>
        <input type="file" id="input-audio" accept="audio/*">

        <button id="btn-load">PASO 1: CARGAR FFMPEG</button>
        <button id="btn-render" disabled>PASO 2: GENERAR VIDEO DE PRUEBA</button>

        <div id="status">Esperando interacción...</div>
    </div>

    <!-- Referencias a los scripts locales -->
    <script src="/ffmpeg_clean/ffmpeg.js"></script>
    <script src="debug.js"></script>
</body>

</html>
