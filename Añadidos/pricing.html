    <meta charset="UTF-8">

    <title>Pricing Modal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upgrade-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .upgrade-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .upgrade-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        /* Modal Content */
        .modal {
            background: #1f1f1f;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        /* Close Button */
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
        }

        /* Modal Header */
        .modal-header {
            padding: 24px 24px 16px;
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-title svg {
            width: 22px;
            height: 22px;
        }

        .modal-subtitle {
            color: #999;
            font-size: 14.5px;
            line-height: 1.5;
        }

        /* Plans Container */
        .plans-container {
            padding: 0 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Plan Card */
        .plan-card {
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            background: #1a1a1a;
        }

        .plan-card:hover {
            border-color: #3a3a3a;
        }

        .plan-card.selected {
            border-color: #fff;
            background: #1f1f1f;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .plan-info {
            flex: 1;
        }

        .plan-info h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #fff;
        }

        .plan-info p {
            font-size: 13px;
            color: #999;
        }

        .plan-price {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .plan-price .amount {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }

        .plan-price .period {
            font-size: 16px;
            color: #999;
        }

        .plan-features {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .plan-features li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #e0e0e0;
        }

        .plan-features svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #fff;
        }

        .selected-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .plan-card.selected .selected-badge {
            display: flex;
        }

        .selected-badge svg {
            width: 14px;
            height: 14px;
            color: #000;
        }

        /* Radio Button (Hidden) */
        .plan-radio {
            display: none;
        }

        /* Modal Footer */
        .modal-footer {
            padding: 0 24px 24px;
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: #fff;
            color: #000;
        }

        .btn-primary:hover {
            background: #f0f0f0;
        }

        .btn-secondary {
            background: transparent;
            color: #999;
        }

        .btn-secondary:hover {
            color: #fff;
        }

        @media (max-width: 640px) {
            .modal {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- Botón para abrir modal -->
    <button class="upgrade-btn" id="openModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        Upgrade Plan
    </button>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <!-- Close Button -->
            <button class="modal-close" id="closeModal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>

            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    Choose Your Plan
                </h2>
                <p class="modal-subtitle">
                    Select the perfect plan for your needs. Upgrade or downgrade at any time.
                </p>
            </div>

            <!-- Plans Container -->
            <div class="plans-container">
                <!-- Basic Plan -->
                <div class="plan-card" data-plan="basic">
                    <input type="radio" name="plan" value="basic" class="plan-radio" id="plan-basic">
                    <div class="plan-header">
                        <div class="plan-info">
                            <h3>Basic</h3>
                            <p>Perfect for side projects</p>
                        </div>
                        <div class="plan-price">
                            <span class="amount">$9</span>
                            <span class="period">/mo</span>
                        </div>
                    </div>
                    <ul class="plan-features">
                        <li>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            5 projects
                        </li>
                        <li>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            Basic analytics
                        </li>
                        <li>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            24h support
                        </li>
                    </ul>
                    <div class="selected-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </div>
                </div>

                <!-- Pro Plan -->
                <div class="plan-card selected" data-plan="pro">
                    <input type="radio" name="plan" value="pro" class="plan-radio" id="plan-pro" checked>
                    <div class="plan-header">
                        <div class="plan-info">
                            <h3>Pro</h3>
                            <p>For professional developers</p>
                        </div>
                        <div class="plan-price">
                            <span class="amount">$19</span>
                            <span class="period">/mo</span>
                        </div>
                    </div>
                    <ul class="plan-features">
                        <li>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            Unlimited projects
                        </li>
                        <li>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            Advanced analytics
                        </li>
                        <li>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            Priority support
                        </li>
                    </ul>
                    <div class="selected-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button class="btn btn-primary" id="confirmBtn">Confirm Selection</button>
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const openModalBtn = document.getElementById('openModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const planCards = document.querySelectorAll('.plan-card');

        // Abrir modal
        openModalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        // Cerrar modal
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeModalBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        // Cerrar al hacer click fuera del modal
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // Seleccionar plan
        planCards.forEach(card => {
            card.addEventListener('click', () => {
                // Remover selección de todos
                planCards.forEach(c => c.classList.remove('selected'));
                // Agregar selección al clickeado
                card.classList.add('selected');
                // Actualizar radio button
                const radio = card.querySelector('.plan-radio');
                radio.checked = true;
            });
        });

        // Confirmar selección
        confirmBtn.addEventListener('click', () => {
            const selectedPlan = document.querySelector('.plan-card.selected');
            const planName = selectedPlan.dataset.plan;
            
            // Mostrar alert de confirmación (puedes eliminar esta línea)
            alert(`¡Plan ${planName.toUpperCase()} seleccionado!`);
            
            // ⭐ AQUÍ COLOCA TU RUTA - Descomenta y modifica la siguiente línea:
            // window.location.href = '/tu-ruta-aqui?plan=' + planName;
            
            closeModal();
        });

        // Cerrar con tecla ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
