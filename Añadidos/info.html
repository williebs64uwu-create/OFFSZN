<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background: #000;
            border: 1px solid #222;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: none;
            pointer-events: none;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .animation-container {
            position: relative;
            width: 300px;
            height: 270px;
            flex-shrink: 0;
        }

        .center-icon {
            display: none;
        }

        .tag {
            position: absolute;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: #666;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tag.active {
            color: #fff;
            background: #1f1f1f;
            border-color: #444;
            transform: scale(1.05);
        }

        #tag-1 {
            top: 20px;
            right: 80px;
        }

        #tag-2 {
            top: 100px;
            left: 10px;
        }

        #tag-3 {
            bottom: 100px;
            right: 20px;
        }

        #tag-4 {
            bottom: 30px;
            left: 60px;
        }

        .pointer {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .pointer svg {
            width: 17px;
            height: 18px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .pointer-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.5);
        }

        .text-content {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }

        h2 {
            font-size: clamp(24px, 5vw, 40px);
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .subtitle {
            color: #888;
            margin-bottom: 24px;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.3);
            background: #f0f0f0;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            padding: 0;
            background: transparent;
            border: 1px solid #444;
            color: #fff;
        }

        .btn-icon:hover {
            background: #222;
            border-color: #666;
            transform: translateY(-2px);
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card:hover .particles {
            opacity: 0.5;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #555;
            border-radius: 50%;
            animation: floatParticle 4s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(8px, -10px);
            }

            50% {
                transform: translate(-6px, 8px);
            }

            75% {
                transform: translate(10px, 6px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
            }

            50% {
                transform: translateY(-20px) translateX(10px);
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 24px;
            }

            .content {
                flex-direction: column;
                text-align: center;
            }

            .animation-container {
                width: 250px;
                height: 220px;
            }

            .buttons {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card" id="card">
            <div class="particles" id="particles"></div>

            <div class="content">
                <div class="animation-container">
                    <div class="center-icon">✨</div>

                    <div class="tag" id="tag-1">Drumkits</div>
                    <div class="tag" id="tag-2">Beats</div>
                    <div class="tag" id="tag-3">Negociar precios</div>
                    <div class="tag" id="tag-4">Presets</div>

                    <div class="pointer" id="pointer">
                        <svg viewBox="0 0 12 13" fill="#ef4444" stroke="white" stroke-width="1"
                            xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M12 5.50676L0 0L2.83818 13L6.30623 7.86537L12 5.50676V5.50676Z" />
                        </svg>
                        <span class="pointer-label">Ali</span>
                    </div>
                </div>

                <div class="text-content">
                    <h2>¿Tienes dudas sobre nuestros beats o servicios?</h2>
                    <p class="subtitle">¡Contáctanos para ayudarte!</p>

                    <div class="buttons">
                        <a href="#" class="btn btn-primary">Enviar mensaje</a>
                        <a href="#" class="btn btn-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                        </a>
                        <a href="#" class="btn btn-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Crear partículas
        const particlesContainer = document.getElementById('particles');
        const particles = [];

        for (let i = 0; i < 10; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            particle.style.left = x + '%';
            particle.style.top = y + '%';

            // Delays y duraciones aleatorias para cada partícula
            particle.style.animationDelay = (Math.random() * 3) + 's';
            particle.style.animationDuration = (2 + Math.random() * 2) + 's';

            particlesContainer.appendChild(particle);
        }

        // Mostrar/ocultar partículas con hover - ya no se necesita click
        const card = document.getElementById('card');

        // Efecto hover en la tarjeta (solo para el gradiente sutil)
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            card.style.setProperty('--mouse-x', x + '%');
            card.style.setProperty('--mouse-y', y + '%');
        });

        // Animación del puntero
        const pointer = document.getElementById('pointer');
        const tags = {
            'tag-1': { left: 148, top: 40 },
            'tag-2': { left: 35, top: 120 },
            'tag-3': { left: 200, top: 190 },
            'tag-4': { left: 85, top: 220 }
        };

        const sequence = [
            { tag: 'tag-1', duration: 1500 },
            { tag: 'tag-2', duration: 1500 },
            { tag: 'tag-3', duration: 1500 },
            { tag: 'tag-4', duration: 1500 }
        ];

        let currentIndex = 0;

        function animatePointer() {
            const current = sequence[currentIndex];
            const tagElement = document.getElementById(current.tag);
            const position = tags[current.tag];

            // Remover clase active de todos
            Object.keys(tags).forEach(id => {
                document.getElementById(id).classList.remove('active');
            });

            // Añadir clase active al actual
            tagElement.classList.add('active');

            // Mover el puntero
            pointer.style.left = position.left + 'px';
            pointer.style.top = position.top + 'px';

            currentIndex = (currentIndex + 1) % sequence.length;
        }

        // Iniciar animación
        animatePointer();
        setInterval(animatePointer, 1500);
    </script>
</body>

</html>
