<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DAW Logo Test</title>
  <style>
    body { background: #08080c; color: #fff; font-family: sans-serif; padding: 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; }
    .card img { height: 48px; width: 48px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="card"><img src="../images/daws/flstudio.png"><div><b>FL Studio</b><br><small>Image-Line</small></div></div>
  <div class="card"><img src="../images/daws/ableton.svg"><div><b>Ableton Live</b><br><small>Ableton</small></div></div>
  <div class="card"><img src="../images/daws/logic.png"><div><b>Logic Pro</b><br><small>Apple</small></div></div>
  <div class="card"><img src="../images/daws/protools.svg"><div><b>Pro Tools</b><br><small>Avid</small></div></div>
  <div class="card"><img src="../images/daws/studioone.svg"><div><b>Studio One</b><br><small>PreSonus</small></div></div>
  <div class="card"><img src="../images/daws/reaper.svg"><div><b>REAPER</b><br><small>Cockos</small></div></div>
  <div class="card"><img src="../images/daws/cubase.svg"><div><b>Cubase</b><br><small>Steinberg</small></div></div>
  <div class="card"><img src="../images/daws/garageband.png"><div><b>GarageBand</b><br><small>Apple</small></div></div>
  <div class="card"><img src="../images/daws/bitwig.svg"><div><b>Bitwig Studio</b><br><small>Bitwig</small></div></div>
</body>
</html>
