<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="100%" height="100%">
  <defs>
    <linearGradient id="s1grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BAFF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6f0ff"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0088FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Badge -->
  <g filter="url(#glow)">
    <rect x="5" y="10" width="90" height="90" rx="20" fill="url(#s1grad)"/>
    <!-- Studio One stylized geometric 'S1' ribbons -->
    <path d="M 27 34 L 63 34 L 77 48 L 41 48 Z" fill="url(#ribbon1)"/>
    <path d="M 41 48 L 77 48 L 63 62 L 27 62 Z" fill="url(#ribbon2) opacity="0.9""/>
    <path d="M 27 62 L 63 62 L 77 76 L 41 76 Z" fill="url(#ribbon1)"/>
  </g>

  <!-- Studio One Typography -->
  <text x="115" y="54" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="2">STUDIO ONE</text>
  <text x="117" y="80" fill="#00BAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4">PRESONUS</text>
</svg>
