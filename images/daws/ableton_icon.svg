<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ableton Live official icon: 4 vertical lines + 4 horizontal lines -->
  <g fill="#FFFFFF">
    <!-- 4 Vertical Bars -->
    <rect x="8" y="12" width="7" height="76" rx="1.5"/>
    <rect x="20" y="12" width="7" height="76" rx="1.5"/>
    <rect x="32" y="12" width="7" height="76" rx="1.5"/>
    <rect x="44" y="12" width="7" height="76" rx="1.5"/>
    <!-- 4 Horizontal Bars -->
    <rect x="56" y="12" width="36" height="7" rx="1.5"/>
    <rect x="56" y="35" width="36" height="7" rx="1.5"/>
    <rect x="56" y="58" width="36" height="7" rx="1.5"/>
    <rect x="56" y="81" width="36" height="7" rx="1.5"/>
  </g>
</svg>
