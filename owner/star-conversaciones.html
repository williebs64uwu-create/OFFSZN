<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFSZN • Conversaciones de STAR CHAIN</title>
<style>
:root{--bg:#09090b;--surface:#121216;--elev:#18181e;--line:rgba(255,255,255,.08);--txt:#fff;--sec:#a1a1aa;--mut:#71717a;--amber:#f59e0b;--green:#10b981;--rose:#f43f5e;--blue:#38bdf8;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:16px;font-weight:700;margin-right:auto}
h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
input,select,button{background:var(--elev);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:rgba(255,255,255,.25)}
button.pri{background:var(--amber);color:#111;border-color:var(--amber);font-weight:700}
#lock{max-width:340px;margin:18vh auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px}
#lock p{color:var(--sec);font-size:13px}
#app{display:none}
.stats{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mut);font-size:12px}
.list{padding:0 20px 40px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.row.bad{border-color:rgba(244,63,94,.5)}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--mut);font-size:11px;margin-bottom:6px;font-family:var(--mono)}
.tag{padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--sec)}
.tag.ia{color:var(--blue)}.tag.reglas{color:var(--green)}.tag.art{color:var(--amber)}
.u{font-weight:600}.s{color:var(--sec);margin-top:3px}
.acc{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:5px;word-break:break-all}
.hw{cursor:pointer;text-decoration:underline dotted}
#msg{padding:30px 20px;color:var(--mut)}
@media(max-width:600px){header,.stats,.list{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div id="lock">
  <h1>Conversaciones de STAR CHAIN<small>Panel owner</small></h1>
  <p>Escribe la clave del panel.</p>
  <input id="pin" type="password" placeholder="Clave del panel" autocomplete="off">
  <button class="pri" id="go">Entrar</button>
  <p id="err" style="color:var(--rose)"></p>
</div>
<div id="app">
  <header>
    <h1>Conversaciones de STAR CHAIN<small>Lo que escribe la gente, qué responde STAR y qué cambia. Solo texto, enviado con el aviso del plugin.</small></h1>
    <input id="q" placeholder="Buscar en lo que escribió…" style="min-width:200px">
    <select id="ruta"><option value="">Todas</option><option value="IA">IA</option><option value="reglas">Reglas</option><option value="artista">Artista</option><option value="opcion">Opción</option></select>
    <select id="lic"><option value="">Toda licencia</option><option value="prueba">Prueba</option><option value="completa">Completa</option></select>
    <label style="color:var(--sec);font-size:12px"><input type="checkbox" id="onlyBad"> solo las que no resolvió</label>
    <button id="reload">Actualizar</button>
    <button id="exp">Descargar JSON</button>
  </header>
  <div class="stats" id="stats"></div>
  <div id="msg"></div>
  <div class="list" id="list"></div>
</div>
<script>
const KEY = 'offszn_owner_auth_token';
let PIN = '', LOGS = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// «No resolvió»: respuestas de "no entendí / no pude / no lo sé" o acciones vacías en una orden
const BAD = /no (te )?entend|no (lo )?pude|no s[eé]|no est[aá] disponible|no tengo|intenta de otra/i;
const isBad = (l) => BAD.test(l.respuesta || '');

async function verify(pin) {
  try { const r = await fetch('/api/plugin/admin/verify-pin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) }); return r.ok; } catch (e) { return false; }
}
async function enter(pin) {
  if (!(await verify(pin))) return false;
  PIN = pin; try { sessionStorage.setItem(KEY, pin); } catch (e) {}
  $('lock').style.display = 'none'; $('app').style.display = 'block'; load(); return true;
}
$('go').onclick = async () => { $('err').textContent = ''; if (!(await enter($('pin').value.trim()))) $('err').textContent = 'Clave incorrecta.'; };
$('pin').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
(async () => { let t = ''; try { t = sessionStorage.getItem(KEY) || ''; } catch (e) {} if (t) await enter(t); })();

async function load() {
  $('msg').textContent = 'Cargando…'; $('list').innerHTML = '';
  const p = new URLSearchParams({ admin_key: PIN, limit: '1000', _t: Date.now() });
  if ($('q').value.trim()) p.set('q', $('q').value.trim());
  if ($('ruta').value) p.set('ruta', $('ruta').value);
  try {
    const r = await fetch('/api/plugin/admin/chatlog?' + p);
    if (!r.ok) throw new Error(r.status === 403 ? 'Clave no válida' : 'Error ' + r.status);
    LOGS = (await r.json()).logs || [];
  } catch (e) { $('msg').textContent = 'No se pudo cargar: ' + e.message + '. ¿Ya se creó la tabla plugin_chat_logs?'; return; }
  render();
}
function render() {
  const lic = $('lic').value, onlyBad = $('onlyBad').checked;
  const L = LOGS.filter((l) => (!lic || l.license === lic) && (!onlyBad || isBad(l)));
  const users = new Set(L.map((l) => l.hwid)), bad = L.filter(isBad).length;
  const by = (k) => L.filter((l) => l.ruta === k).length;
  $('stats').innerHTML = [[L.length, 'mensajes'], [users.size, 'usuarios'], [bad, 'no resueltos'], [by('IA'), 'por IA'], [by('reglas'), 'por reglas']].map((s) => `<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
  $('msg').textContent = L.length ? '' : 'Sin conversaciones con estos filtros.';
  $('list').innerHTML = L.map((l) => {
    const when = new Date(l.said_at || l.created_at).toLocaleString('es');
    const cls = { IA: 'ia', reglas: 'reglas', artista: 'art' }[l.ruta] || '';
    const acc = (l.acciones || []).map((a) => a && a.type ? a.type + (a.bus ? ':' + a.bus : '') : '').filter(Boolean).join(' · ');
    return `<div class="row ${isBad(l) ? 'bad' : ''}"><div class="meta"><span>${esc(when)}</span><span class="tag ${cls}">${esc(l.ruta)}</span><span class="tag">${esc(l.license)}</span><span class="tag">v${esc(l.version)}</span><span class="hw" data-h="${esc(l.hwid)}" title="Ver solo este usuario">${esc((l.hwid || '').slice(-10))}</span></div><div class="u">${esc(l.usuario)}</div><div class="s">${esc(l.respuesta)}</div>${acc ? `<div class="acc">${esc(acc)}</div>` : ''}</div>`;
  }).join('');
  document.querySelectorAll('.hw').forEach((e) => e.onclick = () => { LOGS = LOGS.filter((l) => l.hwid === e.dataset.h); render(); });
}
$('reload').onclick = load; $('ruta').onchange = load; $('q').onkeydown = (e) => { if (e.key === 'Enter') load(); };
$('lic').onchange = render; $('onlyBad').onchange = render;
$('exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(LOGS, null, 1)], { type: 'application/json' })); a.download = 'star-conversaciones.json'; a.click(); };
</script>
</body>
</html>
