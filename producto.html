<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFFSZN | Beats, Drum Kits y Presets</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta name="description" content="Descubre los mejores beats, drum kits, presets y samples exclusivos en OFFSZN. El marketplace musical para productores en Latinoamérica.">
  <link rel="canonical" href="https://offszn.lat/producto.html">
  <!-- Icons -->

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/auth-ui.css">
  <link rel="stylesheet" href="/css/global-overlays.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/product-premium.css">
  <link rel="stylesheet" href="/css/sticky-player.css">
  <link rel="stylesheet" href="/css/download-gate.css">
  <link rel="stylesheet" href="/css/hover-card.css">
  <link rel="stylesheet" href="/css/share-modal.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet">

  <!-- 1. Cargar Supabase (Moved to Head for Global Access) -->
  <script src="/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.supabaseClient = null;
    // Initialization handled by auth-utils.js
  </script>
  <script src="/script/auth-utils.js?v=11"></script>
  <script src="/script/notifications.js"></script>
  <!-- EmailJS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (function () {
      if (typeof emailjs !== 'undefined') {
        emailjs.init("If_WAVcuXiGSPp2SB");
      }
    })();
  </script>
</head>

<body>


  <!-- ==================== DYNAMIC NAVBAR ==================== -->
  <div id="navbar-placeholder">
    <div style="background: rgba(0, 0, 0, 0.95); height: 58px; width: 100%; border-bottom: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;"></div>
  </div>
  <script src="/script/load-navbar.js?v=20"></script>

  <main id="product-page-container">
    <!-- Content dynamically injected by product-core.js -->
    <div class="loading-state">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <div id="footer-placeholder"></div>
  <script src="/script/footer.js?v=2"></script>


  <!-- ==================== SIDE PANELS ==================== -->

  <!-- BACKDROP -->
  <div class="overlay-backdrop" id="globalBackdrop" onclick="closeAllOverlays()"></div>

  <!-- CART SIDE PANEL -->
  <div class="side-panel" id="globalCartPanel">
    <div class="panel-header">
      <div class="panel-title" style="display: flex; align-items: center; gap: 8px;">
        <div style="position: relative; display: flex;">
          <i class="fas fa-shopping-cart"></i>
          <span id="cart-panel-count" class="notification-badge"
            style="position: absolute; top: -6px; right: -6px; display: flex;">1</span>
        </div>
        Tu Carrito
      </div>
      <button class="panel-close" onclick="closeAllOverlays()">&times;</button>
    </div>
    <!-- ID CHANGED: globalCartItems -> cart-items-container to match script/cart.js -->
    <div class="panel-content" id="cart-items-container">
      <div style="text-align:center; padding: 40px 0; color: #666;">
        <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 10px;"></i>
        <p>Tu carrito está vacío</p>
      </div>
    </div>
    <!-- ID ADDED: cart-summary (needed by script) -->
    <div class="cart-total-section" id="cart-summary">
      <div style="display:flex; justify-content:space-between; margin-bottom:1rem; color:#fff; font-weight:700;">
        <span>Total:</span>
        <!-- ID CHANGED for JS compatibility -->
        <span id="cart-total-price">$0.00</span>
      </div>
      <!-- ID CHANGED for JS compatibility -->
      <button class="btn-checkout-global" id="cart-checkout-btn" onclick="window.location.href='/pages/checkout.html'">
        <i class="bi bi-lock-fill" style="margin-right:6px;"></i> Ir a Pagar Seguro
      </button>

      <!-- TRUST BADGES -->
      <div
        style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
        <p style="font-size: 0.65rem; color: #666; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700;">
          METODOS DE PAGO SEGUROS</p>

        <div
          style="display: flex; gap: 12px; justify-content: center; align-items: center; opacity: 0.8; filter: grayscale(100%); transition: filter 0.3s;"
          onmouseover="this.style.filter='grayscale(0%)'" onmouseout="this.style.filter='grayscale(100%)'">
          <!-- Global -->
          <i class="fab fa-cc-paypal" style="font-size: 26px; color: #fff;"></i>
          <i class="fab fa-cc-visa" style="font-size: 26px; color: #fff;"></i>
          <i class="fab fa-cc-mastercard" style="font-size: 26px; color: #fff;"></i>

          <!-- Local (Custom Badges) -->
          <div class="badge-yape">YAPE</div>
          <div
            style="background: #00d3de; color: white; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center;">
            PLIN</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="/script/toast.js" type="module"></script>
  <script src="/script/cart.js"></script>
  <script src="/script/notifications.js"></script>

  <script src="/script/navbar.js?v=20" type="module"></script>
  <script src="/script/id-obfuscator.js"></script>
  <script src="/script/download-gate.js"></script>
  <script src="/script/sticky-player.js"></script>
  <script src="/script/hover-card.js"></script>
  <script src="/script/share-modal.js"></script>
  <script src="/script/favorites-manager.js"></script>
  <script src="/script/product-core.js?v=9"></script>
</body>

</html>
