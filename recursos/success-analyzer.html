<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu compra! | X Flow - Analyzer - OFFSZN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #9d4edd;
            --bg: #050505;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .success-card {
            background: #111;
            padding: 60px;
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .success-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px var(--accent));
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 15px;
        }
        p {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 18px 36px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(157, 78, 221, 0.3);
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(157, 78, 221, 0.5);
        }
        .info-box {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            font-size: 0.9rem;
            color: #666;
        }
        .back-home {
            margin-top: 20px;
            display: block;
            color: #444;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <i class="bi bi-check-circle-fill success-icon"></i>
        <h1 data-es="¡Pago Exitoso!" data-en="Payment Successful!">¡Pago Exitoso!</h1>
        <p data-es="Gracias por confiar en X Flow. Ya puedes descargar tu copia del Analyzer y empezar a perfeccionar tus producciones."
           data-en="Thank you for choosing X Flow. You can now download your copy of the Analyzer and start perfecting your productions.">
            Gracias por confiar en X Flow. Ya puedes descargar tu copia del Analyzer y empezar a perfeccionar tus producciones.
        </p>

        <!-- Replace with actual download link provided by the user or hardcoded for now -->
        <a href="https://offszn.lat/descargas/X-Flow-Analyzer-Setup.zip" class="download-btn">
            <i class="bi bi-download"></i>
            <span data-es="Descargar Ahora" data-en="Download Now">Descargar Ahora</span>
        </a>

        <div class="info-box">
            <p style="margin: 0; font-size: 0.85rem;" data-es="Se ha enviado un recibo a tu correo. Guarda tu ID de orden para futuras actualizaciones."
               data-en="A receipt has been sent to your email. Save your order ID for future updates.">
                Se ha enviado un recibo a tu correo. Guarda tu ID de orden para futuras actualizaciones.
            </p>
        </div>

        <a href="/explorar.html" class="back-home" data-es="Volver a la página principal" data-en="Back to home">Volver a la página principal</a>
    </div>

    <script>
        // Language support for success page
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'es';
        
        document.querySelectorAll('[data-es], [data-en]').forEach(el => {
            const text = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-es');
            if (text) el.textContent = text;
        });
    </script>
</body>
</html>
