<!DOCTYPE html>
<html lang="es-419">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{USER_NICKNAME}} | OFFSZN Premium</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Core Scripts -->
  <script src="/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/script/config.js"></script>
  <script src="/script/auth-utils.js"></script>
  <script src="/script/navbar.js"></script>
  <script src="/script/id-obfuscator.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <!-- Global Nav/Footer Styles -->
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/global-overlays.css">
  <link rel="stylesheet" href="/css/sticky-player.css">
  <link rel="stylesheet" href="/css/hover-card.css">
  <link rel="stylesheet" href="/css/skeleton.css">

  <!-- Unified Theme Base CSS from Store Builder -->
  <link rel="stylesheet" href="/store-builder/css/theme-base.css">

  <style>
    /* Absolute scrollbar hiding */
    body::-webkit-scrollbar,
    #app::-webkit-scrollbar {
      display: none !important;
    }
    body {
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <!-- Initial Spinner Loader -->
  <div id="initial-loader" style="position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease;">
    <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem; border: 4px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- DYNAMIC MODULAR APP CONTAINER -->
  <main id="app" class="store-root">
    <!-- El RendererEngine renderizará e inyectará dinámicamente cada sección en base al theme del usuario -->
  </main>

  <!-- SUBSCRIPTION MODAL -->
  <div id="subscription-modal" class="premium-modal">
    <div class="modal-overlay" onclick="closeSubscriptionModal()"></div>
    <div class="modal-content">
      <button class="modal-close" onclick="closeSubscriptionModal()">
        <i class="bi bi-x"></i>
      </button>
      
      <div class="modal-header">
        <div class="status-badge" id="modal-status-badge">ACTIVO</div>
        <h2 id="modal-title">Tu suscripción</h2>
      </div>

      <div class="modal-body">
        <div class="plan-info">
          <span class="label">Plan Actual</span>
          <div class="plan-name" id="modal-plan-name">STARTER</div>
        </div>

        <div class="expiration-box">
          <div class="exp-days" id="modal-days-left">--</div>
          <div class="exp-label">Días restantes</div>
        </div>

        <div class="renewal-info" id="modal-renewal-info">
          <i class="bi bi-info-circle"></i>
          <span>Se renovará automáticamente el <strong id="modal-next-date">--</strong></span>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-primary" onclick="window.location.href='/settings.html?tab=billing'">Gestionar Suscripción</button>
        <button class="btn-ghost" onclick="closeSubscriptionModal()">Entendido</button>
      </div>
    </div>
  </div>

  <style>
    /* ========== SUBSCRIPTION MODAL STYLES ========== */
    .premium-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .premium-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
    }

    .modal-content {
      position: relative;
      background: #0d0d0d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 90%;
      max-width: 420px;
      padding: 40px;
      border-radius: 32px;
      transform: translateY(20px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }

    .premium-modal.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      transition: color 0.2s;
    }
    .modal-close:hover { color: #fff; }

    .status-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    #modal-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 30px;
    }

    .plan-info {
      margin-bottom: 24px;
    }
    .plan-info .label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 4px;
    }
    .plan-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    .expiration-box {
      background: #151515;
      padding: 30px;
      border-radius: 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .exp-days {
      font-size: 4rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 4px;
    }
    .exp-label {
      font-size: 0.9rem;
      color: #888;
      font-weight: 600;
    }

    .renewal-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 30px;
    }
    .renewal-info i { color: #fff; }

    .modal-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      background: #fff;
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: #e0e0e0; }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.05); }
  </style>

  <script>
    function openSubscriptionModal() {
      document.getElementById('subscription-modal').classList.add('active');
    }
    function closeSubscriptionModal() {
      document.getElementById('subscription-modal').classList.remove('active');
    }
  </script>

  <!-- External Libraries -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="/script/favorites-manager.js"></script>
  <script src="/script/sticky-player.js"></script>

  <!-- RENDER ENGINE & MODULAR CORE -->
  <script src="/script/premium-profile-bg.js?v=5"></script>
  <script src="/store-builder/js/renderer/engine.js?v=5" type="module"></script>
  <script src="/script/premium-profile-core.js?v=5" type="module"></script>

  <!-- ==================== SIDE PANELS & OVERLAYS ==================== -->
  <div class="overlay-backdrop" id="globalBackdrop" onclick="closeAllOverlays()"></div>

  <div class="side-panel" id="globalCartPanel">
      <div class="panel-header">
          <div class="panel-title" style="display: flex; align-items: center; gap: 8px;">
              <div style="position: relative; display: flex;">
                  <i class="fas fa-shopping-cart"></i>
                  <span id="cart-panel-count" class="notification-badge" style="position: absolute; top: -6px; right: -6px; display: flex;">0</span>
              </div>
              MI SELECCIÓN
          </div>
          <button class="panel-close" onclick="closeAllOverlays()">&times;</button>
      </div>
      <div class="panel-content" id="cart-items-container">
          <div style="text-align:center; padding: 40px 0; color: #666;">
              <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 10px;"></i>
              <p>Tu carrito está vacío</p>
          </div>
      </div>
      <div class="cart-total-section" id="cart-summary">
          <div style="display:flex; justify-content:space-between; margin-bottom:1rem; color:#fff; font-weight:700;">
              <span>Total:</span>
              <span id="cart-total-price">$0.00</span>
          </div>
          <button class="btn-checkout-global" id="cart-checkout-btn" onclick="window.location.href='/pages/checkout.html'">
              <i class="bi bi-lock-fill" style="margin-right:6px;"></i> Ir a Pagar Seguro
          </button>
          <div style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
              <p style="font-size: 0.65rem; color: #666; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700;">METODOS DE PAGO SEGUROS</p>
              <div style="display: flex; gap: 12px; justify-content: center; align-items: center; opacity: 0.8; filter: grayscale(100%); transition: filter 0.3s;" onmouseover="this.style.filter='grayscale(0%)'" onmouseout="this.style.filter='grayscale(100%)'">
                  <i class="fab fa-cc-paypal" style="font-size: 24px; color: #fff;"></i>
                  <i class="fab fa-cc-visa" style="font-size: 24px; color: #fff;"></i>
                  <i class="fab fa-cc-mastercard" style="font-size: 24px; color: #fff;"></i>
                  <div style="background: #742284; color: white; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; line-height: 1.2;">YAPE</div>
                  <div style="background: #00d3de; color: white; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; line-height: 1.2;">PLIN</div>
              </div>
          </div>
      </div>
  </div>

  <!-- Cart & Notifications scripts -->
  <script src="/script/cart.js"></script>
  <script src="/script/avatar-manager.js"></script>

</body>
</html>
