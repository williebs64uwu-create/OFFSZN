        window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0anB2enRwZ2Z5bWpoaHBvb3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3ODA5MTUsImV4cCI6MjA3NjM1NjkxNX0.YsItTFk3hSQaVuy707-z7Z-j34mXa03O0wWGAlAzjrw";
        window.supabaseClient = null;
    </script>

    <script src="/script/auth-utils.js?v=11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña — OFFSZN</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Geist', sans-serif;
        }

        h1,
        h2,
        h3,
        .btn-primary {
            font-family: 'Geist', sans-serif;
        }

        /* Override Chrome/Edge Autofill Background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0f0f0f inset !important;
            -webkit-text-fill-color: white !important;
            caret-color: white;
        }

        /* Error Message Styling */
        .form-message {
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
            padding: 10px;
            border-radius: 8px;
        }

        .form-message:not(:empty) {
            display: block;
        }

        .form-message.error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .form-message.success {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>

<body class="bg-black min-h-screen flex flex-col">

    <script>
        // INSTANT GUARD: Hide page immediately while checking
        document.body.style.opacity = '0';
        document.body.style.pointerEvents = 'none';

        (async () => {
            // Use global client initialized by auth-utils.js
            if (!window.supabaseClient) {
                // Wait briefly if initialization is in progress
                await new Promise(r => setTimeout(r, 200));
            }

            const supabaseGuard = window.supabaseClient;
            if (!supabaseGuard) {
                document.body.style.opacity = '1';
                document.body.style.pointerEvents = 'auto';
                return;
            }

            const { data: { session } } = await supabaseGuard.auth.getSession();

            if (session) {
                console.log("? Ya autenticado, redirigiendo...");
                window.location.replace('/explorar.html');
            } else {
                document.body.style.opacity = '1';
                document.body.style.pointerEvents = 'auto';
            }
        })();
    </script>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4">
        <div class="w-full max-w-sm">

            <!-- Logo (Clickable -> Home) -->
            <div class="flex justify-center mb-6">
                <a href="/explorar.html" class="hover:opacity-80 transition-opacity" title="Volver al inicio">
                    <img src="/favicon.ico" alt="OFFSZN" style="height: 80px; width: auto;">
                </a>
            </div>

            <!-- Title -->
            <div class="text-center mb-8">
                <h1 class="text-white text-2xl font-semibold mb-2">Recuperar Contraseña</h1>
                <p class="text-zinc-400 text-sm">Ingresa tu correo y te enviaremos un enlace.</p>
            </div>

            <!-- Form -->
            <form id="forgot-password-form" class="space-y-4" novalidate>

                <!-- Email -->
                <div>
                    <label for="recovery-email" class="block text-zinc-400 text-sm mb-2 font-medium">Correo
                        electrónico</label>
                    <input type="email" id="recovery-email" name="email" placeholder="tu@email.com"
                        class="w-full px-4 py-3 bg-[#0f0f0f] border border-white/10 rounded-xl text-white placeholder-zinc-600 focus:outline-none focus:border-purple-600/50 focus:ring-1 focus:ring-purple-600/50 transition-all"
                        required>
                </div>

                <!-- Error/Success Message -->
                <div id="form-message" class="form-message" role="alert"></div>

                <!-- Submit Button -->
                <button type="submit"
                    class="btn-primary w-full py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl transition-all transform hover:scale-[1.02] shadow-[0_4px_20px_rgba(124,58,237,0.3)]">
                    Enviar enlace de recuperación
                </button>

            </form>

            <!-- Back Link -->
            <p class="text-center text-zinc-400 text-sm mt-6">
                <a href="/pages/login.html" class="text-white hover:underline">← Volver al Login</a>
            </p>

        </div>
    </main>

    <!-- Footer -->
    <footer class="flex items-center justify-center gap-4 py-4 text-zinc-500 text-sm">
        <a href="/legal/terminos-de-servicio.html" class="hover:text-zinc-300 transition-colors">Términos</a>
        <a href="/legal/politicas-de-privacidad.html" class="hover:text-zinc-300 transition-colors">Política de
            Privacidad</a>
    </footer>

    <!-- Scripts externos -->
    <script src="/script/auth.js"></script>
    <script src="/script/menu.js"></script>

</body>

</html>
