<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Supabase Config & Auth Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="/script/auth-utils.js?v=11"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticando... — OFFSZN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      animation: spin 1s linear infinite;
    }
  </style>
</head>

<body class="bg-black min-h-screen flex items-center justify-center">

  <div class="text-center">
    <div class="inline-block spinner rounded-full h-12 w-12 border-4 border-zinc-700 border-t-white mb-4"></div>
    <p class="text-white text-lg font-medium">Completando autenticación...</p>
    <p class="text-zinc-500 text-sm mt-2">Serás redirigido en un momento</p>
  </div>

  <script>
    (async () => {
      // Use the global client initialized by auth-utils.js
      const supabaseClient = window.supabaseClient;

      if (!supabaseClient) {
        console.error("Critical: Global Supabase not found. Ensure auth-utils.js is loaded.");
        return;
      }

      // Obtener el parámetro de redirect de la URL
      const urlParams = new URLSearchParams(window.location.search);
      const redirectParam = urlParams.get('redirect');

      console.log('🔍 Auth Callback - Parámetro redirect:', redirectParam);

      try {
        // Obtener la sesión actual de Supabase desde el hash de la URL
        const { data: { session }, error } = await supabaseClient.auth.getSession();

        console.log('📦 Sesión recibida:', session ? 'Sí' : 'No');

        if (error) {
          console.error('❌ Error obteniendo sesión:', error);
          throw error;
        }

        if (session && session.access_token) {
          // Guardar token en localStorage
          localStorage.setItem('authToken', session.access_token);

          // --- SECURITY: Sync Token to Cookie for Server Validation ---
          const token = session.access_token;
          const maxAge = 60 * 60 * 24 * 7;
          document.cookie = `sb-access-token=${token}; path=/; max-age=${maxAge}; SameSite=Strict; Secure`;

          console.log('✅ OAuth exitoso, token guardado en localStorage y cookie');

          // Pequeño delay
          await new Promise(resolve => setTimeout(resolve, 500));

          // 🧠 Lógica Inteligente de Redirección (V3)
          // Verificar si el usuario ya tiene un perfil COMPLETO en la tabla 'users'
          const user = session.user;
          console.log('👤 Usuario:', user.email);

          // Consultar perfil para ver si ya completó el onboarding (tiene nickname)
          const { data: profile, error: profileError } = await supabaseClient
            .from('users')
            .select('nickname')
            .eq('id', user.id)
            .single();

          const hasCompletedOnboarding = profile && profile.nickname;
          console.log('📂 Perfil completado:', hasCompletedOnboarding);

          if (redirectParam === 'carrito') {
            console.log('🛒 Redirigiendo al carrito...');
            window.location.replace('/carrito.html');
          } else if (!hasCompletedOnboarding) {
            // No tiene nickname -> Es Nuevo o Incompleto -> Welcome (Onboarding)
            console.log('✨ Sin onboarding completo -> Welcome');
            window.location.replace('/pages/welcome.html');
          } else {
            // Ya tiene nickname -> Es Recurrente -> Perfil Público (Directo)
            const profilePath = `/${profile.nickname}`;
            console.log(`🏠 Con onboarding completo -> Redirigiendo a ${profilePath}`);
            window.location.replace(profilePath);
          }
        } else {
          throw new Error('No se recibió sesión de OAuth');
        }

      } catch (error) {
        console.error('❌ Error en callback de OAuth:', error);
        alert('Error al completar autenticación. Redirigiendo al registro...');
        setTimeout(() => {
          window.location.replace('/pages/register.html');
        }, 1000);
      }
    })();
  </script>

</body>

</html>
