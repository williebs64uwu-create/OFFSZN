<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="/script/auth-utils.js?v=12"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token del VST - OFFSZN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Geist', sans-serif; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Main card container -->
  <div class="w-full max-w-md bg-[#0a0a0d] border border-[#1f1f24] rounded-2xl p-8 shadow-2xl flex flex-col gap-6 text-center">
    
    <!-- Header -->
    <div class="flex flex-col items-center gap-2">
      <div class="w-16 h-16 bg-white/5 border border-white/10 rounded-full flex items-center justify-center text-3xl mb-2">
        🔌
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight">Vincular VST Exporter</h1>
      <p class="text-xs text-[#8e8e93] px-4 leading-relaxed">
        Obtén tu token de acceso seguro para iniciar sesión en tu plugin de exportación VST desde tu DAW.
      </p>
    </div>

    <!-- LOGGED OUT VIEW -->
    <div id="logged-out-view" class="flex flex-col gap-5 hidden">
      <!-- Google Auth Button -->
      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 py-3.5 bg-zinc-900 border border-zinc-800 rounded-xl text-white hover:bg-zinc-800 transition-colors font-bold text-sm">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        <span>Iniciar sesión con Google</span>
      </button>

      <div class="flex items-center my-1 opacity-20">
        <div class="flex-1 h-px bg-white"></div>
        <span class="px-3 text-xs uppercase font-bold tracking-wider">o</span>
        <div class="flex-1 h-px bg-white"></div>
      </div>

      <!-- Credentials Form -->
      <form onsubmit="loginWithEmail(event)" class="flex flex-col gap-3 text-left">
        <div>
          <label class="block text-[10px] uppercase font-bold text-[#8e8e93] tracking-wider mb-1.5">Correo electrónico</label>
          <input type="email" id="email" required placeholder="tu@email.com" class="w-full bg-black border border-[#1f1f24] rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-700 focus:outline-none focus:border-white transition-all">
        </div>
        <div>
          <label class="block text-[10px] uppercase font-bold text-[#8e8e93] tracking-wider mb-1.5">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-black border border-[#1f1f24] rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-700 focus:outline-none focus:border-white transition-all">
        </div>
        <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3 rounded-xl transition-all text-sm mt-2">
          Iniciar sesión
        </button>
      </form>
      <div id="login-error" class="text-xs text-red-500 hidden"></div>
    </div>

    <!-- LOGGED IN VIEW -->
    <div id="logged-in-view" class="flex flex-col gap-5 hidden">
      <!-- User info badge -->
      <div class="bg-[#141418] border border-[#1f1f24] rounded-xl p-3 text-sm flex items-center justify-between text-left">
        <div>
          <div class="font-bold text-white" id="user-email">Cargando...</div>
          <div class="text-[10px] text-[#8e8e93]">Usuario autenticado en OFFSZN</div>
        </div>
        <span class="w-2.5 h-2.5 bg-green-500 rounded-full"></span>
      </div>

      <!-- Token copy area -->
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-bold text-[#8e8e93] uppercase tracking-wider text-left">Tu Token del Plugin</span>
        <div class="flex gap-2">
          <input type="password" id="token-input" readonly value="" class="flex-1 bg-black border border-[#1f1f24] rounded-xl px-3 py-3 text-xs font-mono text-[#8e8e93] focus:outline-none focus:border-white">
          <button onclick="toggleTokenVisibility()" class="bg-[#141418] border border-[#1f1f24] hover:bg-[#1f1f24] text-white text-xs px-4 rounded-xl transition-colors">
            👁️
          </button>
        </div>
      </div>

      <!-- Copy Action -->
      <button onclick="copyTokenToClipboard()" class="w-full bg-white hover:bg-zinc-200 text-black font-extrabold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
        <span>Copiar Token al Portapapeles</span>
      </button>

      <div id="copy-status" class="text-xs text-green-400 font-medium opacity-0 transition-opacity duration-300">
        ¡Copiado con éxito! Pégalo en tu plugin en FL Studio.
      </div>
    </div>

  </div>

  <script>
    let currentToken = "";
    let supabaseClient = null;

    async function initPage() {
      // 1. Wait for Supabase to resolve
      if (!window.supabaseClient) {
        await new Promise(r => setTimeout(r, 200));
      }
      
      supabaseClient = window.supabaseClient;
      if (!supabaseClient && window.supabase && window.OFFSZN_CONFIG) {
        supabaseClient = window.supabase.createClient(
          window.OFFSZN_CONFIG.SUPABASE_URL,
          window.OFFSZN_CONFIG.SUPABASE_ANON_KEY
        );
        window.supabaseClient = supabaseClient;
      }

      if (!supabaseClient) {
        alert("Error de conexión con Supabase. Verifica tus dependencias.");
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showLoggedIn(session);
      } else {
        showLoggedOut();
      }
    }

    function showLoggedIn(session) {
      document.getElementById('logged-out-view').classList.add('hidden');
      document.getElementById('logged-in-view').classList.remove('hidden');

      currentToken = session.access_token;
      document.getElementById('token-input').value = currentToken;
      document.getElementById('user-email').textContent = session.user.email;
    }

    function showLoggedOut() {
      document.getElementById('logged-in-view').classList.add('hidden');
      document.getElementById('logged-out-view').classList.remove('hidden');
    }

    // Google Login Handler
    async function loginWithGoogle() {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const baseURL = window.location.origin;
      const callbackPath = isLocal ? '/' : '/pages/auth-callback.html';
      const callbackURL = `${baseURL}${callbackPath}?redirect=${encodeURIComponent(window.location.pathname)}`;

      console.log('Redirecting OAuth via callback:', callbackURL);
      
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: callbackURL
        }
      });
      if (error) {
        alert("Error de inicio de sesión con Google: " + error.message);
      }
    }

    // Email Login Handler
    async function loginWithEmail(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');

      errorDiv.classList.add('hidden');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
      } else if (data.session) {
        showLoggedIn(data.session);
      }
    }

    function toggleTokenVisibility() {
      const input = document.getElementById('token-input');
      if (input.type === "password") {
        input.type = "text";
        input.className = input.className.replace("text-[#8e8e93]", "text-white");
      } else {
        input.type = "password";
        input.className = input.className.replace("text-white", "text-[#8e8e93]");
      }
    }

    function copyTokenToClipboard() {
      navigator.clipboard.writeText(currentToken).then(() => {
        const status = document.getElementById('copy-status');
        status.classList.remove('opacity-0');
        setTimeout(() => {
          status.classList.add('opacity-0');
        }, 2000);
      });
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
