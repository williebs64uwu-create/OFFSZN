<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Supabase Config & Auth Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/script/auth-utils.js?v=11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña — OFFSZN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        .btn-primary {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Error Message Styling */
        .form-message {
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
            padding: 10px;
            border-radius: 8px;
        }

        .form-message:not(:empty) {
            display: block;
        }

        .form-message.error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .form-message.success {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>

<body class="bg-black min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full border-b border-white/10">

        <script src="/script/auth-utils.js?v=11"></script>
        <div class="max-w-[1400px] mx-auto px-6 py-2.5 flex items-center justify-between">
            <a href="/" class="hover:opacity-80 transition-opacity">
                <img src="/images/LOGO OFFSZN.webp" alt="OFFSZN"
                    style="height: 30px; width: auto; display: block; transform: scale(1.5); transform-origin: left center;">
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4">
        <div class="w-full max-w-sm">

            <!-- Title -->
            <div class="text-center mb-8">
                <h1 class="text-white text-2xl font-semibold mb-2">Crear nueva contraseña</h1>
                <p class="text-zinc-400 text-sm">Asegúrate de que sea segura.</p>
            </div>

            <!-- Form -->
            <form id="update-password-form" class="space-y-4" novalidate>

                <!-- New Password -->
                <div>
                    <label for="new-password" class="block text-zinc-400 text-sm mb-2 font-medium">Nueva
                        Contraseña</label>
                    <div class="relative">
                        <input type="password" id="new-password" name="password" placeholder="Mínimo 6 caracteres"
                            class="w-full px-4 py-3 bg-[#0f0f0f] border border-white/10 rounded-xl text-white placeholder-zinc-600 focus:outline-none focus:border-purple-600/50 focus:ring-1 focus:ring-purple-600/50 transition-all pr-12"
                            required minlength="6">

                        <button type="button" id="togglePassword"
                            class="absolute inset-y-0 right-0 px-4 flex items-center text-zinc-500 hover:text-white transition-colors cursor-pointer focus:outline-none">
                            <!-- Eye Slash (Visible by default) -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-eye-slash-fill" viewBox="0 0 16 16" id="eyeSlashIcon">
                                <path
                                    d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z" />
                                <path
                                    d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z" />
                            </svg>
                            <!-- Eye Open (Hidden by default) -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-eye-fill" viewBox="0 0 16 16" id="eyeIcon" style="display: none;">
                                <path
                                    d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0 2.5 2.5 0 0 1 5 0 2.5 2.5 0 0 1 5 0 2.5 2.5 0 0 1 5 0" />
                                <path
                                    d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Error/Success Message -->
                <div id="form-message" class="form-message" role="alert"></div>

                <!-- Submit Button -->
                <button type="submit"
                    class="btn-primary w-full py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl transition-all transform hover:scale-[1.02] shadow-[0_4px_20px_rgba(124,58,237,0.3)]">
                    Actualizar Contraseña
                </button>

            </form>

            <script>
                // --- UI LOGIC ---
                const togglePassword = document.querySelector('#togglePassword');
                const passwordInput = document.querySelector('#new-password');
                const eyeIcon = document.querySelector('#eyeIcon');
                const eyeSlashIcon = document.querySelector('#eyeSlashIcon');

                togglePassword.addEventListener('click', function (e) {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    if (type === 'text') {
                        eyeSlashIcon.style.display = 'none';
                        eyeIcon.style.display = 'block';
                    } else {
                        eyeIcon.style.display = 'none';
                        eyeSlashIcon.style.display = 'block';
                    }
                });
            </script>

        </div>
    </main>

    <!-- Footer -->
    <footer class="flex items-center justify-center gap-4 py-4 text-zinc-500 text-sm">
        <a href="/legal/terminos-de-servicio.html" class="hover:text-zinc-300 transition-colors">Términos</a>
        <a href="/legal/politica-de-privacidad.html" class="hover:text-zinc-300 transition-colors">Política de
            Privacidad</a>
    </footer>

    <!-- Scripts externos -->
    <script src="/script/auth.js"></script>

</body>

</html>
