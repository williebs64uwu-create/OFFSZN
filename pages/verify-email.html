<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Supabase Config & Auth Utils -->
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>

    <script src="/script/auth-utils.js?v=11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica tu correo | OFFSZN</title>
    # hola
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        .btn-primary {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-black min-h-screen flex flex-col">

    <script>
        // ?? INSTANT GUARD: Hide page immediately while checking
        document.body.style.opacity = '0';
        document.body.style.pointerEvents = 'none';

        (async () => {
            // Use the global client initialized by auth-utils.js
            const supabaseGuard = window.supabaseClient;

            // Safety check
            if (!supabaseGuard) {
                console.error("Critical: Global Supabase not found. Ensure auth-utils.js is loaded.");
                return;
            }

            const { data: { session } } = await supabaseGuard.auth.getSession();

            if (session) {
                // Already authenticated - redirect home
                console.log("? Ya autenticado, redirigiendo...");
                window.location.replace('/explorar.html');
            } else if (!sessionStorage.getItem('pendingEmailVerification')) {
                // Not from registration flow - redirect to login
                console.log("?? Acceso directo sin registro, redirigiendo...");
                window.location.replace('/pages/login.html');
            } else {
                // Valid state - show page
                document.body.style.opacity = '1';
                document.body.style.pointerEvents = 'auto';
            }
        })();
    </script>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4">
        <div class="w-full max-w-sm text-center">

            <!-- Logo (Clickable -> Home) -->
            <div class="flex justify-center mb-6">
                <a href="/explorar.html" class="hover:opacity-80 transition-opacity" title="Volver al inicio">
                    <img src="/favicon.ico" alt="OFFSZN" style="height: 80px; width: auto;">
                </a>
            </div>

            <!-- Icon -->
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-violet-600/10 flex items-center justify-center">
                    <i class="bi bi-envelope text-2xl text-violet-500"></i>
                </div>
            </div>

            <!-- Title -->
            <div class="mb-4">
                <h1 class="text-white text-2xl font-semibold mb-2">Revisa tu correo</h1>
            </div>

            <!-- Email Display -->
            <div class="mb-8">
                <p class="text-zinc-400 text-sm leading-relaxed mb-4">
                    Hemos enviado un enlace de confirmacin a:
                </p>
                <div
                    class="bg-zinc-900 border border-zinc-800 rounded-lg py-3 px-4 inline-block max-w-full overflow-hidden">
                    <span id="user-email-display" class="text-white font-medium block truncate">tu@email.com</span>
                </div>
                <p class="text-zinc-500 text-xs mt-4">
                    Por favor, confrmalo para activar tu cuenta.
                </p>
            </div>

            <script>
                const emailSpan = document.getElementById('user-email-display');
                const storedEmail = sessionStorage.getItem('pendingEmail');
                if (storedEmail) {
                    emailSpan.textContent = storedEmail;
                }
            </script>

            <!-- Back to Login Button -->
            <a href="/pages/login.html"
                class="btn-primary w-full block py-3.5 bg-white hover:bg-zinc-200 text-black font-bold rounded-xl transition-colors mb-6">
                Volver a Iniciar Sesin
            </a>

            <!-- Spam Hint -->
            <div class="bg-zinc-900/50 border border-white/5 rounded-lg p-3 text-left flex gap-3 mb-6">
                <i class="bi bi-info-circle text-zinc-400 mt-0.5 shrink-0"></i>
                <p class="text-zinc-400 text-xs leading-5">
                    Si no encuentras el correo en tu bandeja de entrada, revisa la carpeta de <strong>Spam</strong> o
                    <strong>Correo no deseado</strong>.
                </p>
            </div>

            <!-- Footer Links -->
            <footer class="flex items-center justify-center gap-4 text-zinc-500 text-sm">
                <a href="/explorar.html" class="hover:text-zinc-300 transition-colors">Volver al Inicio</a>
                <span>|</span>
                <a href="mailto:soporte@offszn.lat" class="hover:text-zinc-300 transition-colors">¿Necesitas ayuda?</a>
            </footer>

        </div>
    </main>

</body>

</html>
