      if (!window.supabaseClient) {
        // Wait briefly if initialization is in progress
        await new Promise(r => setTimeout(r, 200));
      }

      const supabaseGuard = window.supabaseClient;
      if (!supabaseGuard) {
        document.body.style.opacity = '1';
        document.body.style.pointerEvents = 'auto';
        return;
      }

      const { data: { session } } = await supabaseGuard.auth.getSession();

      if (session) {
        console.log("✅ Ya autenticado, redirigiendo...");

          <script>
            // --- UI LOGIC ---
            const togglePassword = document.querySelector('#togglePassword');
            const passwordInput = document.querySelector('#reg-password');
            const eyeIcon = document.querySelector('#eyeIcon');
            const eyeSlashIcon = document.querySelector('#eyeSlashIcon');

            togglePassword.addEventListener('click', function (e) {
              const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
              passwordInput.setAttribute('type', type);

              if (type === 'text') {
                eyeSlashIcon.style.display = 'none';
                eyeIcon.style.display = 'block';
              } else {
                eyeIcon.style.display = 'none';
                eyeSlashIcon.style.display = 'block';
              }
            });

            // --- CUSTOM VALIDATION LOGIC ---
            const emailInput = document.getElementById('reg-email');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');
            const form = document.getElementById('register-form');

            const validateEmail = () => {
              const emailValue = emailInput.value;
              // Strict Regex: anything@anything.2+chars
              const emailPattern = /^[^@\s]+@[^@\s]+\.[a-zA-Z]{2,}$/;

              if (!emailValue) {
                emailError.textContent = 'El correo es obligatorio.';
                emailError.classList.remove('hidden');
                return false;
              }
              // Check pattern manually to be 100% sure
              else if (!emailPattern.test(emailValue)) {
                emailError.textContent = 'Ingresa un correo vÃ¡lido (ej: usuario@gmail.com).';
                emailError.classList.remove('hidden');
                return false;
              } else {
                emailError.classList.add('hidden');
                return true;
              }
            };

            const validatePassword = () => {
              const val = passwordInput.value;
              if (!val) {
                passwordError.textContent = 'La contraseÃ±a es obligatoria.';
                passwordError.classList.remove('hidden');
                return false;
              } else if (val.length < 6) {
                passwordError.textContent = `La contraseÃ±a debe tener al menos 6 caracteres (tienes ${val.length}).`;
                passwordError.classList.remove('hidden');
                return false;
              } else if (val.length > 15) {
                passwordError.textContent = 'La contraseÃ±a no puede exceder 15 caracteres.';
                passwordError.classList.remove('hidden');
                return false;
              } else {
                passwordError.classList.add('hidden');
                return true;
              }
            };

            // Real-time validation
            emailInput.addEventListener('input', validateEmail);
            passwordInput.addEventListener('input', validatePassword);

            // Create global validation handler for form submission in auth.js to call
            window.validateRegisterForm = () => {
              const isEmailValid = validateEmail();
              const isPasswordValid = validatePassword();
              return isEmailValid && isPasswordValid;
            }

            // Global helper to show backend errors inline
            window.showRegisterError = (field, message) => {
              if (field === 'email') {
                emailError.textContent = message;
                emailError.classList.remove('hidden');
                emailInput.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/50');
                // Remove error style on next input
                emailInput.addEventListener('input', () => {
                  emailInput.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/50');
                }, { once: true });
              } else if (field === 'password') {
                passwordError.textContent = message;
                passwordError.classList.remove('hidden');
                passwordInput.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/50');
                // Remove error style on next input
                passwordInput.addEventListener('input', () => {
                  passwordInput.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/50');
                }, { once: true });
              }
            }
          </script>
