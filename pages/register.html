<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — offszn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-black min-h-screen flex flex-col">

  <script>
    // Redirigir si ya está autenticado
    if (localStorage.getItem('authToken')) {
      window.location.replace('/pages/my-products.html');
    }
  </script>

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-4">
    <a href="/" class="text-white font-semibold text-lg hover:text-zinc-300 transition-colors">offszn</a>
    <a href="/pages/login.html"
      class="px-4 py-1.5 text-sm text-white border border-zinc-700 rounded-md hover:bg-zinc-900 transition-colors">
      Iniciar sesión
    </a>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-sm">

      <!-- Title -->
      <div class="text-center mb-8">
        <h1 class="text-white text-2xl font-semibold mb-2">Crear una cuenta</h1>
        <p class="text-zinc-400 text-sm">Únete a offszn y accede a todo el contenido.</p>
      </div>

      <!-- Form -->
      <form id="register-form" class="space-y-4">

        <!-- Email -->
        <div>
          <label for="reg-email" class="block text-zinc-300 text-sm mb-2">Correo electrónico</label>
          <input type="email" id="reg-email" name="email" placeholder="tu@email.com"
            class="w-full px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition-colors"
            required>
        </div>

        <!-- Password -->
        <div>
          <label for="reg-password" class="block text-zinc-300 text-sm mb-2">Contraseña</label>
          <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres"
            class="w-full px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition-colors"
            required>
        </div>

        <!-- Error/Success Message -->
        <div id="form-message" class="form-message" role="alert"></div>

        <!-- Submit Button -->
        <button type="submit"
          class="w-full py-3 bg-white text-black font-medium rounded-lg hover:bg-zinc-200 transition-colors">
          Crear cuenta
        </button>

      </form>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-zinc-800"></div>
        <span class="px-4 text-zinc-500 text-sm">o continúa con</span>
        <div class="flex-1 h-px bg-zinc-800"></div>
      </div>

      <!-- Social Buttons -->
      <div class="flex gap-3">
        <button type="button" onclick="signUpWithGoogle()"
          class="flex-1 flex items-center justify-center gap-2 py-3 bg-zinc-900 border border-zinc-800 rounded-lg text-white hover:bg-zinc-800 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Google
        </button>
        <button type="button" onclick="signUpWithApple()"
          class="flex-1 flex items-center justify-center gap-2 py-3 bg-zinc-900 border border-zinc-800 rounded-lg text-white hover:bg-zinc-800 transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
          </svg>
          Apple
        </button>
      </div>

      <!-- Login Link -->
      <p class="text-center text-zinc-400 text-sm mt-6">
        ¿Ya tienes una cuenta?
        <a href="/pages/login.html" class="text-white hover:underline">Inicia sesión</a>
      </p>

    </div>
  </main>

  <!-- Footer -->
  <footer class="flex items-center justify-center gap-4 py-4 text-zinc-500 text-sm">
    <a href="#" class="hover:text-zinc-300 transition-colors">Términos</a>
    <a href="#" class="hover:text-zinc-300 transition-colors">Política de Privacidad</a>
  </footer>

  <!-- Scripts externos -->
  <script src="/script/auth.js"></script>
  <script src="/script/menu.js"></script>

</body>

</html>
