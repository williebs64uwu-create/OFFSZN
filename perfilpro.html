<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil Profesional | OFFSZN</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Global Styles -->
    <link rel="stylesheet" href="/css/auth-ui.css">
    <link rel="stylesheet" href="/css/global-overlays.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/marketplace.css">
    <link rel="stylesheet" href="/css/sticky-player.css">
    <link rel="stylesheet" href="/css/download-gate.css">
    <link rel="stylesheet" href="/css/hover-card.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/account-settings.css">

    <!-- Wavesurfer JS (For Audio Visualization) -->
    <script src="https://unpkg.com/wavesurfer.js@7.8.1/dist/wavesurfer.min.js"
        integrity="sha384-ygSWewnYW7eIcr0I3npaYTWqi639jP4H2JJa14SEBeK0g9cxj4TYZ4JjO29Fq7ww"
        crossorigin="anonymous"></script>

    <!-- Supabase -->
    <script src="/env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"
        integrity="sha384-o2Uz8M8jf3RRbNF9dFLYtjA2ohqUgp6vUxr43Uzvt8MJkkLNvpXvLCUVbWh+cadK"
        crossorigin="anonymous"></script>
    <script>
        window.supabaseClient = null;
        // Initialization handled by auth-utils.js
    </script>
    <script src="/script/auth-utils.js?v=11"></script>
    <!-- EmailJS Library -->
    <!-- EmailJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"
        integrity="sha384-SALc35EccAf6RzGw4iNsyj7kTPr33K7RoGzYu+7heZhT8s0GZouafRiCg1qy44AS"
        crossorigin="anonymous"></script>
    <script>
        (function () {
            window.addEventListener('load', () => {
                if (typeof emailjs !== 'undefined' && window.EMAILJS_PUBLIC_KEY) {
                    emailjs.init(window.EMAILJS_PUBLIC_KEY);
                }
            });
        })();
    </script>
</head>

<body>
    <!-- Top Banner (Clickable) -->
    <a href="/pages/register.html" class="promo-banner logged-out">
        <span>🎉 <b>OFERTA EXCLUSIVA:</b> REGÍSTRATE Y OBTÉN <b>$5 USD GRATIS</b> EN TU PRIMERA COMPRA <i
                class="bi bi-arrow-right-short" style="font-size: 1.1em; vertical-align: middle;"></i></span>
    </a>

    <!-- ==================== DYNAMIC NAVBAR ==================== -->
    <div id="navbar-placeholder">
        <div style="background: rgba(0, 0, 0, 0.95); height: 58px; width: 100%; border-bottom: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;"></div>
    </div>
    <script src="/script/load-navbar.js?v=20"></script>

    <main class="settings-container">
        <!-- Sidebar Navigation -->
        <aside class="settings-sidebar">
            <div class="profile-card">
                <div class="profile-card-avatar" id="sidebarAvatar">W</div>
                <div class="profile-card-name" id="sidebarName"></div>
                <div class="profile-card-role" id="sidebarRole">Productor</div>
            </div>

            <!-- Mobile Navigation Trigger -->
            <div class="settings-mobile-trigger" id="mobileNavTrigger">
                <div class="trigger-content">
                    <i class="bi bi-person-badge"></i>
                    <span>Perfil</span>
                </div>
                <i class="bi bi-chevron-down trigger-arrow"></i>
            </div>

            <nav class="settings-nav" id="settingsNav">
                <a href="/account-settings.html" class="settings-nav-item">
                    <i class="bi bi-person-gear"></i> Ajustes de cuenta
                </a>
                <a href="/preferencias.html" class="settings-nav-item">
                    <i class="bi bi-sliders"></i> Preferencias
                </a>
                <a href="/perfilpro.html" class="settings-nav-item active">
                    <i class="bi bi-person-badge"></i> Perfil
                </a>
                <a href="/transacciones.html" class="settings-nav-item">
                    <i class="bi bi-currency-dollar"></i> Transacciones
                </a>
                <a href="/siguiendo.html" class="settings-nav-item">
                    <i class="bi bi-people"></i> Siguiendo
                </a>
            </nav>
        </aside>

        <!-- Main Settings Content -->
        <section class="settings-main">
            <div class="settings-section">

                <div class="settings-group">
                    <h2 class="settings-group-title">Perfil Profesional</h2>

                    <div class="avatar-edit-wrapper" style="margin-bottom: 24px;">
                        <div class="avatar-edit-preview" id="formAvatar">W</div>
                        <button class="btn-change-avatar"
                            onclick="AvatarManager.open(document.querySelector('#formAvatar img')?.src)">Cambiar
                            avatar</button>
                    </div>

                    <form id="profileForm" class="form-grid">
                        <div class="form-group">
                            <label for="role">Rol Principal</label>
                            <select id="role" class="form-select">
                                <option value="" disabled selected hidden>Selecciona tu rol</option>
                                <option value="Productor Musical">Productor Musical</option>
                                <option value="Artista / Cantante">Artista / Cantante</option>
                                <option value="Compositor / Songwriter">Compositor / Songwriter</option>
                                <option value="Ingeniero de Mezcla/Master">Ingeniero de Mezcla/Master</option>
                                <option value="Músico / Instrumentista">Músico / Instrumentista</option>
                                <option value="Fan / Consumidor">Fan / Consumidor</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="experience">Nivel de Experiencia</label>
                            <select id="experience" class="form-select">
                                <option value="" disabled selected hidden>Selecciona tu nivel</option>
                                <option value="Principiante (0-1 año)">Principiante (0-1 año)</option>
                                <option value="Intermedio (1-3 años)">Intermedio (1-3 años)</option>
                                <option value="Avanzado (3+ años)">Avanzado (3+ años)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mostUsedDaw">DAW más usado</label>
                            <select id="mostUsedDaw" class="form-select">
                                <option value="" disabled selected hidden>Selecciona tu DAW</option>
                                <option value="FL Studio">FL Studio</option>
                                <option value="Ableton Live">Ableton Live</option>
                                <option value="Logic Pro">Logic Pro</option>
                                <option value="Pro Tools">Pro Tools</option>
                                <option value="Cubase">Cubase</option>
                                <option value="Studio One">Studio One</option>
                                <option value="Reaper">Reaper</option>
                                <option value="Otro">Otro / Varios</option>
                            </select>
                        </div>
                        <div class="form-group full-width" style="position: relative;">
                            <label for="bio">Bio</label>
                            <textarea id="bio" class="form-input" placeholder="Cuéntanos un poco sobre ti..."
                                style="min-height: 120px; resize: vertical;"></textarea>
                            <div id="mentionsDropdown" class="mentions-dropdown"></div>
                            <span id="bioCounter"
                                style="color: #a1a1aa; font-size: 0.75rem; display: block; margin-top: 4px; text-align: right;">0/500</span>
                        </div>



                        <div class="form-actions">
                            <button type="submit" class="btn-primary-sm">Actualizar perfil</button>
                        </div>
                    </form>
                </div>

                <div class="settings-group">
                    <h2 class="settings-group-title">Redes Sociales</h2>
                    <form id="socialsForm" class="form-grid">
                        <div class="form-group">
                            <label for="instagram">Instagram</label>
                            <input type="text" id="instagram" class="form-input" placeholder="@usuario">
                        </div>
                        <div class="form-group">
                            <label for="tiktok">TikTok</label>
                            <input type="text" id="tiktok" class="form-input" placeholder="@usuario">
                        </div>
                        <div class="form-group">
                            <label for="youtube">YouTube</label>
                            <input type="url" id="youtube" class="form-input" placeholder="https://youtube.com/...">
                            <div id="error-youtube" class="field-error"></div>
                        </div>
                        <div class="form-group">
                            <label for="spotify">Spotify</label>
                            <input type="url" id="spotify" class="form-input"
                                placeholder="https://open.spotify.com/...">
                            <div id="error-spotify" class="field-error"></div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary-sm">Guardar redes</button>
                        </div>
                    </form>
                </div>

                <div class="settings-group">
                    <h2 class="settings-group-title">Pagos y Referidos</h2>
                    <form id="paymentsForm" class="form-grid">
                        <div class="form-group full-width">
                            <label for="paypalEmail">Correo de PayPal (para recibir pagos)</label>
                            <div style="position: relative; display: flex; gap: 10px;">
                                <input type="email" id="paypalEmail" class="form-input" placeholder="example@paypal.com">
                                <div id="paypalStatus" style="display: flex; align-items: center;"></div>
                            </div>
                            <span style="color: #a1a1aa; font-size: 0.75rem; margin-top: 4px; display: block;">Es necesario para cobrar tus ventas.</span>
                        </div>

                        <div class="form-group full-width">
                            <label>Tu Código de Referido</label>
                            <div style="background: #000; border: 1px solid #27272a; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-top: 8px;">
                                <code id="refCodeDisplay" style="color: #fff; font-weight: 700; flex-grow: 1;">--------</code>
                                <button type="button" class="btn-primary-sm" id="btnCopyRef" style="padding: 6px 12px; font-size: 0.75rem;">Copiar Link</button>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary-sm">Guardar ajustes de pago</button>
                        </div>
                    </form>
                </div>

            </div>
        </section>
    </main>

    <!-- ==================== GLOBAL FOOTER ==================== -->
    <div id="footer-placeholder"></div>
    <script src="/script/footer.js?v=11"></script>

    <!-- Shared Modals handled by AvatarManager -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"
        integrity="sha384-AMJcAgMUmNt1Zo4ranquGLeT5m7yOrVbtNsNk0oZohvxqKk6RRzXHqlEaS9gFXR7" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"
        integrity="sha384-jzwsV9ieM/KUDMeo+d8dc+jm0GEl7ywPNwg10alB5BodVuC/Kx9RpEnyrl2Om9zH"
        crossorigin="anonymous"></script>
    <script src="/script/avatar-manager.js"></script>

    <!-- Global Scripts -->
    <script src="/script/cart.js?v=11"></script>
    <script src="/script/notifications.js?v=26"></script>
    <script src="/script/navbar.js?v=20" type="module"></script>
    <script src="/script/download-gate.js"></script>
    <script src="/script/sticky-player.js"></script>
    <script src="/script/settings-ui.js?v=2"></script>
    <script src="/script/account-settings.js?v=12" type="module"></script>
</body>
</html>
