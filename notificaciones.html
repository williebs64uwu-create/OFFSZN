            gap: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            align-items: flex-start;
        }

        .notif-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

        .notif-item.unread {
            background: rgba(139, 92, 246, 0.03);
            border-color: rgba(139, 92, 246, 0.2);
        }

            position: absolute;
            top: 18px;
            right: 18px;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            display: none;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
        }

        .notif-item.unread .notif-badge-dot {
            display: block;
        }

            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;

            align-items: center;
            justify-content: center;
            flex-shrink: 0;

            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);

        .notif-item-content {

        }

        .notif-item-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.3;

            overflow: hidden;
            text-overflow: ellipsis;

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Safety Check
            if (typeof window.supabaseClient === 'undefined') return;

            // Wait for session to be ready
            window.addEventListener('offszn-session-ready', async (e) => {
                const user = e.detail.user;
                if (user) {
                    renderFullNotificationsPage(user.id);
                } else {
                    // Force login if no session (Notifications are private)
                    window.location.href = '/pages/login.html';
                }
            });

            async function renderFullNotificationsPage(userId) {
                const listContainer = document.getElementById('full-notifications-list');
                if (!listContainer) return;

                const tenDaysAgo = new Date();
                tenDaysAgo.setDate(tenDaysAgo.getDate() - 10);
                const dateIso = tenDaysAgo.toISOString();

                try {
                    // Use a more robust fetching approach if possible, or process them here.
                    // For now, let's process them to get proper titles, messages and targetUrls.
                    const { data: notifs, error } = await window.supabaseClient
                        .from('notifications')
                        .select('*')
                        .eq('user_id', userId)
                        .gt('created_at', dateIso)
                        .order('created_at', { ascending: false })
                        .limit(50);

                    if (error) throw error;

                    if (!notifs || notifs.length === 0) {
                        listContainer.innerHTML = `
                            <div style="text-align: center; padding: 60px 20px;">
                                <i class="bi bi-bell-slash" style="font-size: 3rem; color: #1a1a1a; margin-bottom: 20px; display: block;"></i>
                                <h2 style="font-size: 1.1rem; color: #fff; margin-bottom: 10px; font-weight: 700;">Sin notificaciones</h2>
                                <p style="color: #666; font-size: 0.85rem;">Te avisaremos cuando haya actividad relevante para ti.</p>
                            </div>`;
                        return;
                    }

                    // --- PRE-PROCESS DATA ---
                    notifs.forEach(n => {
                        if (typeof n.data === 'string') {
                            try { n.parsedData = JSON.parse(n.data); } catch (e) { n.parsedData = {}; }
                        } else {
                            n.parsedData = n.data || {};
                        }
                    });

                    // --- ROBUST ENHANCEMENT: Fetch Actors and Products for Rich Content ---
                    const actorIds = new Set();
                    const usernamesToFetch = new Set();
                    const productIds = new Set();
                    notifs.forEach(n => {
                        const data = n.parsedData;
                        if (n.type === 'product_like') {
                            if (data.liker_id || data.user_id) actorIds.add(data.liker_id || data.user_id);
                            if (data.product_id || data.id) productIds.add(data.product_id || data.id);
                        }
                        if (n.type === 'new_follower') {
                            const fid = data.follower_id || data.id || n.actor_id || (data.user_id !== userId ? data.user_id : null);
                            if (fid) {
                                actorIds.add(fid);
                            } else {
                                // FALLBACK: Extract username from message if data is null/empty
                                const match = n.message && n.message.match(/<strong[^>]*>(.*?)<\/strong>/);
                                if (match && match[1]) {
                                    n._extractedUsername = match[1];
                                    usernamesToFetch.add(match[1]);
                                }
                            }
                        }
                    });

                    let actorsMap = {};
                    let actorsByNameMap = {};
                    if (actorIds.size > 0) {
                        const { data: actors } = await window.supabaseClient.from('users').select('id, nickname, first_name, avatar_url').in('id', Array.from(actorIds));
                        if (actors) actors.forEach(u => { actorsMap[u.id] = u; if (u.nickname) actorsByNameMap[u.nickname] = u; });
                    }

                    if (usernamesToFetch.size > 0) {
                        const { data: rescued } = await window.supabaseClient.from('users').select('id, nickname, first_name, avatar_url').in('nickname', Array.from(usernamesToFetch));
                        if (rescued) rescued.forEach(u => { actorsMap[u.id] = u; if (u.nickname) actorsByNameMap[u.nickname] = u; });
                    }

                    let productsMap = {};
                    if (productIds.size > 0) {
                        const { data: products } = await window.supabaseClient.from('products').select('id, name, product_type, public_slug').in('id', Array.from(productIds));
                        if (products) products.forEach(p => productsMap[p.id] = p);
                    }

                    // Process notifications for rich display
                    const processed = notifs.map(n => {
                        let msg = n.message;
                        let url = n.targetUrl;
                        let extraId = '';

                        // Use pre-parsed data to ensure consistency
                        let data = n.parsedData || {};

                        if (n.type === 'product_like') {
                            const pid = data?.product_id || data?.id || n.product_id;
                            if (pid) extraId = pid;

                            const lid = data?.liker_id || data?.user_id || n.actor_id;
                            const actor = lid ? actorsMap[lid] : null;
                            if (actor) {
                                const name = actor.nickname || actor.first_name || 'Alguien';
                                const p = productsMap[pid];
                                const prodName = data?.product_name || (p ? p.name : 'tu producto');
                                msg = `A <strong>${name}</strong> le gustó tu producto <strong>"${prodName}"</strong>.`;
                            }
                            if (pid) {
                                const p = productsMap[pid];
                                url = (p && window.createSeoLink) ? window.createSeoLink(p) : `/producto.html?id=${pid}`;
                            }
                        } else if (n.type === 'new_follower') {
                            const fid = data?.follower_id || data?.id || n.actor_id || (data?.user_id !== userId ? data?.user_id : null);
                            if (fid) extraId = fid;

                            let actor = (fid && actorsMap[fid]) ? actorsMap[fid] : null;

                            // Fallback to username Map
                            if (!actor && n._extractedUsername) {
                                actor = actorsByNameMap[n._extractedUsername];
                                if (actor) extraId = actor.id;
                            }

                            if (actor) {
                                const name = actor.nickname || actor.first_name || 'Alguien';
                                msg = `<strong>${name}</strong> comenzó a seguirte.`;
                                url = window.createProfileLink ? window.createProfileLink(actor) : `/perfil-publico.html?id=${actor.id}`;
                            } else {
                                // Clean interactive bits if we still fail to find the actor
                                msg = n.message.replace(/class="[^"]*artist-hover-trigger[^"]*"/g, '').replace(/onclick="[^"]*"/g, '');
                            }
                        } else if (n.type === 'new_message') {
                            const convId = data?.conversation_id || data?.id || n.conversation_id;
                            if (convId) extraId = convId;
                            url = convId ? `/mensajes.html?convId=${convId}` : '/mensajes.html';
                        } else if (n.type === 'collab_invitation') {
                            url = '/cuenta/colaboraciones.html?tab=recibidas';
                        } else if (n.type === 'collab_accepted') {
                            url = '/cuenta/colaboraciones.html?tab=mis-invitaciones';
                        }

                        // Final check: if we still have no URL but have an extraId, we'll let notifications.js handle it
                        return { ...n, message: msg, targetUrl: url, extraId: extraId };
                    });

                    // Grouping Logic
                    const grouped = groupNotifications(processed);

                    // Render HTML
                    let finalHtml = '';
                    const groupOrder = ['Hoy', 'Ayer', 'Esta Semana', 'Anteriores'];

                    groupOrder.forEach(groupName => {
                        const items = grouped[groupName];
                        if (items && items.length > 0) {
                            finalHtml += `<div class="notification-group-title">${groupName}</div>`;
                            items.forEach(n => {
                                finalHtml += renderNotificationItem(n);
                            });
                        }
                    });

                    listContainer.innerHTML = finalHtml;

                } catch (err) {
                    console.error("Error at Notifications Page:", err);
                    listContainer.innerHTML = '<p style="color: #666; text-align: center; padding: 40px;">Error al cargar las notificaciones.</p>';
                }
            }

            function groupNotifications(notifs) {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);

                const lastWeek = new Date(today);
                lastWeek.setDate(lastWeek.getDate() - 7);

                const groups = {
                    'Hoy': [],
                    'Ayer': [],
                    'Esta Semana': [],
                    'Anteriores': []
                };

                notifs.forEach(n => {
                    const d = new Date(n.created_at);
                    if (d >= today) groups['Hoy'].push(n);
                    else if (d >= yesterday) groups['Ayer'].push(n);
                    else if (d >= lastWeek) groups['Esta Semana'].push(n);
                    else groups['Anteriores'].push(n);
                });

                return groups;
            }

            function renderNotificationItem(n) {
                const iconClass = getIconClass(n.type);
                const timeStr = formatSimpleTimeAgo(n.created_at);

                // Safety Fallbacks
                const title = n.title || 'Novedad';
                const message = n.message || 'Información de actividad.';

                const extraId = n.extraId || '';
                return `
                    <div class="notif-item ${n.read ? '' : 'unread'}" 
                         data-id="${n.id}" 
                         data-type="${n.type}" 
                         data-extra-id="${extraId}"
                         data-url="${n.targetUrl || ''}"
                         onclick="handleNotificationItemClick(this)">
                        <div class="notif-badge-dot"></div>
                        <div class="notif-item-icon">
                            <i class="fas ${iconClass}"></i>
                        </div>
                        <div class="notif-item-content">
                            <div class="notif-item-message">${message}</div>
                            <div class="notif-item-time">${timeStr}</div>
                        </div>
                    </div>`;
            }

            function getIconClass(type) {
                switch (type) {
                    case 'collab_invitation': return 'fa-handshake';
                    case 'collab_accepted': return 'fa-check-circle';
                    case 'new_follower': return 'fa-user-plus';
                    case 'product_like': return 'fa-heart';
                    case 'product_published': return 'fa-rocket';
                    case 'new_message': return 'fa-comment-dots';
                    default: return 'fa-bell';
                }
            }

            function formatSimpleTimeAgo(date) {
                const seconds = Math.floor((new Date() - new Date(date)) / 1000);
                if (seconds < 60) return "Hace un momento";
                const mins = Math.floor(seconds / 60);
                if (mins < 60) return `Hace ${mins} min`;
                const hours = Math.floor(mins / 60);
                if (hours < 24) return `Hace ${hours} h`;
                const days = Math.floor(hours / 24);
                if (days === 1) return "Ayer";
                if (days < 7) return `Hace ${days} d`;
                return new Date(date).toLocaleDateString();
            }

            // Sync: If navbar marks all read, refresh this page too
            window.addEventListener('notifications-updated', () => {
                // If it was marked all read via navbar, we can re-fetch or just update visuals
                // For simplicity, re-fetch if currently on this tab
                if (document.visibilityState === 'visible' && window.NavbarState) {
                    // Check if markRead was just triggered
                }
            });

            // "Marcar todas como leídas" Button logic
            document.getElementById('mark-all-read-btn')?.addEventListener('click', async () => {
                if (window.NotificationsManager && window.NotificationsManager.markAllAsRead) {
                    await window.NotificationsManager.markAllAsRead();
                    // Instant refresh
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session?.user) renderFullNotificationsPage(session.user.id);
                }
            });
        });
    </script>
