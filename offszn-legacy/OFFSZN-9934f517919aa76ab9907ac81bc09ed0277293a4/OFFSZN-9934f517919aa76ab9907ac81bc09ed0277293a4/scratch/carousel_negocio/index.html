<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
        
        :root {
            --white: #ffffff;
            --black: #000000;
        }

        body {
            margin: 0;
            background: #111;
            font-family: 'Geist', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            gap: 40px;
        }

        .slide-container {
            position: relative;
            width: 1080px;
            height: 1350px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            background: #fff;
        }

        .slide-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 { color: #fff; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; opacity: 0.5; }
    </style>
</head>
<body>

    <h2>Slide 01 - El Gancho</h2>
    <div class="slide-container">
        <img src="slide_1.png" alt="Slide 1">
    </div>

    <h2>Slide 02 - El Objetivo</h2>
    <div class="slide-container">
        <img src="slide_2.png" alt="Slide 2">
    </div>

    <h2>Slide 03 - La Realidad</h2>
    <div class="slide-container">
        <img src="slide_3.png" alt="Slide 3">
    </div>

    <h2>Slide 04 - El Cierre (CTA)</h2>
    <div class="slide-container">
        <img src="slide_4.png" alt="Slide 4">
    </div>

</body>
</html>
