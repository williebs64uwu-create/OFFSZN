<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
        
        :root {
            --white: #F4F4F4;
            --black: #111111;
            --gray: #888888;
        }

        body {
            margin: 0;
            background: #333;
            font-family: 'Geist', sans-serif;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .slide {
            min-width: 1080px;
            width: 1080px;
            height: 1350px;
            padding: 120px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .white-bg { background: var(--white); color: var(--black); }
        .black-bg { background: var(--black); color: var(--white); }

        .heading {
            font-size: 130px;
            font-weight: 900;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -4px;
            margin: 0;
        }

        .heading span {
            color: var(--gray);
        }

        .subtext {
            font-size: 45px;
            font-weight: 400;
            line-height: 1.4;
            color: var(--gray);
            margin-top: 60px;
            max-width: 800px;
        }

        .list-box {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-top: 60px;
        }

        .list-item {
            font-size: 45px;
            font-weight: 500;
            line-height: 1.3;
        }

        .cta-button {
            margin-top: 100px;
            padding: 40px 60px;
            text-align: center;
            font-weight: 900;
            font-size: 40px;
            letter-spacing: 4px;
            width: fit-content;
            text-transform: uppercase;
        }
        
        .white-bg .cta-button {
            background: var(--black);
            color: var(--white);
        }

        .footer {
            position: absolute;
            bottom: 80px;
            left: 120px;
            right: 120px;
            display: flex;
            justify-content: space-between;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <!-- SLIDE 1 -->
    <div class="slide black-bg" id="slide-1">
        <div class="heading">
            HAZ BEATS.<br>
            <span>NO VIDEOS.</span>
        </div>
        
        <div class="subtext">
            El sistema para vender instrumentales en piloto automático.
        </div>
        
        <div class="footer">
            <span>@OFFSZN.LAT</span>
            <span>01 / 02</span>
        </div>
    </div>

    <!-- SLIDE 2 -->
    <div class="slide white-bg" id="slide-2">
        <div class="heading">EL SISTEMA</div>
        
        <div class="list-box">
            <div class="list-item">1. Subes tu instrumental.</div>
            <div class="list-item">2. El video se crea solo.</div>
            <div class="list-item">3. Se publica en YouTube.</div>
        </div>
        
        <div class="cta-button">COMENTA "SISTEMA"</div>
        
        <div class="footer">
            <span>@OFFSZN.LAT</span>
            <span>02 / 02</span>
        </div>
    </div>

</body>
</html>
