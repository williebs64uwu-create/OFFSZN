<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Avatar Cropper</title>
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: #333;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }

        .avatar-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .avatar-modal-content {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 480px;
            max-width: 90%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .avatar-modal-body {
            padding: 0;
            background: #000;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .avatar-crop-container {
            width: 100%;
            height: 100%;
            max-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #avatarCropImg {
            max-width: 100%;
            max-height: 100%;
            display: block;
            opacity: 0;
        }

        /* Cropper Customizations */
        .avatar-crop-container .cropper-view-box,
        .avatar-crop-container .cropper-face {
            border-radius: 50% !important;
        }

        .cropper-view-box {
            outline: none !important;
            border: 2px solid #fff !important;
            box-shadow: 0 0 0 100vw rgba(0, 0, 0, 0.5);
        }

        .avatar-modal-footer {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Avatar Test Page</h1>
    <button onclick="AvatarManager.init().then(() => AvatarManager.open())">Open Avatar Manager</button>

    <label for="dummy-upload" style="background: #555; padding: 10px 20px; cursor: pointer;">Upload Image</label>
    <input type="file" id="dummy-upload" style="display: none" onchange="loadDummyFile(event)">

    <!-- Mock Supabase -->
    <script>
        window.supabaseClient = {
            auth: {
                getSession: async () => ({ data: { session: { user: { id: 'test-user' }, access_token: 'fake-token' } } })
            },
            from: () => ({ select: () => ({ eq: () => ({ maybeSingle: async () => ({ data: { plan: 'free' } }) }) }) })
        };
    </script>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="/script/avatar-manager.js"></script>

    <script>
        function loadDummyFile(e) {
            AvatarManager.init();
            AvatarManager.open();
            AvatarManager.handleFileSelect(e);
        }
    </script>
</body>

</html>
