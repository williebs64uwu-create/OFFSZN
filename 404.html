<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - OFFSZN</title>
    <meta name="description" content="La página que buscas no existe en OFFSZN. Vuelve al inicio para explorar beats, samples y recursos musicales.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth-ui.css">
    <link rel="stylesheet" href="/css/global-overlays.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- 1. Cargar Supabase (Moved to Head for Global Access) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/env.js"></script>
    <script src="/script/auth-utils.js?v=11"></script>
    <script src="/script/notifications.js"></script>
</head>

<body>



    <!-- ==================== EXTRACTED NAVBAR ==================== -->
    <!-- ==================== DYNAMIC NAVBAR ==================== -->
    <div id="navbar-placeholder">
        <div
            style="background: rgba(0, 0, 0, 0.95); height: 58px; width: 100%; border-bottom: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;">
        </div>
    </div>
    <script src="/script/load-navbar.js?v=25"></script>


    <!-- 404 CONTENT ESTÉTICO OFFSZN -->
    <main
        style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 80px); overflow: hidden; text-align: center; padding: 20px;">

        <!-- Fondo 404 Gigante -->
        <div
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(15rem, 30vw, 45rem); font-weight: 900; color: rgba(255, 255, 255, 0.02); z-index: -1; line-height: 1; font-family: 'Geist', sans-serif; pointer-events: none; user-select: none;">
            404
        </div>

        <!-- Contenido principal -->
        <div
            style="z-index: 1; max-width: 500px; padding: 2rem; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
            
            <h1
                style="font-size: 2rem; font-weight: 800; margin-bottom: 1rem; color: #fff; font-family: 'Geist', sans-serif; letter-spacing: -0.5px; line-height: 1.2;">
                Te perdiste<br>en el estudio.</h1>
            <p style="color: #999; margin-bottom: 2rem; font-size: 1rem; line-height: 1.6;">La página que estás
                buscando no existe o está temporalmente fuera de temporada <span
                    style="font-weight: 600; color: #ccc;">(OFFSZN)</span>.</p>

            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a href="/explorar.html"
                    style="background: #fff; color: #000; border: none; padding: 14px 28px; font-weight: 700; border-radius: 12px; cursor: pointer; font-size: 0.95rem; text-decoration: none; font-family: 'Geist', sans-serif; transition: opacity 0.2s; display: flex; align-items: center; gap: 8px;"
                    onmouseover="this.style.opacity='0.9'" 
                    onmouseout="this.style.opacity='1'">
                    <i class="bi bi-house-door-fill"></i> Ir al Inicio
                </a>

                <a href="/explorar.html"
                    style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 14px 28px; font-weight: 600; border-radius: 12px; cursor: pointer; font-size: 0.95rem; text-decoration: none; font-family: 'Geist', sans-serif; transition: background 0.2s; display: flex; align-items: center; gap: 8px;"
                    onmouseover="this.style.background='rgba(255,255,255,0.08)'" 
                    onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                    <i class="bi bi-music-note-list"></i> Explorar Sonidos
                </a>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>

    <!-- BACKDROP -->
    <div class="overlay-backdrop" id="globalBackdrop" onclick="closeAllOverlays()"></div>

    <!-- CART SIDE PANEL -->
    <div class="side-panel" id="globalCartPanel">
        <div class="panel-header">
            <div class="panel-title" style="display: flex; align-items: center; gap: 8px;">
                <div style="position: relative; display: flex;">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-panel-count" class="notification-badge"
                        style="position: absolute; top: -6px; right: -6px; display: flex;">1</span>
                </div>
                Tu Carrito
            </div>
            <button class="panel-close" onclick="closeAllOverlays()">&times;</button>
        </div>
        <!-- ID CHANGED: globalCartItems -> cart-items-container to match script/cart.js -->
        <div class="panel-content" id="cart-items-container">
            <div style="text-align:center; padding: 40px 0; color: #666;">
                <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <p>Tu carrito está vacío</p>
            </div>
        </div>
        <!-- ID ADDED: cart-summary (needed by script) -->
        <div class="cart-total-section" id="cart-summary">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem; color:#fff; font-weight:700;">
                <span>Total:</span>
                <!-- ID CHANGED for JS compatibility -->
                <span id="cart-total-price">$0.00</span>
            </div>
            <!-- ID CHANGED for JS compatibility -->
            <button class="btn-checkout-global" id="cart-checkout-btn"
                onclick="window.location.href='/pages/checkout.html'">
                <i class="bi bi-lock-fill" style="margin-right:6px;"></i> Ir a Pagar Seguro
            </button>

            <!-- TRUST BADGES -->
            <div
                style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
                <p style="font-size: 0.65rem; color: #666; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700;">
                    METODOS DE PAGO SEGUROS</p>

                <div style="display: flex; gap: 12px; justify-content: center; align-items: center; opacity: 0.8; filter: grayscale(100%); transition: filter 0.3s;"
                    onmouseover="this.style.filter='grayscale(0%)'" onmouseout="this.style.filter='grayscale(100%)'">
                    <!-- Global -->
                    <i class="fab fa-cc-paypal" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-visa" style="font-size: 26px; color: #fff;"></i>
                    <i class="fab fa-cc-mastercard" style="font-size: 26px; color: #fff;"></i>

                    <!-- Local (Custom Badges) -->
                    <div class="badge-yape">YAPE</div>
                    <div
                        style="background: #00d3de; color: white; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center;">
                        PLIN</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/script/cart.js"></script>
    <script src="/script/footer.js?v=11"></script>
    <script src="/script/notifications.js"></script>
    <script src="/script/navbar.js?v=20" type="module"></script>
    <!-- Removed redundant inline script -->
</body>

</html>
