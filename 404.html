<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — No Encontrado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        h1,
        .btn-primary {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-black min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full border-b border-white/10">
        <div class="max-w-[1400px] mx-auto px-6 py-2.5 flex items-center justify-between">
            <a href="/" class="hover:opacity-80 transition-opacity">
                <img src="/images/LOGO OFFSZN.webp" alt="OFFSZN"
                    style="height: 30px; width: auto; display: block; transform: scale(1.5); transform-origin: left center;">
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 text-center">

        <div class="relative mb-8">
            <!-- Cool "Glitch" or "Ghost" effect textual representation or simple 404 -->
            <h1
                class="text-[120px] font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-white/10 leading-none select-none">
                404
            </h1>
            <div class="absolute inset-0 blur-2xl bg-violet-600/20 rounded-full z-[-1]"></div>
        </div>

        <h2 class="text-white text-2xl font-semibold mb-4">Te has perdido en el estudio.</h2>
        <p class="text-zinc-400 max-w-md mx-auto mb-8">
            La página que buscas no existe o ha sido movida. Regresa al inicio para seguir creando.
        </p>

        <a href="/"
            class="btn-primary inline-flex items-center gap-2 px-8 py-3 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl transition-all transform hover:scale-[1.02] shadow-[0_4px_20px_rgba(124,58,237,0.3)]">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-left"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
            </svg>
            Volver al Inicio
        </a>

    </main>

    <!-- Footer -->
    <footer class="flex items-center justify-center gap-4 py-4 text-zinc-500 text-sm">
        <span class="opacity-50">OFFSZN © 2026</span>
    </footer>

</body>

</html>
