<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>¡Gracias por tu compra! | Willie Inspired</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="/willieimages/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/willieinspired/assets/store.css?v=5">
</head>
<body>
    <main class="wi-section">
        <div class="wi-container">
            <div class="wi-center">
                <p class="wi-eyebrow">Pago confirmado</p>
                <h1 class="wi-h1" style="margin-top:10px;font-size:clamp(2rem,5vw,3.2rem)" id="thanks">¡Gracias!</h1>
                <p class="wi-lead" style="margin-top:12px" id="sub">Tu compra está lista. Te llegó un correo con todo.</p>
            </div>

            <section class="wi-panel" style="margin:32px auto 0;max-width:820px" id="filesBox">
                <h2 class="wi-h3">Tus archivos</h2>
                <div id="filesList" style="margin-top:14px"></div>
                <div id="licBox" style="margin-top:16px"></div>
                <div class="wi-row" style="margin-top:18px">
                    <a class="wi-btn wi-btn--dark wi-hidden" id="portalBtn" href="#"><i class="bi bi-download"></i> Ir a mis descargas</a>
                    <a class="wi-btn wi-btn--whatsapp wi-hidden" id="waBtn" href="#" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i> Ayuda por WhatsApp</a>
                </div>
            </section>

            <section style="margin:40px auto 0;max-width:820px" id="upsellBox">
                <p class="wi-eyebrow">Completa tu sonido</p>
                <h2 class="wi-h3" style="margin:6px 0 14px">Lo que más compran después</h2>
                <div class="wi-grid" id="upsells"></div>
            </section>

            <section class="wi-panel" style="margin:40px auto 0;max-width:820px;text-align:center">
                <h2 class="wi-h3">Únete a la comunidad</h2>
                <p class="wi-muted" style="margin:8px 0 16px">Videos, módulos y revisión de tus mezclas. Desde 9 USD al mes.</p>
                <a class="wi-btn wi-btn--ghost" href="/willieinspired/comunidad/suscribirse">Ver planes</a>
            </section>
        </div>
    </main>

    <script src="/willieinspired/assets/store.js?v=14"></script>
    <script>
    (async () => {
        const cat = await WI.init({ active: '' });
        const $ = WI.$;
        const last = WI.session.get('wi_last_order') || {};
        WI.cart.clear();

        if (last.lines?.length) {
            const names = last.lines.map((l) => WI.esc(l.title)).join(', ');
            $('#sub').textContent = `Compraste: ${last.lines.map((l) => l.title).join(', ')}.`;
            $('#filesList').innerHTML = `<p class="wi-muted">${names}</p>`;
            if (last.deliveryToken) {
                $('#portalBtn').href = `/willieinspired/descargas.html?token=${encodeURIComponent(last.deliveryToken)}`;
                $('#portalBtn').classList.remove('wi-hidden');
            }
            const manual = last.lines.filter((l) => l.delivery === 'manual' || l.delivery === 'service');
            if (manual.length) {
                $('#filesList').insertAdjacentHTML('beforeend', `<div class="wi-note" style="margin-top:12px"><i class="bi bi-clock"></i><div>${manual.map((l) => WI.esc(l.title)).join(', ')}: te lo envío a tu correo en menos de 24 horas.</div></div>`);
            }
        } else {
            $('#sub').textContent = 'Revisa tu correo: ahí está todo.';
            $('#filesBox').classList.add('wi-hidden');
        }
        if (last.licenses?.length) {
            $('#licBox').innerHTML = last.licenses.map((k) => `<p class="wi-subtle">${WI.esc(k.name)}</p><p style="font-family:monospace;font-weight:800;font-size:1.05rem">${WI.esc(k.key)}</p>`).join('');
        }
        $('#waBtn').href = WI.wa(`Hola Willie! Compré en la tienda (correo: ${last.email || ''}). Tengo una duda.`);
        $('#waBtn').classList.remove('wi-hidden');
        WI.track('purchase', { meta: { method: last.method, total: last.totalUsd } });
        if (last.eventId && !WI.session.get('wi_purchase_sent_' + last.eventId)) {
            WI.session.set('wi_purchase_sent_' + last.eventId, 1);
            WI.pixel('Purchase', { currency: 'USD', value: last.totalUSD || 0, content_type: 'product', content_ids: (last.lines || []).map((l) => l.id) }, last.eventId);
        }

        // Upsell: el primer producto comprado sugiere su upsell (o un default de escalera)
        const first = (last.lines || []).map((l) => cat.byId.get(l.id)).find(Boolean);
        const ids = first?.upsells?.length ? first.upsells : ['plantilla-trap-definitivo', 'servicio-preset-personalizado-para-tu-voz', 'bundle-todos-los-presets'];
        const ups = ids.map((id) => cat.byId.get(id)).filter((p) => WI.isBuyable(p) && !(last.lines || []).some((l) => l.id === p.id)).slice(0, 3);
        $('#upsells').innerHTML = ups.length ? ups.map(WI.card).join('') : '';
        if (!ups.length) $('#upsellBox').classList.add('wi-hidden');
        ups.forEach((p) => WI.track('upsell_view', { productId: p.id }));
        $('#upsells').addEventListener('click', (e) => { const a = e.target.closest('[data-add]'); if (a) WI.track('upsell_click', { productId: a.dataset.add }); });
    })();
    </script>
</body>
</html>
